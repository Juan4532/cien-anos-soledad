<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ---- Personajes page ---- */
  .page-head{
    padding: 56px 56px 40px;
    display:grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items:end;
  }
  .page-head .meta-row{
    display:flex; gap:24px; align-items:baseline; justify-content:flex-end;
    color: var(--ink-soft);
  }
  .page-head .meta-row .v{
    font-family: var(--font-display); font-size: 32px; color: var(--accent);
    font-style: italic;
  }
  .page-head .meta-row .stat{display:flex; flex-direction:column; align-items:flex-start; gap:4px}
  .page-head .meta-row .stat .l{font-size: 10px}

  /* Toolbar */
  .toolbar{
    padding: 16px 56px;
    border-top: var(--border-double);
    border-bottom: var(--border-double);
    display:flex; gap: 36px; align-items:center; flex-wrap:wrap;
  }
  .toolbar-group{display:flex; gap: 8px; align-items:center}
  .toolbar-group .label{margin-right: 6px}

  /* Main split */
  .ptg-main{
    padding: 32px 56px 80px;
    display:grid; grid-template-columns: 320px 1fr 320px; gap: 32px;
    align-items:start;
  }

  /* Character list (left) */
  .roster{display:flex; flex-direction:column}
  .roster .roster-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-bottom: 12px; border-bottom: 1px solid var(--rule);
    margin-bottom: 6px;
  }
  .roster-row{
    display:grid; grid-template-columns: 28px 1fr auto;
    gap: 14px; align-items:center;
    padding: 10px 0; border-bottom: 1px dotted var(--ink-faint);
    cursor: pointer; transition: background .12s;
    margin: 0 -8px; padding-left: 8px; padding-right: 8px;
  }
  .roster-row:hover{background: var(--accent-bg)}
  .roster-row.is-active{background: var(--accent-bg)}
  .roster-row.is-active .name{color: var(--accent)}
  .roster-row.is-dimmed{opacity: 0.32}
  .roster-row .rsym{
    width: 28px; height: 28px; flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color: var(--accent); opacity: 0.7;
  }
  .roster-row.is-active .rsym{opacity: 1}
  .roster-row .rdot{color: var(--ink-faint); font-size: 18px; line-height: 1}
  .roster-row .name{
    font-family: var(--font-display); font-size: 16px; line-height:1.2;
    color: var(--ink);
  }
  .roster-row .name .alias{
    display:block; font-family: var(--font-italic); font-style:italic;
    font-size: 12px; color: var(--ink-soft); margin-top:2px;
  }
  .roster-row .gen-tag{
    font-family: var(--font-label); font-size: 9px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent);
  }

  /* Graph (center) */
  .graph-wrap{
    position:relative; aspect-ratio: 1 / 1; width:100%;
    background:
      radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.15) 100%);
    overflow: hidden;
  }
  html[data-mode="light"] .graph-wrap{
    background:
      radial-gradient(ellipse 600px 400px at 30% 70%, rgba(110,74,31,0.05), transparent 60%),
      radial-gradient(ellipse 400px 600px at 80% 20%, rgba(110,74,31,0.06), transparent 60%);
  }
  .graph-wrap svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  /* Character nodes on rings — medallón circular */
  .char-label{
    position:absolute; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition: opacity .25s;
    z-index: 2;
  }
  .cl-medal{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--accent-soft);
    background: var(--portrait);
    background-image: repeating-linear-gradient(45deg, transparent 0 6px, var(--portrait-stripe) 6px 7px);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    transition: border-color .15s, box-shadow .15s, width .15s, height .15s;
  }
  .char-label.gen-1 .cl-medal{ width:44px; height:44px }
  .char-label:hover .cl-medal{ border-color: var(--accent) }
  .char-label.is-selected .cl-medal{
    width:44px; height:44px;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(232,185,74,0.22);
  }
  .cl-inits{
    font-family: var(--font-display); font-size:11px; line-height:1;
    color: var(--ink-faint); letter-spacing:0.02em;
  }
  .char-label .cl-name{
    font-family: var(--font-display);
    font-size:11px; line-height:1.1;
    color: var(--ink-soft); letter-spacing:-0.005em;
    background: var(--bg);
    padding: 1px 5px;
    white-space: nowrap;
  }
  html[data-mode="light"] .char-label .cl-name{font-weight:500}
  .char-label.is-external .cl-name{font-style:italic; font-family: var(--font-italic)}
  .char-label.gen-1 .cl-name{ font-size:13px }
  .char-label:hover .cl-name{ color: var(--accent) }
  .char-label.is-selected{ z-index:5 }
  .char-label.is-selected .cl-name{
    color: var(--accent);
    font-style:italic; font-family: var(--font-italic);
    font-size:13px;
  }
  .char-label.is-dim{opacity:0.22; pointer-events:none}

  .graph-center{
    position:absolute; left:50%; top:50%; transform: translate(-50%, -50%);
    font-family: var(--font-italic); font-style: italic;
    font-size: 18px; color: var(--ink-faint);
    pointer-events:none;
    letter-spacing: 0.04em;
    background: var(--bg); padding: 4px 10px;
  }

  .ring-label{
    position:absolute; transform: translate(-50%, -50%);
    font-family: var(--font-label); font-size: 10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent); opacity: 0.6; pointer-events:none;
    background: var(--bg); padding: 1px 5px;
  }

  /* Detail panel (right) */
  .detail-panel{
    position:sticky; top: 24px;
    padding: 28px;
    background: var(--bg-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  html[data-mode="light"] .detail-panel{border-radius:0; border: 1px solid var(--rule)}
  /* Detail panel emblem (replaces portrait) */
  .detail-emblem{
    width: 100%; aspect-ratio: 1; margin-bottom: 20px;
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    border-top: 1px solid var(--accent-soft);
    border-bottom: 1px solid var(--accent-soft);
    padding: 24px 0;
  }
  .detail-emblem .emblem-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color: var(--ink-faint); font-size: 28px;
  }
  .detail-name{
    font-family: var(--font-display); font-size: 34px; line-height: 1.0;
    font-style: italic; font-weight: 400; margin-bottom: 6px;
    letter-spacing:-0.01em; color: var(--ink);
  }
  html[data-mode="light"] .detail-name{font-style:normal; font-weight:500}
  .detail-alias{
    font-family: var(--font-italic); font-style: italic;
    font-size: 16px; color: var(--accent); margin-bottom: 18px;
  }
  .detail-meta{
    display:flex; flex-direction:column; gap:8px;
    padding: 14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    margin-bottom: 16px;
  }
  .detail-meta .row{display:flex; gap:12px; justify-content:space-between; align-items:baseline}
  .detail-meta .k{font-family: var(--font-label); font-size:10px; letter-spacing:var(--label-letter); text-transform:var(--label-transform); color:var(--ink-soft)}
  .detail-meta .v{font-family: var(--font-display); font-size:14px; color:var(--ink); text-align:right}
  .detail-bio{
    font-size: 15px; line-height: 1.65; color: var(--ink); margin-bottom: 18px;
  }
  .detail-bio em{font-family: var(--font-italic); font-style:italic; color: var(--accent)}
  .detail-link{
    display:inline-block; padding-bottom:3px;
    font-family: var(--font-label); font-size:11px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent); border-bottom: 1px solid var(--accent);
    text-decoration: none;
  }
  .detail-rels{margin-top: 18px}
  .detail-rels h4{
    font-family: var(--font-label); font-size: 10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-soft); margin-bottom: 10px;
  }
  .detail-rels .rel{
    display:flex; align-items:center; gap: 10px;
    padding: 8px 0; border-bottom:1px dotted var(--ink-faint);
    cursor:pointer;
  }
  .detail-rels .rel:hover .rname{color: var(--accent)}
  .detail-rels .rel .swatch{width:14px; height:2px; background:var(--accent); flex:0 0 auto}
  .detail-rels .rel .swatch.thin{background:var(--ink-faint); height:1px}
  .detail-rels .rel .swatch.dash{background:transparent; border-top:1px dashed var(--ink-faint); height:0}
  .detail-rels .rel .swatch.x{background:transparent; border-top: 1px solid var(--accent); transform: rotate(8deg)}
  .detail-rels .rel .rname{font-family: var(--font-display); font-size: 14px; flex:1; color:var(--ink)}
  .detail-rels .rel .rkind{font-family: var(--font-italic); font-style:italic; font-size:12px; color: var(--ink-faint)}

  /* Legend bar */
  .legend-bar{
    padding: 16px 56px 32px;
    display:flex; gap: 32px; flex-wrap:wrap;
    color: var(--ink-soft);
  }
  .legend-bar .item{display:flex; gap:10px; align-items:center; font-family: var(--font-label); font-size:10px; letter-spacing:var(--label-letter); text-transform:var(--label-transform)}
  .legend-bar .item .sw{width:18px; height:2px; background:var(--accent)}
  .legend-bar .item .sw.thin{background:var(--ink-faint); height:1px}
  .legend-bar .item .sw.dash{background:transparent; border-top:1px dashed var(--ink-faint); width:18px}

</style>
</head>
