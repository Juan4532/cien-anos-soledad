<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cien años de soledad — Edición interactiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #0c0b09;
      color: #e0d8cc;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Nav ──────────────────────────────────────────────────────────────── */

    #app-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: 48px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(10,9,7,0.98);
      z-index: 500;
    }

    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      user-select: none;
    }

    .nav-tabs { display: flex; }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,0.32);
      padding: 0 1.25rem;
      height: 48px;
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.65); }
    .tab-btn.active { color: rgba(255,255,255,0.88); border-bottom-color: #D4933A; }

    /* ── Layout ───────────────────────────────────────────────────────────── */

    #app-main { flex: 1; position: relative; overflow: hidden; }

    .view {
      position: absolute;
      inset: 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .view.active { visibility: visible; opacity: 1; pointer-events: auto; }

    /* ── Grafo ────────────────────────────────────────────────────────────── */

    #cy { width: 100%; height: 100%; display: block; }

    #graph-controls-wrap {
      position: absolute;
      bottom: 1.5rem; right: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
      z-index: 100;
    }

    #graph-controls { display: flex; gap: 0.4rem; margin-top: 0.75rem; }

    .filter-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      padding: 0.6rem 0;
    }
    .filter-group + .filter-group {
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .filter-group-label {
      font-size: 0.58rem;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      user-select: none;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: flex-end;
      max-width: 420px;
    }

    .edge-chip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.45);
      padding: 0.25rem 0.55rem;
      font-size: 0.65rem;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }
    .edge-chip .chip-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .edge-chip.active  { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.2); }
    .edge-chip.inactive { opacity: 0.35; }

    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.4);
      padding: 0.3rem 0.65rem;
      font-size: 0.68rem;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); }
    .btn.active { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); border-color: rgba(255,255,255,0.25); }

    /* Panel lateral */
    #panel {
      position: absolute;
      top: 0; right: 0;
      width: 340px; height: 100%;
      background: rgba(10,9,7,0.96);
      border-left: 1px solid rgba(255,255,255,0.07);
      padding: 2.25rem 1.75rem 2rem;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 200;
      backdrop-filter: blur(16px);
    }
    #panel.visible { transform: translateX(0); }

    #panel-close {
      position: absolute;
      top: 1rem; right: 1.1rem;
      background: none; border: none;
      color: rgba(255,255,255,0.28);
      font-size: 1.4rem; line-height: 1;
      cursor: pointer; padding: 0.2rem 0.4rem;
      transition: color 0.1s;
    }
    #panel-close:hover { color: rgba(255,255,255,0.8); }

    .panel-badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-left: 2px solid;
      margin-bottom: 0.9rem;
    }

    #panel-nombre {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 400; line-height: 1.2;
      color: #f5ede0; margin-bottom: 0.3rem;
    }

    #panel-apodos {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.32);
      font-style: italic;
      margin-bottom: 1.1rem;
    }

    .panel-meta {
      display: flex; gap: 2rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .meta-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .meta-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.28); }
    .meta-value { font-size: 0.88rem; color: rgba(255,255,255,0.68); }

    #panel-desc {
      font-size: 0.82rem; line-height: 1.75;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1.5rem;
    }

    .rels-title {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: rgba(255,255,255,0.22);
      margin-bottom: 0.65rem;
    }

    .rel-item {
      display: flex; align-items: flex-start; gap: 0.55rem;
      padding: 0.55rem 0.65rem;
      background: rgba(255,255,255,0.03);
      border-radius: 3px; margin-bottom: 0.4rem;
      cursor: pointer; transition: background 0.1s;
    }
    .rel-item:hover { background: rgba(255,255,255,0.07); }
    .rel-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 0.3rem; flex-shrink: 0; }
    .rel-body { display: flex; flex-direction: column; gap: 0.1rem; }
    .rel-name { font-size: 0.8rem; color: rgba(255,255,255,0.68); }
    .rel-type { font-size: 0.67rem; color: rgba(255,255,255,0.28); }

    /* Leyenda grafo */
    #leyenda {
      position: absolute;
      bottom: 1.5rem; left: 1.5rem;
      z-index: 100;
    }
    #ley-edges {
      position: absolute;
      bottom: 1.5rem; left: 12rem;
      z-index: 100;
    }
    .ley-title { font-size: 0.57rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.18); margin-bottom: 0.5rem; }
    .ley-row { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.28rem; }
    .ley-dot { width: 9px; height: 9px; border-radius: 50%; }
    .ley-label { font-size: 0.67rem; color: rgba(255,255,255,0.32); }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: rgba(10,9,7,0.92);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.35rem 0.65rem;
      font-size: 0.74rem; color: rgba(255,255,255,0.75);
      border-radius: 3px; pointer-events: none;
      opacity: 0; transition: opacity 0.1s;
      z-index: 999; white-space: nowrap;
    }
    #tooltip.show { opacity: 1; }

    /* ── Cronología ───────────────────────────────────────────────────────── */

    #view-cronologia { overflow-y: auto; overscroll-behavior: contain; }

    .tl-inner {
      max-width: 740px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    /* Filtros */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .f-btn {
      display: flex; align-items: center; gap: 0.35rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.38);
      padding: 0.22rem 0.6rem;
      font-size: 0.64rem; cursor: pointer;
      border-radius: 2px; font-family: 'Inter', sans-serif;
      letter-spacing: 0.06em; transition: all 0.12s;
    }
    .f-btn:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.72); }
    .f-btn.on { color: var(--c); border-color: var(--c); background: rgba(255,255,255,0.06); }
    .f-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

    /* Capítulo */
    .cap-section { margin-bottom: 2.5rem; }

    .cap-heading {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem; font-weight: 400; font-style: italic;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.04em;
      margin-bottom: 0.85rem;
      padding-left: 0.6rem;
      border-left: 2px solid rgba(255,255,255,0.07);
    }

    /* Evento */
    .evt-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 3px;
      margin-bottom: 0.5rem;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .evt-card:hover { border-color: rgba(255,255,255,0.11); }

    .evt-header {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.8rem 0.9rem;
      cursor: pointer;
    }

    .evt-badge {
      flex-shrink: 0;
      font-size: 0.58rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      padding: 0.18rem 0.42rem; border-radius: 2px;
      margin-top: 0.18rem;
      background: var(--bg); color: var(--c);
    }

    .evt-title {
      flex: 1;
      font-size: 0.83rem; font-weight: 400; line-height: 1.45;
      color: rgba(255,255,255,0.75);
    }

    .evt-arrow {
      background: none; border: none;
      color: rgba(255,255,255,0.22);
      font-size: 0.65rem; cursor: pointer;
      padding: 0.1rem 0.15rem; margin-top: 0.12rem;
      flex-shrink: 0;
      transition: transform 0.2s, color 0.15s;
    }
    .evt-card.open .evt-arrow { transform: rotate(90deg); color: rgba(255,255,255,0.45); }

    .evt-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .evt-card.open .evt-body { max-height: 320px; }

    .evt-body-inner { padding: 0 0.9rem 0.9rem; }

    .evt-chips {
      display: flex; flex-wrap: wrap; gap: 0.28rem;
      margin-bottom: 0.6rem;
    }

    .p-chip {
      font-size: 0.67rem;
      padding: 0.16rem 0.48rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 2px; color: rgba(255,255,255,0.5);
      cursor: pointer; transition: all 0.12s;
      white-space: nowrap;
    }
    .p-chip:hover {
      background: rgba(255,255,255,0.11);
      color: rgba(255,255,255,0.88);
      border-color: rgba(255,255,255,0.25);
    }

    .evt-desc {
      font-size: 0.79rem; line-height: 1.78;
      color: rgba(255,255,255,0.42);
    }
  </style>
</head>
<body>

<nav id="app-nav">
  <span class="nav-brand">Cien años de soledad</span>
  <div class="nav-tabs">
    <button class="tab-btn active" data-view="personajes">Personajes</button>
    <button class="tab-btn" data-view="cronologia">Cronología</button>
  </div>
</nav>

<main id="app-main">

  <!-- ── Grafo ───────────────────────────────────────────────────────────── -->
  <div id="view-personajes" class="view active">
    <div id="cy"></div>

    <aside id="panel">
      <button id="panel-close">×</button>
      <span class="panel-badge" id="panel-badge"></span>
      <h2 id="panel-nombre"></h2>
      <p id="panel-apodos"></p>
      <div class="panel-meta">
        <div class="meta-item">
          <span class="meta-label">Generación</span>
          <span class="meta-value" id="panel-gen"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Primera aparición</span>
          <span class="meta-value" id="panel-cap"></span>
        </div>
      </div>
      <p id="panel-desc"></p>
      <div>
        <div class="rels-title">Relaciones</div>
        <div id="panel-rels-list"></div>
      </div>
      <div style="margin-top:1.25rem">
        <div class="rels-title">Eventos</div>
        <div id="panel-evts-list"></div>
      </div>
    </aside>

    <div id="leyenda"><div class="ley-title">Generaciones</div></div>
    <div id="ley-edges"><div class="ley-title">Relaciones</div></div>

    <div id="graph-controls-wrap">
      <div class="filter-group">
        <span class="filter-group-label">Generaciones</span>
        <div id="gen-filters" class="filter-chips"></div>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Relaciones</span>
        <div id="edge-filters" class="filter-chips"></div>
      </div>
      <div id="graph-controls">
        <button class="btn" id="btn-fit">Encuadrar</button>
        <button class="btn active" id="btn-all">Todos</button>
      </div>
    </div>
  </div>

  <!-- ── Cronología ──────────────────────────────────────────────────────── -->
  <div id="view-cronologia" class="view">
    <div class="tl-inner">
      <div class="filter-bar" id="filter-bar"></div>
      <div id="timeline"></div>
    </div>
  </div>

</main>

<div id="tooltip"></div>

<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

<script>
'use strict';

// ── Datos ────────────────────────────────────────────────────────────────────

const PERSONAJES = [
  { id: 'JOSE_ARCADIO_BUENDIA_FUNDADOR', nombre: 'José Arcadio Buendía', apodos: ['el fundador', 'el patriarca'], generacion: 1, capitulo: 1, descripcion: 'Patriarca y fundador de Macondo. Obstinado e imaginativo, apasionado por los inventos y la alquimia. Pierde la cordura y pasa sus últimos años atado al castaño del patio hasta morir.' },
  { id: 'URSULA_IGUARAN', nombre: 'Úrsula Iguarán', apodos: [], generacion: 1, capitulo: 1, descripcion: 'Matriarca de la familia Buendía. Prima y esposa de José Arcadio Buendía. Voz de la razón y sustento real de la familia. Emprendedora, incansable y longeva (vive más de 110 años). Pierde la vista en su vejez pero lo disimula memorizando distancias y rutinas.' },
  { id: 'JOSE_ARCADIO_HIJO', nombre: 'José Arcadio', apodos: [], generacion: 2, capitulo: 1, descripcion: 'Hijo mayor de José Arcadio Buendía y Úrsula. Nacido antes de la fundación de Macondo. Físicamente enorme y tatuado. Tiene una relación con Pilar Ternera de la que nace Arcadio. Se marcha con los gitanos y regresa años después. Se casa con Rebeca. Muere asesinado de un disparo sin herida visible, con olor a pólvora.' },
  { id: 'AURELIANO_BUENDIA_CORONEL', nombre: 'Aureliano Buendía', apodos: ['el Coronel', 'Aurelito'], generacion: 2, capitulo: 1, descripcion: 'Segundo hijo de JAB y Úrsula, primer ser humano nacido en Macondo. Silencioso y retraído, con capacidades presientes desde niño. Se convierte en coronel liberal, pierde 32 levantamientos armados, engendra 17 hijos con 17 mujeres. Firma la rendición y pasa sus últimos años haciendo pececitos de oro. Muere olvidado por todos.' },
  { id: 'AMARANTA_BUENDIA', nombre: 'Amaranta', apodos: [], generacion: 2, capitulo: 2, descripcion: 'Hija de JAB y Úrsula. Ama a Pietro Crespi pero lo rechaza cruelmente llevando a su suicidio. También rechaza a Gerineldo Márquez. Se quema la mano con carbones y lleva una venda negra como penitencia. Muere virgen, tras coser su propio sudario, sabiendo el día exacto de su muerte.' },
  { id: 'REBECA', nombre: 'Rebeca', apodos: [], generacion: 2, capitulo: 3, descripcion: 'Huérfana adoptada por los Buendía. Llega cargando los huesos de sus padres en una cesta. Come tierra y cal compulsivamente en momentos de ansiedad. Enamorada de Pietro Crespi, acaba casándose con José Arcadio hijo. Tras la muerte de su esposo se recluye en su casa y vive aislada hasta morir.' },
  { id: 'ARCADIO', nombre: 'Arcadio', apodos: [], generacion: 3, capitulo: 3, descripcion: 'Hijo de José Arcadio hijo y Pilar Ternera, criado por los Buendía ignorando su verdadero origen. Gobernante civil y militar de Macondo nombrado por el Coronel, resulta un tirano despiadado. Se casa con Santa Sofía de La Piedad. Es fusilado al amanecer al final de la guerra.' },
  { id: 'AURELIANO_JOSE', nombre: 'Aureliano José', apodos: [], generacion: 3, capitulo: 4, descripcion: 'Hijo del Coronel Aureliano Buendía y Pilar Ternera. Criado por Remedios Moscote como propio y luego por Amaranta. Desarrolla una obsesión incestuosa por su tía Amaranta, quien finalmente lo rechaza. Es asesinado por soldados en un teatro.' },
  { id: 'AURELIANO_TRISTE', nombre: 'Aureliano Triste', apodos: [], generacion: 3, capitulo: 11, descripcion: 'Uno de los 17 hijos del Coronel. Establece una fábrica de hielo en Macondo, cumpliendo el sueño del patriarca. Trae el ferrocarril a la aldea, abriendo la puerta a la compañía bananera y la modernidad.' },
  { id: 'AURELIANO_CENTENO', nombre: 'Aureliano Centeno', apodos: [], generacion: 3, capitulo: 11, descripcion: 'Uno de los 17 hijos del Coronel. Se queda en Macondo para ayudar a Aureliano Triste en la producción de hielo. Descubre por casualidad cómo fabricar helados, iniciando un nuevo negocio.' },
  { id: 'AURELIANO_AMADOR', nombre: 'Aureliano Amador', apodos: [], generacion: 3, capitulo: 11, descripcion: 'Uno de los 17 hijos del Coronel. Único superviviente del exterminio de sus hermanos. Se refugia con los indios. Reaparece años después ante la puerta de la casa Buendía, donde nadie lo reconoce, y es abatido por dos policías en el acto.' },
  { id: 'REMEDIOS_LA_BELLA', nombre: 'Remedios la Bella', apodos: ['Remedios'], generacion: 4, capitulo: 8, descripcion: 'Hija de Arcadio y Santa Sofía. De belleza sobrenatural que provoca locura y muerte en los hombres. Deambula desnuda sin entender el efecto que causa. Asciende al cielo un día mientras dobla sábanas en el patio, desapareciendo entre las nubes.' },
  { id: 'JOSE_ARCADIO_SEGUNDO', nombre: 'José Arcadio Segundo', apodos: [], generacion: 4, capitulo: 7, descripcion: 'Gemelo de Aureliano Segundo. Lidera la huelga de los trabajadores bananeros. Único superviviente de la masacre de las 3000 personas. Pasa sus últimos años oculto en el cuarto de Melquíades estudiando los pergaminos. Muere al mismo tiempo que su gemelo.' },
  { id: 'AURELIANO_SEGUNDO', nombre: 'Aureliano Segundo', apodos: [], generacion: 4, capitulo: 7, descripcion: 'Gemelo de José Arcadio Segundo. Robusto y jovial. Se casa con Fernanda del Carpio pero mantiene a Petra Cotes como amante toda su vida. Amasa una fortuna gracias a la fértil multiplicación del ganado. Muere del mismo tumor en la garganta al mismo instante que su gemelo.' },
  { id: 'MEME', nombre: 'Meme', apodos: ['Renata Remedios', 'Renata'], generacion: 5, capitulo: 11, descripcion: 'Hija de Aureliano Segundo y Fernanda. Social y alegre. Se enamora del mecánico Mauricio Babilonia. Cuando Fernanda descubre la relación hace disparar a Mauricio y envía a Meme a un convento, donde pierde el habla para siempre. Muere de vieja sin haber vuelto a ser feliz.' },
  { id: 'JOSE_ARCADIO_QUINTO', nombre: 'José Arcadio', apodos: [], generacion: 5, capitulo: 11, descripcion: 'Hijo de Aureliano Segundo y Fernanda, enviado al seminario de Roma para convertirse en papa. Regresa sin haberse ordenado. Restaura parte de la casa Buendía. Es ahogado por unos niños en la piscina, que le roban el oro de Úrsula.' },
  { id: 'AMARANTA_URSULA', nombre: 'Amaranta Úrsula', apodos: [], generacion: 5, capitulo: 11, descripcion: 'Hija menor de Aureliano Segundo y Fernanda. Vital, hermosa y resuelta. Estudia en Bruselas y regresa con su esposo Gastón, convencida de poder revivir Macondo. Se enamora de su sobrino Aureliano Babilonia sin saber que lo es. Muere desangrada tras dar a luz al último Buendía.' },
  { id: 'AURELIANO_BABILONIA', nombre: 'Aureliano Babilonia', apodos: [], generacion: 6, capitulo: 14, descripcion: 'Hijo de Meme y Mauricio Babilonia, criado en secreto por Fernanda. Vive recluido estudiando los pergaminos y aprendiendo sánscrito. Se enamora de su tía Amaranta Úrsula sin saber el parentesco. Descifra los manuscritos en el momento en que el viento arrasa Macondo.' },
  { id: 'AURELIANO_ULTIMO', nombre: 'Aureliano', apodos: [], generacion: 7, capitulo: 20, descripcion: 'Hijo de Aureliano Babilonia y Amaranta Úrsula. Nace con cola de cerdo, el signo de incesto que la familia temió durante siete generaciones. Su madre muere en el parto. Abandonado en el jardín, es devorado por las hormigas. Su muerte coincide con la destrucción de Macondo.' },
  { id: 'MELQUIADES', nombre: 'Melquíades', apodos: [], generacion: null, capitulo: 1, descripcion: 'Gitano anciano y sabio. Introduce inventos y tecnología en Macondo. Muere y regresa de entre los muertos varias veces. Escribe unos pergaminos proféticos en sánscrito que no serán descifrados hasta 100 años después.' },
  { id: 'PILAR_TERNERA', nombre: 'Pilar Ternera', apodos: [], generacion: null, capitulo: 2, descripcion: 'Habitante original de Macondo. Lectora de cartas, adivina y proxeneta. Se acuesta con José Arcadio (hijo) y con el Coronel, engendrando hijos de ambos hermanos. Vive 145 años y muere en su mecedora en el burdel que regenta al final de la novela.' },

  { id: 'PADRE_NICANOR', nombre: 'Padre Nicanor', apodos: [], generacion: null, capitulo: 4, descripcion: 'Sacerdote que se queda en Macondo para construir una iglesia. Demuestra el poder de Dios levitándose 12 centímetros tras beber chocolate, repitiendo la demostración hasta recaudar fondos suficientes.' },

  { id: 'EVT_PRIMERA_VISITA_GITANOS',       titulo: 'Primera visita de los gitanos: el imán de Melquíades',           tipo: 'llegada',        capitulo: 1,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Melquíades y su banda de gitanos llegan a Macondo exhibiendo un imán. José Arcadio Buendía, fascinado, los sigue arrastrando ollas, cazuelas y tenazas. Intercambia sus mulas y una partida de chivos por dos lingotes imantados, convencido de que con ellos podrá sacar oro del subsuelo.' },
  { id: 'EVT_SEGUNDA_VISITA_GITANOS',       titulo: 'Segunda visita de los gitanos: catalejo y lupa gigante',          tipo: 'llegada',        capitulo: 1,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Melquíades regresa con un catalejo y una lupa del tamaño de un tambor. Declara que "la ciencia ha eliminado las distancias". José Arcadio Buendía intercambia los imanes y tres monedas coloniales por la lupa, fascinado por sus posibilidades militares.' },
  { id: 'EVT_JAB_GUERRA_SOLAR',             titulo: 'José Arcadio Buendía experimenta con la lupa como arma solar',    tipo: 'otro',           capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                                            descripcion: 'José Arcadio Buendía usa la lupa para concentrar los rayos del sol y prende fuego a una pila de material. Se quema. Redacta un manual sobre la "guerra solar" y lo envía a las autoridades militares sin obtener respuesta.' },
  { id: 'EVT_JAB_TIERRA_REDONDA',           titulo: 'José Arcadio Buendía proclama que la tierra es redonda',          tipo: 'descubrimiento', capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN','MELQUIADES'],                                              descripcion: 'Usando el catalejo y un astrolabio, José Arcadio Buendía concluye que la tierra es redonda como una naranja. Úrsula destroza el astrolabio. Melquíades, de regreso, lo avala públicamente y le regala un globo terráqueo.' },
  { id: 'EVT_REGALO_LABORATORIO_ALQUIMIA',  titulo: 'Melquíades regala el laboratorio de alquimia',                    tipo: 'otro',           capitulo: 1,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Como muestra de amistad y admiración por el espíritu científico de José Arcadio Buendía, Melquíades le regala un completo laboratorio de alquimia. Allí pasará largas horas José Arcadio intentando transmutar metales.' },
  { id: 'EVT_JAB_FUNDE_MONEDAS',            titulo: 'José Arcadio Buendía funde los doblones de oro de Úrsula',        tipo: 'otro',           capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN'],                                                          descripcion: 'En su empeño alquímico, José Arcadio Buendía funde los treinta doblones de oro que Úrsula había heredado y guardado toda la vida. El resultado es un chicharrón carbonizado que no pudo desprenderse del fondo del caldero.' },
  { id: 'EVT_GITANOS_DENTADURA_POSTIZA',    titulo: 'Melquíades regresa rejuvenecido con dentadura postiza',            tipo: 'llegada',        capitulo: 1,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Melquíades regresa a Macondo con una dentadura postiza que lleva en el bolsillo y solo se pone para hablar. Presenta la dentadura como el último invento de los sabios de Memphis. José Arcadio Buendía pierde interés en la alquimia.' },
  { id: 'EVT_TOQUE_HIELO',                  titulo: 'El Coronel toca el hielo por primera vez',                        tipo: 'descubrimiento', capitulo: 1,  participantes: ['AURELIANO_BUENDIA_CORONEL','JOSE_ARCADIO_BUENDIA_FUNDADOR','JOSE_ARCADIO_HIJO'],                          descripcion: 'José Arcadio Buendía lleva a sus hijos a la carpa de los gitanos donde hay un bloque de hielo. José Arcadio (hijo) se niega a tocarlo. El Coronel Aureliano coloca la mano y la retira en el acto creyendo que está ardiendo. Este momento abre la primera frase de la novela.' },
  { id: 'EVT_EXPEDICION_NORTE',             titulo: 'Expedición de José Arcadio Buendía hacia el norte',               tipo: 'otro',           capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                                            descripcion: 'José Arcadio Buendía organiza una expedición hacia el norte con herramientas, brújula y mapas, buscando una ruta que una Macondo con los grandes inventos del mundo. La expedición dura varios meses.' },
  { id: 'EVT_GALEON_SELVA',                 titulo: 'La expedición descubre un galeón español en la selva',             tipo: 'descubrimiento', capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                                            descripcion: 'Durante la expedición al norte, el grupo encuentra en medio de la selva un galeón español varado sobre tierra firme, cubierto de flores silvestres y con su mástil intacto. El hallazgo revela que en ese lugar alguna vez hubo mar.' },
  { id: 'EVT_JAB_ENCUENTRA_MAR',            titulo: 'La expedición llega al mar por el norte',                          tipo: 'descubrimiento', capitulo: 1,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                                            descripcion: 'Continuando la expedición, José Arcadio Buendía llega a un mar de aguas grises "color de ceniza" batidas por olas ruidosas. Grita que Macondo está rodeada de agua. Regresa convencido de que el pueblo nunca tendrá salida al mar.' },
  { id: 'EVT_PRIMERA_MUERTE_MELQUIADES',    titulo: 'Primera muerte de Melquíades (en Singapur)',                       tipo: 'muerte',         capitulo: 1,  participantes: ['MELQUIADES'],                                                                                              descripcion: 'Un gitano armenio informa a José Arcadio Buendía de que Melquíades ha muerto de fiebres en los pantanos de Singapur. Esta es su primera muerte; en el capítulo 2 regresa porque no pudo soportar la soledad.' },
  { id: 'EVT_GITANOS_NUEVOS',               titulo: 'Los gitanos regresan con la estera voladora',                       tipo: 'llegada',        capitulo: 2,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','JOSE_ARCADIO_HIJO','PILAR_TERNERA'],                                         descripcion: 'Los mismos saltimbanquis que llevaron el hielo regresan cuando Amaranta cumple sus cuarenta días. Traen una estera voladora y otros juegos de artificio; los vecinos desentierran sus últimos pedacitos de oro para volar sobre las casas. José Arcadio (hijo) y Pilar Ternera se comportan como novios dichosos entre la muchedumbre.' },
  { id: 'EVT_RELACION_PILAR_JOSE_ARCADIO',  titulo: 'Relación entre José Arcadio y Pilar Ternera',                   tipo: 'otro',           capitulo: 2,  participantes: ['JOSE_ARCADIO_HIJO','PILAR_TERNERA'],                                                                       descripcion: 'Pilar Ternera, mujer alegre que adivina el porvenir con las barajas y llegó a Macondo con el éxodo fundacional, despierta una obsesión en José Arcadio (hijo) por su olor a humo. Él la visita de noche por la puerta que ella deja entornada. Aureliano vive el amor vicariamente a través de sus relatos.' },
  { id: 'EVT_PARTIDA_JOSE_ARCADIO_GITANOS', titulo: 'José Arcadio se marcha con los gitanos',                         tipo: 'partida',        capitulo: 2,  participantes: ['JOSE_ARCADIO_HIJO'],                                                                                       descripcion: 'El sábado siguiente a su noche con la joven gitana, José Arcadio (hijo) se amarra un trapo rojo en la cabeza y se va con la farándula sin avisar a nadie. Úrsula lo descubre y sale a buscarlo; se aleja tanto que ya no piensa en regresar.' },
  { id: 'EVT_MATRIMONIO_JAB_URSULA',         titulo: 'Boda de José Arcadio Buendía y Úrsula Iguarán',                  tipo: 'boda',           capitulo: 2,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN'],                                                          descripcion: 'JAB y Úrsula, primos criados juntos, se casan a pesar de la oposición familiar por miedo a hijos con cola de cerdo. La boda dura tres días con banda y cohetes. Úrsula lleva un pantalón de lona con hebilla de hierro para impedir la consumación; así pasan varios meses.' },
  { id: 'EVT_FANTASMA_PRUDENCIO',           titulo: 'El fantasma de Prudencio Aguilar acosa a los Buendía',            tipo: 'otro',           capitulo: 2,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN','PRUDENCIO_AGUILAR'],                                      descripcion: 'El fantasma de Prudencio Aguilar aparece repetidamente: junto a la tinaja tapándose el cuello, en el baño, bajo la lluvia. JAB amenaza con matarlo cada vez que regrese; el muerto no se va. Conmovido por su soledad, JAB promete marcharse del pueblo para siempre.' },
  { id: 'EVT_TRAVESIA_SIERRA',              titulo: 'Travesía de la sierra: el éxodo fundacional',                     tipo: 'otro',           capitulo: 2,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN'],                                                          descripcion: 'JAB lidera un grupo de familias en una travesía de más de dos años a través de la sierra, huyendo del fantasma de Prudencio Aguilar y buscando el mar. Viajan en sentido contrario a Riohacha. Úrsula hace parte del camino en hamaca por las varices. Nunca encuentran el mar.' },
  { id: 'EVT_NACIMIENTO_JOSE_ARCADIO_HIJO', titulo: 'Nacimiento de José Arcadio (hijo) durante la travesía',           tipo: 'nacimiento',     capitulo: 2,  participantes: ['JOSE_ARCADIO_HIJO','URSULA_IGUARAN','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                      descripcion: 'Con el estómago estragado por la carne de mico y el caldo de culebra, Úrsula da a luz a un hijo con todas sus partes humanas a los catorce meses de travesía, antes de llegar al lugar donde se fundará Macondo.' },
  { id: 'EVT_NACIMIENTO_AMARANTA',          titulo: 'Nacimiento de Amaranta',                                          tipo: 'nacimiento',     capitulo: 2,  participantes: ['AMARANTA_BUENDIA','URSULA_IGUARAN','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                      descripcion: 'Úrsula da a luz a Amaranta un jueves de enero a las dos de la madrugada. Es liviana y acuosa como una lagartija pero con todas sus partes humanas. Aureliano, que rondaba la casa de Pilar Ternera, no se entera hasta que la casa se llena de gente.' },
  { id: 'EVT_JOSE_ARCADIO_GITANA',          titulo: 'José Arcadio (hijo) pasa la noche con la joven gitana',           tipo: 'otro',           capitulo: 2,  participantes: ['JOSE_ARCADIO_HIJO'],                                                                                       descripcion: 'En la feria de la estera voladora, José Arcadio ve a la mujer más bella de su vida: una gitana muy joven, agobiada de abalorios. Se aprieta contra ella hasta que cede. Van a la carpa, donde pasan la noche mientras la farándula comparte el espacio sin pudor.' },
  { id: 'EVT_EMBARAZO_PILAR_JOSE_ARCADIO',  titulo: 'Pilar Ternera anuncia su embarazo a José Arcadio',               tipo: 'otro',           capitulo: 2,  participantes: ['JOSE_ARCADIO_HIJO','PILAR_TERNERA'],                                                                       descripcion: 'Durante la feria, Pilar Ternera le dice a José Arcadio: "Ahora sí eres un hombre. Vas a tener un hijo." La noticia lo encierra en casa durante días y agrava su angustia hasta que decide irse con los gitanos.' },
  { id: 'EVT_BUSQUEDA_URSULA',              titulo: 'Úrsula sale a buscar a su hijo y desaparece',                     tipo: 'partida',        capitulo: 2,  participantes: ['URSULA_IGUARAN','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                          descripcion: 'Al descubrir que José Arcadio se ha ido con los gitanos, Úrsula sale a buscarlo siguiendo el camino que le indican. Se aleja tanto que ya no piensa en regresar. JAB forma un grupo para buscarla; vuelven tres días después sin haberla encontrado.' },
  { id: 'EVT_REGRESO_URSULA',               titulo: 'Regreso de Úrsula con la ruta de la ciénaga',                    tipo: 'llegada',        capitulo: 2,  participantes: ['URSULA_IGUARAN','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                          descripcion: 'Casi cinco meses después, Úrsula regresa exaltada con ropas de un estilo desconocido, acompañada de gente del otro lado de la ciénaga (a solo dos días de camino). Ha descubierto la ruta que su marido no encontró; Macondo queda conectada con el mundo exterior.' },
  { id: 'EVT_LLEGADA_REBECA',               titulo: 'Llegada de Rebeca a la casa Buendía',                            tipo: 'llegada',        capitulo: 2,  participantes: ['REBECA','URSULA_IGUARAN','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                descripcion: 'Una huérfana de once años llamada Rebeca llega con una carta y una cesta con los huesos de sus padres. Los Buendía la adoptan. Trae consigo la plaga del insomnio.' },
  { id: 'EVT_PLAGA_INSOMNIO',               titulo: 'La plaga del insomnio se extiende por Macondo',                  tipo: 'desastre',       capitulo: 2,  participantes: ['REBECA','VISITACION','JOSE_ARCADIO_BUENDIA_FUNDADOR','URSULA_IGUARAN'],                                   descripcion: 'La plaga del insomnio contraída por Rebeca se extiende a toda la familia y al pueblo. Provoca pérdida progresiva de la memoria. Aureliano etiqueta los objetos para no olvidar sus nombres.' },
  { id: 'EVT_REGRESO_MELQUIADES',           titulo: 'Melquíades regresa de la muerte',                                tipo: 'llegada',        capitulo: 2,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Melquíades regresa de entre los muertos porque no pudo soportar la soledad. Trae el remedio para la plaga del insomnio y escribe sus pergaminos proféticos en sánscrito.' },
  { id: 'EVT_LLEGADA_APOLINAR_MOSCOTE',     titulo: 'Llegada de Don Apolinar Moscote como magistrado',                tipo: 'llegada',        capitulo: 2,  participantes: ['APOLINAR_MOSCOTE'],                                                                                        descripcion: 'El gobierno envía a Don Apolinar Moscote como corregidor con una orden de pintar las casas de azul. José Arcadio Buendía lo expulsa pero regresa con soldados y su familia, entre ellos su hija Remedios de nueve años.' },
  { id: 'EVT_LLEGADA_PIETRO_CRESPI',        titulo: 'Llegada de Pietro Crespi',                                       tipo: 'llegada',        capitulo: 2,  participantes: ['PIETRO_CRESPI','REBECA','AMARANTA_BUENDIA'],                                                              descripcion: 'El músico y técnico italiano Pietro Crespi llega para instalar y enseñar a tocar la pianola. Rebeca y Amaranta se enamoran de él.' },
  { id: 'EVT_RELACION_PILAR_CORONEL',       titulo: 'Relación entre el Coronel Aureliano y Pilar Ternera',           tipo: 'otro',           capitulo: 2,  participantes: ['AURELIANO_BUENDIA_CORONEL','PILAR_TERNERA'],                                                              descripcion: 'Pilar Ternera se ofrece como intermediaria entre Aureliano y Remedios Moscote. En un episodio nocturno tienen relaciones sexuales. Ella queda embarazada de Aureliano José.' },
  { id: 'EVT_NACIMIENTO_ARCADIO',           titulo: 'Nacimiento de Arcadio',                                          tipo: 'nacimiento',     capitulo: 2,  participantes: ['ARCADIO','PILAR_TERNERA','JOSE_ARCADIO_HIJO'],                                                            descripcion: 'Hijo de José Arcadio (hijo) y Pilar Ternera. Llevado a la casa de los Buendía con dos semanas de vida. Se le llama Arcadio y nunca se le revela su verdadera identidad.' },
  { id: 'EVT_NACIMIENTO_AURELIANO_JOSE',    titulo: 'Nacimiento de Aureliano José',                                   tipo: 'nacimiento',     capitulo: 2,  participantes: ['AURELIANO_JOSE','PILAR_TERNERA','AURELIANO_BUENDIA_CORONEL'],                                              descripcion: 'Hijo del Coronel Aureliano Buendía y Pilar Ternera. Adoptado por la primera esposa del Coronel, Remedios Moscote, quien lo acepta como propio.' },
  { id: 'EVT_MATRIMONIO_AURELIANO_REMEDIOS',titulo: 'Boda del Coronel Aureliano y Remedios Moscote',                  tipo: 'boda',           capitulo: 3,  participantes: ['AURELIANO_BUENDIA_CORONEL','REMEDIOS_MOSCOTE','PADRE_NICANOR'],                                           descripcion: 'Tras la primera menstruación de Remedios, el padre Nicanor oficia la boda en el salón de la casa. Remedios lleva el primer trozo de pastel a José Arcadio Buendía atado al castaño.' },
  { id: 'EVT_LLEGADA_PADRE_NICANOR',        titulo: 'Llegada del padre Nicanor Reyna',                                tipo: 'llegada',        capitulo: 3,  participantes: ['PADRE_NICANOR'],                                                                                           descripcion: 'El sacerdote llega horrorizado de que el pueblo viva sin religión. Decide quedarse a hacer la obra de Dios y construir una iglesia.' },
  { id: 'EVT_LEVITACION_PADRE_NICANOR',     titulo: 'El padre Nicanor levita sobre el suelo',                         tipo: 'milagro',        capitulo: 3,  participantes: ['PADRE_NICANOR'],                                                                                           descripcion: 'El padre Nicanor bebe una taza de chocolate y se eleva doce centímetros sobre el suelo durante varios días, recaudando así el dinero necesario para construir la iglesia.' },
  { id: 'EVT_LOCURA_JOSE_ARCADIO_BUENDIA',  titulo: 'Locura y atadura de José Arcadio Buendía al castaño',           tipo: 'otro',           capitulo: 3,  participantes: ['JOSE_ARCADIO_BUENDIA_FUNDADOR','AURELIANO_BUENDIA_CORONEL','URSULA_IGUARAN'],                            descripcion: 'José Arcadio Buendía sufre un arrebato violento tras perder la noción lineal del tiempo. Diez hombres lo atan al castaño del patio, donde permanecerá hasta su muerte hablando en latín.' },
  { id: 'EVT_MUERTE_MELQUIADES',            titulo: 'Muerte definitiva de Melquíades',                                tipo: 'muerte',         capitulo: 3,  participantes: ['MELQUIADES','JOSE_ARCADIO_BUENDIA_FUNDADOR'],                                                              descripcion: 'Melquíades sufre un rápido proceso de envejecimiento y se ahoga en el río. Es el primer enterramiento en Macondo, lo que simbólicamente hace que el pueblo pierda la inocencia de su fundación.' },
  { id: 'EVT_SUICIDIO_PIETRO_CRESPI',       titulo: 'Suicidio de Pietro Crespi',                                      tipo: 'muerte',         capitulo: 4,  participantes: ['PIETRO_CRESPI','AMARANTA_BUENDIA'],                                                                       descripcion: 'Cansado de esperar a Amaranta, Pietro Crespi le propone matrimonio y ella lo rechaza con crueldad. Su hermano Bruno lo encuentra muerto con las muñecas cortadas. Amaranta se quema la mano en penitencia.' },
  { id: 'EVT_REGRESO_JOSE_ARCADIO_HIJO',    titulo: 'Regreso de José Arcadio a Macondo',                              tipo: 'llegada',        capitulo: 4,  participantes: ['JOSE_ARCADIO_HIJO'],                                                                                       descripcion: 'Un hombre enorme cubierto de tatuajes llega a la casa. Solo Úrsula lo reconoce como su hijo José Arcadio, desaparecido con los gitanos. Ha dado la vuelta al mundo 65 veces.' },
  { id: 'EVT_MATRIMONIO_JOSE_ARCADIO_REBECA',titulo:'Boda de José Arcadio (hijo) y Rebeca',                           tipo: 'boda',           capitulo: 4,  participantes: ['JOSE_ARCADIO_HIJO','REBECA','PADRE_NICANOR'],                                                             descripcion: 'Tras una relación furtiva, José Arcadio y Rebeca se casan, a pesar de que Úrsula no permite que los recién casados entren en la casa.' },
  { id: 'EVT_MUERTE_REMEDIOS_MOSCOTE',      titulo: 'Muerte de Remedios Moscote',                                     tipo: 'muerte',         capitulo: 4,  participantes: ['REMEDIOS_MOSCOTE','AURELIANO_BUENDIA_CORONEL'],                                                           descripcion: 'Remedios Moscote muere de madrugada a causa de una infección, posiblemente ligada a la pérdida de los gemelos que gestaba. Su ausencia devuelve al Coronel a la soledad y la introspección.' },
  { id: 'EVT_PRIMERA_GUERRA_LIBERAL',       titulo: 'El Coronel lidera el primer levantamiento armado',               tipo: 'guerra',         capitulo: 5,  participantes: ['AURELIANO_BUENDIA_CORONEL','GERINELDO_MARQUEZ','APOLINAR_MOSCOTE'],                                       descripcion: 'Denunciando el fraude electoral conservador, el Coronel Aureliano Buendía sale con veintiún hombres para unirse al ejército liberal. Arcadio es nombrado líder civil y militar de Macondo.' },
  { id: 'EVT_TIRANIA_ARCADIO',              titulo: 'Tiranía de Arcadio en Macondo',                                  tipo: 'conflicto',      capitulo: 5,  participantes: ['ARCADIO','URSULA_IGUARAN','APOLINAR_MOSCOTE'],                                                             descripcion: 'Arcadio gobierna Macondo como un déspota: impone cuatro decretos diarios, fusila a un trompetista, y está a punto de ejecutar a Don Apolinar Moscote. Úrsula lo detiene y lo humilla públicamente.' },
  { id: 'EVT_FUSILAMIENTO_CORONEL_SALVADO', titulo: 'El Coronel ante el pelotón de fusilamiento; lo salva su hermano',tipo: 'guerra',         capitulo: 7,  participantes: ['AURELIANO_BUENDIA_CORONEL','JOSE_ARCADIO_HIJO','GERINELDO_MARQUEZ'],                                    descripcion: 'Capturado tras la derrota, el Coronel es conducido ante el paredón. En el último momento, su hermano José Arcadio cruza la calle con una escopeta y ordena no disparar.' },
  { id: 'EVT_FUSILAMIENTO_ARCADIO',         titulo: 'Fusilamiento de Arcadio',                                        tipo: 'muerte',         capitulo: 7,  participantes: ['ARCADIO','SANTA_SOFIA_DE_LA_PIEDAD'],                                                                     descripcion: 'Arcadio es ejecutado al amanecer tras la derrota liberal. Muere gritando "Viva el partido liberal". Sus últimas palabras van dirigidas a Santa Sofía de la Piedad y a sus hijos aún no nacidos.' },

const panel   = document.getElementById('panel');
const tooltip = document.getElementById('tooltip');

function genLabel(g) { return g ? `${g}ª generación` : 'Externo'; }

function openPanel(node) {
  const d = node.data();
  const col = GEN[d.generacion] || GEN[null];

  const badge = document.getElementById('panel-badge');
  badge.textContent = genLabel(d.generacion);
  badge.style.cssText = `background:${col.bg}55;color:${col.border};border-left-color:${col.border}`;

  document.getElementById('panel-nombre').textContent = d.label;
  document.getElementById('panel-apodos').textContent = d.apodos && d.apodos.length ? d.apodos.join(' · ') : '';
  document.getElementById('panel-gen').textContent   = genLabel(d.generacion);
  document.getElementById('panel-cap').textContent   = `Capítulo ${d.capitulo}`;
  document.getElementById('panel-desc').textContent  = d.descripcion;

  const list = document.getElementById('panel-rels-list');
  list.innerHTML = '';
  node.connectedEdges().forEach(e => {
    const isSrc  = e.data('source') === d.id;
    const other  = isSrc ? e.target() : e.source();
    const color  = EDGE_C[e.data('tipo')] || EDGE_C.otro;
    const item   = document.createElement('div');
    item.className = 'rel-item';
    item.innerHTML = `<span class="rel-dot" style="background:${color}"></span><div class="rel-body"><span class="rel-name">${isSrc ? '→' : '←'} ${other.data('label')}</span><span class="rel-type">${e.data('subtipo') || e.data('tipo')}</span></div>`;
    item.addEventListener('click', () => {
      const t = cy.getElementById(other.data('id'));
      cy.animate({ center: { eles: t }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 380 });
      t.emit('tap');
    });
    list.appendChild(item);
  });
  if (!list.children.length) list.innerHTML = '<span style="font-size:.75rem;color:rgba(255,255,255,.2)">Sin relaciones registradas</span>';

  // Eventos del personaje
  const evtsList = document.getElementById('panel-evts-list');
  evtsList.innerHTML = '';
  const charEvts = EVENTOS.filter(e => e.participantes.includes(d.id));
  if (!charEvts.length) {
    evtsList.innerHTML = '<span style="font-size:.75rem;color:rgba(255,255,255,.2)">Sin eventos registrados</span>';
  } else {
    charEvts.forEach(evt => {
      const c    = TIPO_C[evt.tipo] || '#888';
      const item = document.createElement('div');
      item.className = 'rel-item';
      item.innerHTML = `
        <span class="rel-dot" style="background:${c}"></span>
        <div class="rel-body">
          <span class="rel-name">${evt.titulo}</span>
          <span class="rel-type">Cap. ${evt.capitulo} · ${tipoLabel(evt.tipo)}</span>
        </div>`;
      item.addEventListener('click', () => {
        document.querySelector('.tab-btn[data-view="cronologia"]').click();
        setTimeout(() => {
          const card = document.querySelector(`.evt-card[data-id="${evt.id}"]`);
          if (!card) return;
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('open');
          card.style.borderColor = c;
          setTimeout(() => { card.style.borderColor = ''; }, 1800);
        }, 200);
      });
      evtsList.appendChild(item);
    });
  }

  panel.classList.add('visible');
  highlight(node);
}

function closePanel() {
  panel.classList.remove('visible');
  cy.elements().removeClass('highlighted faded');
}

function highlight(node) {
  cy.elements().removeClass('highlighted faded');
  node.addClass('highlighted');
  node.connectedEdges().addClass('highlighted');
  node.openNeighborhood().addClass('highlighted');
  cy.elements().not('.highlighted').addClass('faded');
}

cy.on('tap', 'node', evt => openPanel(evt.target));
cy.on('tap', evt => { if (evt.target === cy) closePanel(); });
document.getElementById('panel-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

cy.on('mouseover', 'node', evt => {
  const pos = evt.renderedPosition;
  tooltip.textContent = evt.target.data('label');
  tooltip.style.left  = (pos.x + 14) + 'px';
  tooltip.style.top   = (pos.y - 8) + 'px';
  tooltip.classList.add('show');
});
cy.on('mouseout',  'node', () => tooltip.classList.remove('show'));
cy.on('pan zoom',         () => tooltip.classList.remove('show'));

// Controles grafo ─────────────────────────────────────────────────────────────

const EDGE_LABELS = {
  parental:         'Familia',
  marital:          'Matrimonio',
  amorosa:          'Amorosa',
  conflicto:        'Conflicto',
  amistad:          'Amistad',
  mentor_discipulo: 'Mentor',
  politica:         'Política',
  otro:             'Otro',
};

const activeEdgeTypes = new Set(Object.keys(EDGE_C));
const activeGens      = new Set([...Object.keys(GEN).map(k => k === 'null' ? null : Number(k) || k)]);
// null key in GEN needs special handling: store as the string 'null' in the Set
activeGens.delete(null);
activeGens.add('null');

function nodeGenKey(n) {
  const g = n.data('generacion');
  return g == null ? 'null' : String(g);
}

function applyFilters() {
  cy.nodes().forEach(n => {
    activeGens.has(nodeGenKey(n)) ? n.show() : n.hide();
  });
  cy.edges().forEach(e => {
    const srcOk  = activeGens.has(nodeGenKey(e.source()));
    const tgtOk  = activeGens.has(nodeGenKey(e.target()));
    const typeOk = activeEdgeTypes.has(e.data('tipo'));
    (srcOk && tgtOk && typeOk) ? e.show() : e.hide();
  });
}

// Chips de generación
const genFiltersEl = document.getElementById('gen-filters');
Object.entries(GEN).forEach(([gen, c]) => {
  const key   = gen === 'null' ? 'null' : gen;
  const label = gen === 'null' ? 'Otros' : c.label.replace(' generación', 'ª');
  const chip  = document.createElement('button');
  chip.className = 'edge-chip active';
  chip.dataset.gen = key;
  chip.innerHTML = `<span class="chip-dot" style="background:${c.border}"></span>${label}`;
  chip.addEventListener('click', function () {
    if (activeGens.has(key)) {
      activeGens.delete(key);
      this.classList.replace('active', 'inactive');
    } else {
      activeGens.add(key);
      this.classList.replace('inactive', 'active');
    }
    applyFilters();
    document.getElementById('btn-all').classList.remove('active');
  });
  genFiltersEl.appendChild(chip);
});

// Chips de tipo de arista
const edgeFiltersEl = document.getElementById('edge-filters');
Object.entries(EDGE_C).forEach(([tipo, color]) => {
  const chip = document.createElement('button');
  chip.className = 'edge-chip active';
  chip.dataset.tipo = tipo;
  chip.innerHTML = `<span class="chip-dot" style="background:${color}"></span>${EDGE_LABELS[tipo] || tipo}`;
  chip.addEventListener('click', function () {
    if (activeEdgeTypes.has(tipo)) {
      activeEdgeTypes.delete(tipo);
      this.classList.replace('active', 'inactive');
    } else {
      activeEdgeTypes.add(tipo);
      this.classList.replace('inactive', 'active');
    }
    applyFilters();
    document.getElementById('btn-all').classList.remove('active');
  });
  edgeFiltersEl.appendChild(chip);
});

document.getElementById('btn-fit').addEventListener('click', () => cy.animate({ fit: { padding: 40 } }, { duration: 450 }));
document.getElementById('btn-all').addEventListener('click', function () {
  Object.keys(EDGE_C).forEach(t => activeEdgeTypes.add(t));
  Object.keys(GEN).forEach(k => activeGens.add(k === 'null' ? 'null' : k));
  document.querySelectorAll('.edge-chip').forEach(c => {
    c.classList.remove('inactive');
    c.classList.add('active');
  });
  cy.elements().show();
  this.classList.add('active');
});

// Leyenda grafo ───────────────────────────────────────────────────────────────

const leyenda   = document.getElementById('leyenda');
const leyEdges  = document.getElementById('ley-edges');

Object.entries(GEN).forEach(([gen, c]) => {
  const r = document.createElement('div');
  r.className = 'ley-row';
  r.innerHTML = `<span class="ley-dot" style="background:${c.border}"></span><span class="ley-label">${c.label}</span>`;
  leyenda.appendChild(r);
});

[['parental','Filiación'],['marital','Matrimonio'],['amorosa','Amor / Deseo'],
 ['conflicto','Conflicto'],['amistad','Amistad'],['mentor_discipulo','Mentor']].forEach(([tipo, label]) => {
  const isDash = ['amorosa','conflicto'].includes(tipo);
  const r = document.createElement('div');
  r.className = 'ley-row';
  r.innerHTML = `<svg width="18" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="18" y2="5" stroke="${EDGE_C[tipo]}" stroke-width="${tipo==='parental'?1:1.5}" stroke-dasharray="${isDash?'4 3':'none'}" opacity="${tipo==='parental'?.5:.85}"/></svg><span class="ley-label">${label}</span>`;
  leyEdges.appendChild(r);
});

// ═══════════════════════════════════════════════════════════════════════════════
// CRONOLOGÍA
// ═══════════════════════════════════════════════════════════════════════════════

// Agrupar por capítulo
const byChapter = {};
EVENTOS.forEach(e => { (byChapter[e.capitulo] || (byChapter[e.capitulo] = [])).push(e); });
const chapters = Object.keys(byChapter).map(Number).sort((a, b) => a - b);

// Tipos presentes
const tipos = [...new Set(EVENTOS.map(e => e.tipo))].sort();

// Filtro activo
let activeFilter = null;

// Filtros ─────────────────────────────────────────────────────────────────────

const filterBar = document.getElementById('filter-bar');

const allBtn = document.createElement('button');
allBtn.className = 'f-btn on';
allBtn.textContent = 'Todos';
allBtn.style.setProperty('--c', 'rgba(255,255,255,.55)');
allBtn.addEventListener('click', () => setFilter(null));
filterBar.appendChild(allBtn);

tipos.forEach(tipo => {
  const c   = TIPO_C[tipo] || '#888';
  const btn = document.createElement('button');
  btn.className = 'f-btn';
  btn.style.setProperty('--c', c);
  btn.dataset.tipo = tipo;
  btn.innerHTML = `<span class="f-dot"></span>${tipoLabel(tipo)}`;
  btn.addEventListener('click', () => setFilter(tipo === activeFilter ? null : tipo));
  filterBar.appendChild(btn);
});

function setFilter(tipo) {
  activeFilter = tipo;
  filterBar.querySelectorAll('.f-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.tipo === tipo || (!tipo && !b.dataset.tipo));
  });
  document.querySelectorAll('.evt-card').forEach(card => {
    card.style.display = (!tipo || card.dataset.tipo === tipo) ? '' : 'none';
  });
  document.querySelectorAll('.cap-section').forEach(sec => {
    const visible = [...sec.querySelectorAll('.evt-card')].some(c => c.style.display !== 'none');
    sec.style.display = visible ? '' : 'none';
  });
}

// Render timeline ─────────────────────────────────────────────────────────────

const timeline = document.getElementById('timeline');

chapters.forEach(cap => {
  const section = document.createElement('div');
  section.className = 'cap-section';
  section.innerHTML = `<div class="cap-heading">Capítulo ${ROMAN[cap - 1] || cap}</div>`;

  byChapter[cap].forEach(evt => {
    const c    = TIPO_C[evt.tipo] || '#888';
    const card = document.createElement('div');
    card.className  = 'evt-card';
    card.dataset.tipo = evt.tipo;
    card.dataset.id   = evt.id;

    const chips = evt.participantes
      .map(pid => {
        const p = pById[pid];
        const name = p ? p.nombre : pid;
        return `<span class="p-chip" data-id="${pid}">${name}</span>`;
      })
      .join('');

    card.innerHTML = `
      <div class="evt-header">
        <span class="evt-badge" style="--c:${c};--bg:${c}28">${tipoLabel(evt.tipo)}</span>
        <span class="evt-title">${evt.titulo}</span>
        <button class="evt-arrow" aria-label="Expandir">&#9658;</button>
      </div>
      <div class="evt-body">
        <div class="evt-body-inner">
          ${chips ? `<div class="evt-chips">${chips}</div>` : ''}
          <p class="evt-desc">${evt.descripcion}</p>
        </div>
      </div>`;

    // Toggle expand
    card.querySelector('.evt-header').addEventListener('click', () => card.classList.toggle('open'));

    // Participant chips → navigate to character in graph
    card.querySelectorAll('.p-chip').forEach(chip => {
      chip.addEventListener('click', e => {
        e.stopPropagation();
        const id = chip.dataset.id;
        const tabBtn = document.querySelector('.tab-btn[data-view="personajes"]');
        if (!tabBtn.classList.contains('active')) tabBtn.click();
        setTimeout(() => {
          const node = cy.getElementById(id);
          if (node.length) {
            cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.4) }, {
              duration: 400,
              complete: () => { openPanel(node); },
            });
          }
        }, 150);
      });
    });

    section.appendChild(card);
  });

  timeline.appendChild(section);
});
</script>
