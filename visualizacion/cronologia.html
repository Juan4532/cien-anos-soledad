as decirle a Aureliano: «Acuérdate siempre de que eran más de tres mil y que los echaron al mar.» En ese mismo instante, Aureliano Segundo muere en la cama de Fernanda, consumido por el tumor de cangrejos de hierro que le carcomía la garganta. Santa Sofía de la Piedad degüella el cadáver de José Arcadio Segundo con un cuchillo de cocina para cumplir su promesa de que no lo enterraran vivo. Petra Cotes llega con los botines de charol que Aureliano Segundo quería llevar en el ataúd; Fernanda no la deja pasar de la puerta. Los borrachitos confunden los ataúdes y los entierran en tumbas equivocadas.", "orden_cronologico": 1712, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_URSULA", "titulo": "Muerte de Úrsula Iguarán", "tipo": "muerte", "capitulo": 17, "participantes": ["URSULA_IGUARAN", "AMARANTA_URSULA", "AURELIANO_BABILONIA", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "Úrsula muere un Jueves Santo entre los 115 y los 122 años de edad. La enterraron en una cajita apenas más grande que la canastilla en que llegó Aureliano Babilonia. Al mediodía del entierro hacía tanto calor que los pájaros desorientados se estrellaban contra las paredes y morían en los dormitorios. Poca gente asistió: casi nadie se acordaba de ella.", "orden_cronologico": 1713, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_PILAR_TERNERA", "titulo": "Muerte de Pilar Ternera", "tipo": "muerte", "capitulo": 20, "participantes": ["PILAR_TERNERA"], "descripcion": "Pilar Ternera muere en su mecedor de bejuco durante una noche de fiesta, vigilando la entrada de su paraíso. Por su última voluntad la entierran sentada en el mecedor, que ocho hombres bajan con cabuyas en un hoyo excavado en el centro de la pista de baile. Las mulatas vestidas de negro arrojan sus aretes, prendedores y sortijas en la fosa. La sellan con una lápida sin nombre ni fechas, cubierta de camelias amazónicas. Después envenenan a los animales, clausuran puertas y ventanas con ladrillos y argamasa, y se dispersan por el mundo.", "orden_cronologico": 2005, "lugar": "BURDEL_PILAR"}, {"id": "EVT_REGRESO_AMARANTA_URSULA", "titulo": "Regreso de Amaranta Úrsula desde Bruselas", "tipo": "llegada", "capitulo": 19, "participantes": ["AMARANTA_URSULA", "GASTON"], "descripcion": "Amaranta Úrsula regresa de Bruselas en diciembre con Gastón.Trae dos roperos verticales, cuatro maletas grandes, ocho cajas de sombreros, el velocípedo del marido y una jaula gigante con medio centenar de canarios. Sin descanso pone al frente una cuadrilla de carpinteros, cerrajeros y albañiles que resanan grietas, enquician puertas, renuevan muebles y blanquean paredes.", "orden_cronologico": 1900, "lugar": "MACONDO"}, {"id": "EVT_AMOR_AURELIANO_AMARANTA_URSULA", "titulo": "La pasión desatada de Aureliano y Amaranta Úrsula", "tipo": "otro", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA", "AMARANTA_URSULA"], "descripcion": "Con Gastón de regreso a Bruselas, sucumben al delirio de los amores atrasados: una pasión insensata que hace temblar los huesos de Fernanda en su tumba. Los chillidos de Amaranta Úrsula estallan lo mismo a las dos de la tarde que a las dos de la madrugada. Destrozan los muebles, desbaratan la hamaca que resistió los amores del coronel Aureliano Buendía y destripen los colchones. Andan en cueros por la casa, se revuelcan en los barrizales del patio y casi se ahogan amándose en la alberca. 'Lo que más me duele —reía ella— es tanto tiempo que perdimos.'", "orden_cronologico": 2003, "lugar": "CASA_BUENDIA"}, {"id": "EVT_NACIMIENTO_AURELIANO_ULTIMO", "titulo": "Nacimiento del hijo con cola de cerdo", "tipo": "nacimiento", "capitulo": 20, "participantes": ["AURELIANO_ULTIMO", "AMARANTA_URSULA", "AURELIANO_BABILONIA"], "descripcion": "Un domingo a las seis de la tarde la comadrona del burdel de las muchachitas sube a Amaranta Úrsula a la mesa del comedor y, acaballada sobre su vientre, la maltrata con galopes cerriles hasta que los gritos son acallados por los berridos de un varón formidable. Amaranta Úrsula lo ve como un Buendía de los grandes —macizo como los José Arcadios, con ojos clarividentes de Aureliano— y dice que se llamará Rodrigo; Aureliano replica que se llamará Aureliano y ganará treinta y dos guerras. Cuando lo voltean boca abajo descubren que tiene una cola de cerdo.", "orden_cronologico": 2006, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_AMARANTA_URSULA", "titulo": "Muerte de Amaranta Úrsula en el parto", "tipo": "muerte", "capitulo": 20, "participantes": ["AMARANTA_URSULA", "AURELIANO_BABILONIA"], "descripcion": "Amaranta Úrsula se desangra en un manantial incontenible que no ceden los apósitos de telaraña ni la ceniza. Ella conserva el buen humor horas y horas, tomándole la mano a Aureliano; luego se va haciendo cada vez menos visible, como si la borraran de la luz. Al amanecer del lunes una mujer reza junto a la cama oraciones de cauterio, pero la sangre apasionada de Amaranta Úrsula es insensible a todo artificio distinto del amor. Al anochecer el caudal se agota, el perfil se le afila y vuelve a sonreír. Aureliano vaga por el pueblo, vuelve al amanecer siguiente, y encuentra al niño devorado por las hormigas en el jardín: un pellejo reseco que todas las hormigas del mundo arrastran hacia sus madrigueras.", "orden_cronologico": 2007, "lugar": "CASA_BUENDIA"}, {"id": "EVT_DESCIFRADO_PERGAMINOS", "titulo": "Aureliano Babilonia descifra los pergaminos de Melquíades", "tipo": "descubrimiento", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA", "MELQUIADES"], "descripcion": "Al ver al niño devorado por las hormigas, a Aureliano se le revelan las claves definitivas: el epígrafe de los pergaminos perfectamente ordenado —'El primero de la estirpe está amarrado en un árbol y al último se lo están comiendo las hormigas.' Los pergaminos están escritos en sánscrito —lengua materna de Melquíades—, con los versos pares cifrados con la clave privada del emperador Augusto y los impares con claves militares lacedemonias. No están ordenados en el tiempo convencional: Melquíades concentró un siglo de episodios cotidianos para que todos coexistieran en un instante. Aureliano descifra en voz alta sin dificultad; lee las predicciones de la ejecución de Arcadio, el nacimiento de Remedios la Bella, el origen de los gemelos póstumos. Descubre que Amaranta Úrsula no era su hermana sino su tía, y que Francis Drake asaltó Riohacha para que ellos se buscaran por los laberintos de la sangre y engendraran el animal mitológico que pondría fin a la estirpe. Se descifra a sí mismo en el acto de descifrar, profetizándose en un espejo hablado.", "orden_cronologico": 2010, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_DESTRUCCION_MACONDO", "titulo": "Destrucción de Macondo por el viento", "tipo": "desastre", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA"], "descripcion": "Mientras Aureliano descifra los pergaminos, el viento empieza —tibio, incipiente, lleno de voces del pasado— y crece hasta un ciclón bíblico que arranca de cuajo puertas, ventanas y el techo de la galería oriental. La ciudad de los espejos (o los espejismos) es arrasada y desterrada de la memoria de los hombres en el instante en que Aureliano Babilonia acaba de leer la última página. Estaba previsto: las estirpes condenadas a cien años de soledad no tendrían una segunda oportunidad sobre la tierra.", "orden_cronologico": 2011, "lugar": "MACONDO"}, {"id": "EVT_LLEGADA_VISITACION_CATAURE", "titulo": "Llegada de Visitación y Cataure a Macondo", "tipo": "llegada", "capitulo": 3, "participantes": ["VISITACION", "CATAURE"], "descripcion": "Los dos indios guajiros llegan a Macondo huyendo de la peste del insomnio que asolaba su tribu. Úrsula los contrata como criados. Visitación cuida a Arcadio y Amaranta; ambos niños aprenden guajiro antes que el castellano.", "orden_cronologico": 305, "lugar": "MACONDO"}, {"id": "EVT_LETREROS_CONTRA_OLVIDO", "titulo": "Aureliano inventa el sistema de letreros para combatir el olvido", "tipo": "invencion", "capitulo": 3, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Aureliano descubre que está olvidando los nombres de las cosas y empieza a etiquetarlas con papeles. José Arcadio Buendía extiende el método a toda la casa y luego al pueblo entero, llegando a poner carteles con instrucciones de uso completas ('Ésta es la vaca, hay que ordeñarla...').", "orden_cronologico": 306, "lugar": "MACONDO"}, {"id": "EVT_DAGUERROTIPIA_MACONDO", "titulo": "Melquíades instala el laboratorio de daguerrotipia", "tipo": "invencion", "capitulo": 3, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "Melquíades trae la daguerrotipia a Macondo y retrata a la familia Buendía. José Arcadio Buendía intenta usar el proceso para fotografiar a Dios. Úrsula se niega a que la retraten. Aureliano aparece en el daguerrotipo junto a Amaranta y Rebeca.", "orden_cronologico": 307, "lugar": "MACONDO"}, {"id": "EVT_REGRESO_FRANCISCO_HOMBRE", "titulo": "Francisco el Hombre regresa a Macondo tras la plaga del insomnio", "tipo": "llegada", "capitulo": 3, "participantes": ["FRANCISCO_EL_HOMBRE"], "descripcion": "Francisco el Hombre, anciano trovador de casi doscientos años que difunde noticias cantando, reaparece en la tienda de Catarino con una matrona y una mulata adolescente. El pueblo acude en masa a escuchar las noticias del mundo exterior. Úrsula se entera así de la muerte de su madre.", "orden_cronologico": 308, "lugar": "TIENDA_CATARINO"}, {"id": "EVT_AURELIANO_TIENDA_CATARINO", "titulo": "Primera experiencia sexual fallida de Aureliano en la tienda de Catarino", "tipo": "otro", "capitulo": 3, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "Aureliano entra al cuarto de la mulata adolescente que acompaña a Francisco el Hombre pero es incapaz de consumar el encuentro. Al amanecer decide casarse con ella para liberarla de su abuela, pero ella ya se ha ido del pueblo.", "orden_cronologico": 309, "lugar": "TIENDA_CATARINO"}, {"id": "EVT_AMPLIACION_CASA_BUENDIA", "titulo": "Úrsula ordena la ampliación de la casa Buendía", "tipo": "otro", "capitulo": 3, "participantes": ["URSULA_IGUARAN"], "descripcion": "Úrsula, al ver que sus hijos están crecidos y la casa se queda pequeña, usa los ahorros de su negocio de animalitos de caramelo para construir la casa más grande y hospitalaria de Macondo: sala formal, nueve dormitorios, comedor para doce, jardín de rosas, baños separados y caballeriza.", "orden_cronologico": 310, "lugar": "MACONDO"}, {"id": "EVT_EXPULSION_MOSCOTE", "titulo": "José Arcadio Buendía expulsa al corregidor Moscote", "tipo": "conflicto", "capitulo": 3, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "APOLINAR_MOSCOTE"], "descripcion": "Al enterarse de que el corregidor ha ordenado pintar las casas de azul, José Arcadio Buendía lo levanta por las solapas y lo lleva físicamente hasta el camino de la ciénaga, rechazando la autoridad del gobierno y declarándolo enemigo.", "orden_cronologico": 311, "lugar": "MACONDO"}, {"id": "EVT_REGRESO_MOSCOTE_CON_FAMILIA", "titulo": "Moscote regresa a Macondo con soldados y su familia", "tipo": "llegada", "capitulo": 3, "participantes": ["APOLINAR_MOSCOTE", "REMEDIOS_MOSCOTE", "AMPARO_MOSCOTE"], "descripcion": "Una semana después de ser expulsado, Moscote regresa con seis soldados armados y una carreta con su mujer y sus siete hijas, instalándose en el Hotel de Jacob y reabriendo el despacho de corregidor.", "orden_cronologico": 312, "lugar": "MACONDO"}, {"id": "EVT_ACUERDO_JAB_MOSCOTE", "titulo": "Acuerdo entre José Arcadio Buendía y el corregidor Moscote", "tipo": "acuerdo", "capitulo": 3, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "AURELIANO_BUENDIA_CORONEL", "APOLINAR_MOSCOTE"], "descripcion": "José Arcadio Buendía y Aureliano visitan a Moscote desarmados. José Arcadio Buendía acepta la presencia del corregidor a cambio de dos condiciones: cada quien pinta su casa del color que quiera y los soldados se van. Macondo garantiza el orden. José Arcadio Buendía declara a Moscote 'palabra de enemigo'.", "orden_cronologico": 313, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_VE_REMEDIOS", "titulo": "Aureliano ve a Remedios Moscote y se enamora", "tipo": "otro", "capitulo": 3, "participantes": ["AURELIANO_BUENDIA_CORONEL", "REMEDIOS_MOSCOTE", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "APOLINAR_MOSCOTE"], "descripcion": "Durante la visita al despacho de Moscote, Aureliano ve a Remedios, de apenas nueve años, y queda herido por una sensación física irresistible. La imagen de la niña le queda 'doliendo en alguna parte del cuerpo, como una piedrecita en el zapato'.", "orden_cronologico": 314, "lugar": "CASA_MOSCOTE"}, {"id": "EVT_INAUGURACION_CASA_NUEVA", "titulo": "Inauguración de la casa nueva con baile", "tipo": "otro", "capitulo": 4, "participantes": ["URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "REBECA", "AMARANTA_BUENDIA", "ARCADIO", "AURELIANO_BUENDIA_CORONEL", "PIETRO_CRESPI"], "descripcion": "La nueva casa Buendía, blanca como una paloma, es estrenada con un gran baile. La pianola toca sola y los descendientes de los fundadores llenan las habitaciones por primera vez. La pianola falla y José Arcadio Buendía la había destripado días antes, pero Prieto la arregla y el baile se prolonga hasta el amanecer.", "orden_cronologico": 404, "lugar": "CASA_BUENDIA"}, {"id": "EVT_AURELIANO_NOCHE_PILAR", "titulo": "Primera noche de Aureliano con Pilar Ternera", "tipo": "otro", "capitulo": 4, "participantes": ["AURELIANO_BUENDIA_CORONEL", "PILAR_TERNERA"], "descripcion": "Ebrio y desesperado por su amor a Remedios, Aureliano acaba en casa de Pilar Ternera. Ella lo recibe con ternura maternal. Aureliano le confiesa que ama a Remedios. Pilar le promete hablar con la niña y conseguirle la boda. De esta noche nace Aureliano José.", "orden_cronologico": 405, "lugar": "CASA_PILAR"}, {"id": "EVT_AURELIANO_PIDE_REMEDIOS", "titulo": "Aureliano declara a sus padres que quiere casarse con Remedios Moscote", "tipo": "otro", "capitulo": 4, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN", "REMEDIOS_MOSCOTE"], "descripcion": "Aureliano convoca a sus padres en la sala de visita. José Arcadio Buendía se indigna ('El amor es una peste') porque Remedios es hija del enemigo. Úrsula apoya la elección. José Arcadio Buendía impone la condición de que Rebeca se case con Pietro Crespi.", "orden_cronologico": 406, "lugar": "MACONDO"}, {"id": "EVT_PEDIDA_MANO_REMEDIOS_MOSCOTE", "titulo": "José Arcadio Buendía pide formalmente la mano de Remedios Moscote", "tipo": "otro", "capitulo": 4, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "APOLINAR_MOSCOTE", "REMEDIOS_MOSCOTE", "URSULA_IGUARAN", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "José Arcadio Buendía acude de etiqueta al despacho de Moscote. Los Moscote creen al principio que hay una confusión de nombres; Remedios, sacada de la cama, llora porque quiere seguir durmiendo. Al final aceptan. Sin embargo, la señora de Moscote revela a Úrsula en privado que Remedios todavía no ha tenido la primera menstruación. Aureliano acepta esperar el tiempo necesario.", "orden_cronologico": 407, "lugar": "CASA_MOSCOTE"}, {"id": "EVT_AMARANTA_CONFIESA_PIETRO", "titulo": "Amaranta le confiesa su amor a Pietro Crespi en el velorio de Melquíades", "tipo": "otro", "capitulo": 4, "participantes": ["AMARANTA_BUENDIA", "PIETRO_CRESPI", "REBECA"], "descripcion": "Durante el velorio de Melquíades, aprovechando el tumulto, Amaranta le declara su amor a Pietro Crespi, que ya tiene formalizando su compromiso con Rebeca. Pietro la trata como una chiquilla y le dice que tiene un hermano menor que vendrá a la tienda. Amaranta le responde con rencor virulento.", "orden_cronologico": 408, "lugar": "CEMENTERIO_MACONDO"}, {"id": "EVT_COMPROMISO_REBECA_PIETRO", "titulo": "Pietro Crespi y Rebeca formalizan su compromiso", "tipo": "otro", "capitulo": 4, "participantes": ["PIETRO_CRESPI", "REBECA", "AMARANTA_BUENDIA"], "descripcion": "Pietro Crespi formaliza el compromiso con Rebeca e instala una tienda de instrumentos musicales y juguetes de cuerda en la calle de los Turcos. Amaranta amenaza a Rebeca con impedir la boda aunque tenga que matarla.", "orden_cronologico": 409, "lugar": "MACONDO"}, {"id": "EVT_VIAJE_URSULA_AMARANTA", "titulo": "Úrsula y Amaranta viajan fuera de Macondo", "tipo": "partida", "capitulo": 4, "participantes": ["URSULA_IGUARAN", "AMARANTA_BUENDIA"], "descripcion": "Para alejar a Amaranta de Pietro Crespi y calmar su rencor, Úrsula organiza un viaje a la capital de la provincia. Antes de salir, Amaranta le susurra a Rebeca: 'Aunque me lleven al fin del mundo, encontraré la manera de impedir que te cases, así tenga que matarte.'", "orden_cronologico": 410, "lugar": "MACONDO"}, {"id": "EVT_ENTIERRO_PADRES_REBECA", "titulo": "Se entierran los huesos de los padres de Rebeca", "tipo": "otro", "capitulo": 4, "participantes": ["REBECA", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "PILAR_TERNERA"], "descripcion": "Pilar Ternera vaticina que Rebeca no será feliz mientras sus padres estén insepultos. Los obreros recuerdan haber emparedado el talego durante la construcción. Lo encuentran auscultando las paredes y lo entierran junto a la tumba de Melquíades. José Arcadio Buendía le da un beso a Rebeca: 'Serás feliz.'", "orden_cronologico": 411, "lugar": "CEMENTERIO_MACONDO"}, {"id": "EVT_VERSOS_AURELIANO", "titulo": "Aureliano comienza a escribir versos", "tipo": "otro", "capitulo": 4, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "Aureliano Buendía comienza a escribir versos. Dedicados a Remedios Moscote, son el primer indicio de su vida contemplativa antes de la guerra.", "orden_cronologico": 412, "lugar": "CASA_BUENDIA"}, {"id": "EVT_RELACION_ARCADIO_SANTA_SOFIA", "titulo": "Pilar Ternera envía a Santa Sofía de la Piedad a Arcadio", "tipo": "otro", "capitulo": 6, "participantes": ["ARCADIO", "SANTA_SOFIA_DE_LA_PIEDAD", "PILAR_TERNERA"], "descripcion": "Arcadio espera a Pilar Ternera en la oscuridad de su cuarto. Pilar paga cincuenta pesos a Santa Sofía de la Piedad, virgen hija de tenderos, para que ocupe su lugar. Arcadio la confunde con Pilar y se enamora de ella. Se convierte en su compañera y madre de sus tres hijos.", "orden_cronologico": 604, "lugar": "CASA_PILAR"}, {"id": "EVT_USURPACION_TIERRAS_JOSE_ARCADIO", "titulo": "Usurpación de tierras por José Arcadio (hijo)", "tipo": "conflicto", "capitulo": 6, "participantes": ["JOSE_ARCADIO_HIJO", "ARCADIO"], "descripcion": "José Arcadio Hijo araña su patio y sigue derecho con bueyes derribando cercas hasta apropiarse de los mejores predios del contorno. Arcadio legaliza los títulos a su nombre a cambio de cobrar él mismo las contribuciones, acumulando dinero público y tierras hasta el horizonte, incluido el cementerio.", "orden_cronologico": 605, "lugar": "MACONDO"}, {"id": "EVT_LLEGADA_STEVENSON", "titulo": "El coronel Stevenson llega disfrazado de anciana", "tipo": "llegada", "capitulo": 6, "participantes": ["GREGORIO_STEVENSON", "ARCADIO"], "descripcion": "Un supuesto mensajero del coronel Aureliano Buendía Aureliano llega disfrazado de anciana con un burro cargado de escobas. Porta un pescadito de oro como salvoconducto. Trae la orden de entregar la plaza sin resistencia. Arcadio lo encarcela por no llevar carta escrita y decide defender Macondo hasta la muerte.", "orden_cronologico": 606, "lugar": "MACONDO"}, {"id": "EVT_RECONQUISTA_MACONDO", "titulo": "El ejército conservador reconquista Macondo", "tipo": "guerra", "capitulo": 6, "participantes": ["ARCADIO", "GREGORIO_STEVENSON", "URSULA_IGUARAN", "AMARANTA_BUENDIA"], "descripcion": "El ejército conservador aplasta la resistencia liberal en menos de media hora. Arcadio sale a combatir, rescata a Amaranta y la entrega a Úrsula antes de entregarse para protegerlas. Gregorio Stevenson defiende el cuartel solo con veinte cartuchos y muere. Ninguno de los hombres de Arcadio sobrevive.", "orden_cronologico": 607, "lugar": "MACONDO"}, {"id": "EVT_FUSILAMIENTO_ARCADIO", "titulo": "Fusilamiento de Arcadio", "tipo": "muerte", "capitulo": 6, "participantes": ["ARCADIO", "ROQUE_CARNICERO", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "Tras un consejo de guerra sumario, Arcadio es fusilado al amanecer contra el muro del cementerio por el capitán Roque Carnicero. Sus últimas palabras piden que la hija se llame Úrsula y el que va a nacer José Arcadio.Rebeca lo ve desde la puerta de su casa y le hace señas de adiós. Finalmente piensan que si nacía mujer la pusieran Remedios", "orden_cronologico": 608, "lugar": "CEMENTERIO_MACONDO"}, {"id": "EVT_PRIMERA_MENCION_GEMELOS", "titulo": "Nacimiento de los gemelos José Arcadio Segundo y Aureliano Segundo", "tipo": "nacimiento", "capitulo": 7, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_SEGUNDO", "REMEDIOS_LA_BELLA", "SANTA_SOFIA_DE_LA_PIEDAD", "URSULA_IGUARAN"], "descripcion": "Santa Sofía de la Piedad da a luz tres hijos de Arcadio: los gemelos José Arcadio Segundo y Aureliano Segundo, y una niña que recibirá el nombre de Remedios la Bella. Úrsula recoge a los cuatro hijos de Arcadio en la casa de los Buendía y los cría como suyos.", "orden_cronologico": 703, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CAPTURA_CORONEL", "titulo": "Captura del coronel Aureliano Buendía Aureliano Buendía", "tipo": "guerra", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "En mayo, el coronel Aureliano Buendía Aureliano Buendía es capturado disfrazado de hechicero indígena. De los 21 hombres que lo acompañaban, 14 murieron en combate y 6 resultaron heridos. Solo Gerineldo Márquez logra escapar.", "orden_cronologico": 704, "lugar": "LA_SIERRA"}, {"id": "EVT_VISITA_URSULA_CARCEL", "titulo": "Úrsula visita al Coronel en la cárcel", "tipo": "otro", "capitulo": 7, "participantes": ["URSULA_IGUARAN", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Úrsula obtiene quince minutos de visita para su hijo preso. Le lleva ropa limpia y dulce de leche, y esconde un revólver en la cesta. El coronel Aureliano Buendía lo rechaza: está resignado a morir.", "orden_cronologico": 705, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_MUERTE_MAGNIFICO_VISBAL", "titulo": "Asesinato de Magnífico Visbal", "tipo": "muerte", "capitulo": 7, "participantes": ["MAGNIFICO_VISBAL"], "descripcion": "Magnífico Visbal, que ocupaba el catre que el coronel Aureliano Buendía le había cedido la noche de su captura, es asesinado a puñaladas en Manaure. El coronel Aureliano Buendía, al enterarse, interpreta el suceso como una señal de su propio destino.", "orden_cronologico": 706, "lugar": "MANAURE"}, {"id": "EVT_PILAR_PREDICE_CORONEL", "titulo": "Pilar Ternera lee las barajas al Coronel", "tipo": "vision", "capitulo": 7, "participantes": ["PILAR_TERNERA", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Pilar Ternera lee las cartas al Coronel preso y le advierte: \"Cuídate la boca.\" La profecía se cumple días después cuando intentan envenenarlo con el café.", "orden_cronologico": 707, "lugar": "CASA_PILAR"}, {"id": "EVT_INTENTO_ENVENENAMIENTO_CORONEL", "titulo": "Intento de envenenamiento del coronel Aureliano Buendía con café", "tipo": "conflicto", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "Le sirven al Coronel un café con nuez vómica suficiente para matar a un buey. Úrsula lo salva administrándole vomitivos y claras de huevo. El episodio cumple la profecía de Pilar Ternera.", "orden_cronologico": 708, "lugar": "MACONDO"}, {"id": "EVT_REGRESO_CORONEL_MACONDO", "titulo": "Regreso victorioso del coronel Aureliano Buendía a Macondo", "tipo": "llegada", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ", "URSULA_IGUARAN"], "descripcion": "El coronel Aureliano Buendía regresa a Macondo al mando de las fuerzas liberales. Gerineldo Márquez, que escapó de la captura, lo recibe con un abrazo; es la primera efusión de afecto entre ellos. Úrsula apenas reconoce al hijo que partió.", "orden_cronologico": 709, "lugar": "MACONDO"}, {"id": "EVT_GERINELDO_JEFE_MACONDO", "titulo": "Gerineldo Márquez nombrado jefe civil y militar de Macondo", "tipo": "acuerdo", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "Antes de partir al interior del país a continuar la guerra, el coronel Aureliano Buendía nombra a Gerineldo Márquez jefe civil y militar de Macondo, dejándolo a cargo del orden y de Amaranta.", "orden_cronologico": 710, "lugar": "MACONDO"}, {"id": "EVT_RECHAZO_AMARANTA_GERINELDO", "titulo": "Amaranta rechaza la propuesta de matrimonio de Gerineldo", "tipo": "otro", "capitulo": 7, "participantes": ["AMARANTA_BUENDIA", "GERINELDO_MARQUEZ"], "descripcion": "Gerineldo Márquez corteja a Amaranta durante meses. Ella lo rechaza con crueldad calculada: \"No me casaré con nadie, pero menos contigo. Quieres tanto a Aureliano que te casarías conmigo porque no puedes casarte con él.\"", "orden_cronologico": 711, "lugar": "MACONDO"}, {"id": "EVT_VERSOS_CORONEL_GUERRA", "titulo": "Los versos del coronel Aureliano Buendía: escribe durante la guerra, pide quemarlos y continúa", "tipo": "otro", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "El coronel Aureliano Buendía Aureliano Buendía ha seguido escribiendo versos durante toda la guerra. Antes del fusilamiento le pide a Úrsula que queme sus poemas. Tras sobrevivir al intento de envenenamiento retoma la escritura, reflexinando sobre la muerte.", "orden_cronologico": 712, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_REFLEXION_ORGULLO_CORONEL", "titulo": "El coronel Aureliano Buendía concluye que pelea por puro orgullo", "tipo": "otro", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "En una conversación con el coronel Gerineldo Márquez, el coronel Aureliano Buendía Aureliano Buendía reflexiona sobre sus motivaciones y llega a una conclusión desoladora: no pelea por ideales liberales ni por justicia, sino únicamente por orgullo.", "orden_cronologico": 713, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_RETIRO_REBECA", "titulo": "Rebeca se encierra en su casa tras el asesinato de José Arcadio", "tipo": "otro", "capitulo": 7, "participantes": ["REBECA"], "descripcion": "Tras el asesinato de José Arcadio, Rebeca cierra las puertas y ventanas de su casa con clavos y se entierra en vida. Solo se la ve años después, muy anciana, asomada a la ventana.", "orden_cronologico": 714, "lugar": "CASA_REBECA"}, {"id": "EVT_RETRATO_PETRA_REINA_MADAGASCAR", "titulo": "Aureliano Segundo corona a Petra Cotes reina de Madagascar", "tipo": "conflicto", "capitulo": 11, "participantes": ["AURELIANO_SEGUNDO", "PETRA_COTES", "FERNANDA_DEL_CARPIO"], "descripcion": "A dos meses de la boda, Aureliano Segundo hace retratar a Petra vestida de reina de Madagascar. Fernanda lo descubre, hace sus baúles y abandona Macondo. Aureliano la alcanza y la convence de volver prometiendo abandonar a la concubina. Poco después organiza una parranda y corona de nuevo a Petra soberana absoluta y vitalicia de Madagascar, repartiendo copias del retrato entre sus amigos.", "orden_cronologico": 1101, "lugar": "MACONDO"}, {"id": "EVT_PACTO_TRIPLE_CONVIVENCIA", "titulo": "Pacto de convivencia a tres: Aureliano Segundo, Fernanda y Petra Cotes", "tipo": "acuerdo", "capitulo": 11, "participantes": ["AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "PETRA_COTES"], "descripcion": "Aureliano Segundo convence a Fernanda de que debe visitar a Petra para que sigan pariendo los animales. Fernanda acepta con la única condición de que no le pillen muerto en la cama de la concubina. Los tres viven sin estorbarse. Petra guarda los botines de charol de Aureliano en el fondo de un baúl: 'tarde o temprano tiene que venir, aunque solo sea a ponerse estos botines'.", "orden_cronologico": 1102, "lugar": "CASA_PETRA_COTES"}, {"id": "EVT_CONFLICTO_FERNANDA_AMARANTA", "titulo": "Ruptura entre Fernanda y Amaranta", "tipo": "conflicto", "capitulo": 11, "participantes": ["AMARANTA_BUENDIA", "FERNANDA_DEL_CARPIO"], "descripcion": "Amaranta habla en jerigonza delante de Fernanda para burlarse de ella. Cuando Fernanda pregunta qué dice, Amaranta le contesta sin eufemismos: 'tú eres de las que confunden el culo con las témporas'. Desde ese día no vuelven a dirigirse la palabra.", "orden_cronologico": 1103, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FERNANDA_REFORMA_CASA_BUENDIA", "titulo": "Fernanda impone sus costumbres en la casa Buendía", "tipo": "otro", "capitulo": 11, "participantes": ["FERNANDA_DEL_CARPIO", "URSULA_IGUARAN", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "Fernanda impone el comedor formal con manteles de lino y servicio de plata, el rosario antes de cenar y el horario estricto de comidas. Cierra las puertas, sustituye el ramo de sábila y el pan del dintel por un nicho del Corazón de Jesús, y liquida el negocio de repostería de Santa Sofía de la Piedad. Cuando Úrsula pierde la vista, el círculo de rigidez de Fernanda se cierra del todo.", "orden_cronologico": 1104, "lugar": "CASA_BUENDIA"}, {"id": "EVT_NACIMIENTO_MEME", "titulo": "Nacimiento de Meme (Renata Remedios)", "tipo": "nacimiento", "capitulo": 11, "participantes": ["MEME", "AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "URSULA_IGUARAN"], "descripcion": "Nace la primera hija de Aureliano Segundo y Fernanda. Fernanda insiste en llamarla Renata como su madre; Úrsula quiere Remedios. La bautizan Renata Remedios, pero toda la familia y el pueblo la llaman Meme, diminutivo de Remedios.", "orden_cronologico": 1105, "lugar": "MACONDO"}, {"id": "EVT_ATAUD_DON_FERNANDO", "titulo": "Llegada del ataúd de Don Fernando en la caja de Navidad", "tipo": "muerte", "capitulo": 11, "participantes": ["DON_FERNANDO", "AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "JOSE_ARCADIO_QUINTO"], "descripcion": "En la décima Navidad, cuando José Arcadio el pequeño se prepara para partir al seminario, la familia abre el cajón anual del abuelo y encuentra un ataúd de plomo cerrado con pernos de cobre. Al levantar la tapa, Aureliano Segundo lanza un grito: dentro está Don Fernando vestido de negro con crucifijo, cocinándose en un borboritante caldo de perlas vivas.", "orden_cronologico": 1106, "lugar": "MACONDO"}, {"id": "EVT_JUBILEO_CORONEL", "titulo": "El coronel Aureliano Buendía rechaza el jubileo del gobierno", "tipo": "conflicto", "capitulo": 11, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ", "URSULA_IGUARAN"], "descripcion": "El gobierno organiza un jubileo por el aniversario del tratado de Neerlandia. El coronel Aureliano Buendía lo rechaza como una burla y manda al presidente la amenaza de dispararle si se presenta. El presidente cancela el viaje. Gerineldo Márquez, paralítico, abandona su lecho para persuadirle, pero el coronel Aureliano Buendía lo expulsa del taller: 'demasiado tarde me convenzo de que te habría hecho un gran favor si te hubiera dejado fusilar'.", "orden_cronologico": 1107, "lugar": "MACONDO"}, {"id": "EVT_VISITA_17_AURELIANOS_JUBILEO", "titulo": "Los 17 hijos del coronel Aureliano Buendía llegan para el jubileo", "tipo": "otro", "capitulo": 11, "participantes": ["AURELIANO_BUENDIA_CORONEL", "AURELIANO_TRISTE", "AURELIANO_CENTENO", "REMEDIOS_LA_BELLA", "AMARANTA_BUENDIA", "URSULA_IGUARAN", "AURELIANO_SEGUNDO"], "descripcion": "Los 17 hijos del coronel Aureliano Buendía llegan simultáneamente, sin ponerse de acuerdo, atraídos por el jubileo. Tres días de parranda: consiguen que Remedios la Bella se ponga pantalones de hombre para subirse a la cucaña y sueltan un cerdo embadurnado de sebo en el comedor. El coronel Aureliano Buendía les regala a cada uno un pescadito de oro. Amaranta registra nombres y domicilios en la libreta de Úrsula.", "orden_cronologico": 1108, "lugar": "MACONDO"}, {"id": "EVT_CRUZ_CENIZA_IMBORRABLE", "titulo": "La cruz de ceniza imborrable en los hijos del coronel Aureliano Buendía", "tipo": "milagro", "capitulo": 11, "participantes": ["PADRE_ANTONIO_ISABEL", "AURELIANO_TRISTE", "AURELIANO_CENTENO", "AMARANTA_BUENDIA"], "descripcion": "El miércoles de ceniza, Amaranta lleva a los hijos del coronel Aureliano Buendía a misa. El padre Antonio Isabel les pone la cruz de ceniza, pero al intentar borrársela descubren que la mancha es indeleble; los demás feligreses se la quitan sin dificultad. Úrsula los despide: 'de ahora en adelante nadie podrá confundirlos'.", "orden_cronologico": 1109, "lugar": "IGLESIA_MACONDO"}, {"id": "EVT_AURELIANO_TRISTE_FABRICA_HIELO", "titulo": "Aureliano Triste funda la fábrica de hielo", "tipo": "invencion", "capitulo": 11, "participantes": ["AURELIANO_TRISTE"], "descripcion": "Aureliano Triste se queda en Macondo e instala en las afueras del pueblo la fábrica de hielo que José Arcadio Buendía había soñado en sus delirios de inventor. La producción crece hasta desbordar el mercado local.", "orden_cronologico": 1110, "lugar": "FABRICA_HIELO"}, {"id": "EVT_DESCUBRIMIENTO_REBECA_VIVA", "titulo": "Aureliano Triste descubre que Rebeca sigue viva", "tipo": "otro", "capitulo": 11, "participantes": ["AURELIANO_TRISTE", "REBECA", "URSULA_IGUARAN"], "descripcion": "Aureliano Triste empuja la puerta de la casa decrépita de Rebeca, que le apunta con una pistola militar. Esa noche lo cuenta en la cena y Úrsula llora de consternación: 'Dios santo, ¡todavía está viva!'. Se decide rescatarla, pero Rebeca rechaza toda misericordia y protege su derecho a la soledad.", "orden_cronologico": 1111, "lugar": "CASA_REBECA"}, {"id": "EVT_RESTAURACION_CASA_REBECA", "titulo": "Restauración de la fachada de la casa de Rebeca", "tipo": "otro", "capitulo": 11, "participantes": ["REBECA", "AURELIANO_TRISTE", "AURELIANO_CENTENO", "ARGENIDA"], "descripcion": "En febrero, los 16 hijos del coronel Aureliano Buendía restauran en medio día la fachada de la casa de Rebeca: cambian puertas y ventanas, pintan y vacían cemento nuevo. Rebeca ni se asoma; les manda el pago con Argénida en monedas retiradas de circulación. No consiguen permiso para el interior ni logran rescatarla.", "orden_cronologico": 1112, "lugar": "CASA_REBECA"}, {"id": "EVT_AURELIANO_CENTENO_HELADOS", "titulo": "Aureliano Centeno inventa los helados de frutas", "tipo": "invencion", "capitulo": 11, "participantes": ["AURELIANO_CENTENO"], "descripcion": "Aureliano Centeno, desbordado por la producción de la fábrica de hielo, experimenta con jugos de frutas en lugar de agua como base, concibiendo sin saberlo ni proponérselo los fundamentos esenciales de la invención de los helados.", "orden_cronologico": 1113, "lugar": "FABRICA_HIELO"}, {"id": "EVT_LLEGADA_TECNOLOGIA_MODERNA", "titulo": "La electricidad, el cine, el gramófono y el teléfono llegan a Macondo", "tipo": "llegada", "capitulo": 12, "participantes": ["AURELIANO_TRISTE", "BRUNO_CRESPI", "URSULA_IGUARAN"], "descripcion": "En el segundo viaje del tren, Aureliano Triste trae la planta eléctrica. Don Bruno Crespi proyecta cine en el teatro, ante la indignación del público que no comprende que los personajes mueran y resuciten. El gramófono y el teléfono se instalan. El fantasma de José Arcadio Buendía camina por la casa, convulsionado por tanto espejismo de la realidad.", "orden_cronologico": 1203, "lugar": "MACONDO"}, {"id": "EVT_VISITA_MISTER_HERBERT", "titulo": "Visita de míster Herbert: el análisis del banano", "tipo": "otro", "capitulo": 12, "participantes": ["MISTER_HERBERT", "AURELIANO_SEGUNDO"], "descripcion": "Aureliano Segundo lleva a almorzar a míster Herbert, empresario de globos cautivos que no ha podido elevar a nadie en Macondo. Ante el racimo de bananos del comedor, Herbert los examina minuciosamente con estilete, granatorio, calibrador, termómetro e higrómetro. Días después regresa a cazar mariposas. A la semana siguiente llegan ingenieros, agrónomos, hidrólogos, topógrafos y agrimensores.", "orden_cronologico": 1204, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_FORASTERO_BANO_REMEDIOS", "titulo": "Forastero muere espiando el baño de Remedios la Bella", "tipo": "muerte", "capitulo": 12, "participantes": ["REMEDIOS_LA_BELLA"], "descripcion": "Un forastero levanta tejas del techo del baño para ver a Remedios la Bella desnuda. Ella lo advierte con calma del peligro. Al intentar descolgarse al interior, las tejas podridas ceden y cae al suelo de cemento con el cráneo partido. Los que recogen el cadáver perciben en su piel el sofocante olor de Remedios, impregnado como un aceite ambarino en las grietas del cráneo.", "orden_cronologico": 1205, "lugar": "CASA_BUENDIA"}, {"id": "EVT_REMEDIOS_EN_PLANTACIONES", "titulo": "Remedios la Bella causa estragos en las plantaciones bananeras", "tipo": "conflicto", "capitulo": 12, "participantes": ["REMEDIOS_LA_BELLA", "AURELIANO_TRISTE", "AURELIANO_CENTENO", "AURELIANO_SERRADOR", "AURELIANO_ARCAYA"], "descripcion": "Remedios la Bella va con amigas a las plantaciones de banano; su hálito desencadena fascinación y deseos irresistibles en los trabajadores. Los cuatro Aurelianos con cruces de ceniza las rescatan del asalto. Un hombre que le agredió el vientre se jacta esa noche en la Calle de los Turcos, y minutos después la patada de un caballo le destroza el pecho.", "orden_cronologico": 1206, "lugar": "MACONDO"}, {"id": "EVT_CRIMEN_NIETO_VISBAL", "titulo": "Cabo de la policía mata al nieto y al abuelo Visbal", "tipo": "muerte", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "Un sobrino del coronel Magnífico Visbal lleva a su nieto de siete años a tomar un refresco. El niño tropieza con un cabo de la policía y le derrama el refresco en el uniforme; el cabo lo hace picadillo a machetazos y decapita al abuelo que trata de impedirlo. El pueblo ve pasar al decapitado y a la cabeza siendo llevada por el pelo. Para el coronel Aureliano Buendía es el límite de la expiación.", "orden_cronologico": 1207, "lugar": "MACONDO"}, {"id": "EVT_CORONEL_JURA_GUERRA_GRINGOS", "titulo": "El coronel Aureliano Buendía jura armar a sus hijos contra los gringos", "tipo": "conflicto", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "Tras el crimen del nieto Visbal, el coronel Aureliano Buendía sale del taller y grita a los vecinos: '¡Un día de estos voy a armar a mis muchachos para que acaben con estos gringos de mierda!' La amenaza llega a oídos de sus enemigos y desencadena el exterminio de los 17 Aurelianos esa misma semana.", "orden_cronologico": 1208, "lugar": "MACONDO"}, {"id": "EVT_CORONEL_DENUNCIA_PADRE_ANTONIO", "titulo": "El coronel Aureliano Buendía denuncia al padre Antonio Isabel", "tipo": "conflicto", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL", "PADRE_ANTONIO_ISABEL"], "descripcion": "El coronel Aureliano Buendía denuncia la complicidad del padre Antonio Isabel por haber marcado a sus hijos con ceniza indeleble, facilitando su identificación por los asesinos. El decrépito sacerdote acude a la casa con el tazón de cenizas para demostrar que se quitan con agua, pero nadie se presta al experimento. Los Buendía no vuelven a arrodillarse en el comulgatorio el miércoles de ceniza.", "orden_cronologico": 1209, "lugar": "MACONDO"}, {"id": "EVT_CORONEL_BUSCA_DINERO_GUERRA", "titulo": "El coronel Aureliano Buendía reúne dinero para financiar una nueva guerra", "tipo": "conflicto", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "El coronel Aureliano Buendía abandona los pescaditos de oro y, quebrando todos sus principios de dignidad, busca dinero entre viejos copartidarios que se esconden para no recibirlo. En ocho meses reúne más de lo que Úrsula tiene enterrado. Le pide a Úrsula que le revele dónde están las monedas de oro del San José de yeso, pero ella se niega.", "orden_cronologico": 1210, "lugar": "MACONDO"}, {"id": "EVT_CORONEL_PROPONE_GUERRA_GERINELDO", "titulo": "El coronel Aureliano Buendía propone la guerra total a Gerineldo Márquez", "tipo": "conflicto", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "El coronel Aureliano Buendía visita al paralítico Gerineldo Márquez para invitarle a promover una conflagración total contra el régimen de corrupción sostenido por el invasor extranjero. Gerineldo, que ha pasado años luchando la guerra miserable del aplazamiento burocrático, le responde con compasión: 'ya sabía que estabas viejo, pero ahora me doy cuenta que estás mucho más viejo de lo que pareces'.", "orden_cronologico": 1211, "lugar": "MACONDO"}, {"id": "EVT_JOSE_ARCADIO_VA_SEMINARIO", "titulo": "José Arcadio el pequeño parte al seminario", "tipo": "partida", "capitulo": 13, "participantes": ["JOSE_ARCADIO_QUINTO", "URSULA_IGUARAN", "PADRE_ANTONIO_ISABEL"], "descripcion": "Un jueves a las dos de la tarde, José Arcadio parte al seminario con vestido de pana verde y botones de cobre. El almuerzo de despedida transcurre con fingida alegría; el coronel Aureliano Buendía se niega a participar: '¡Un Papa! ¡Era la última vaina que nos faltaba!'", "orden_cronologico": 1301, "lugar": "MACONDO"}, {"id": "EVT_MEME_VA_COLEGIO_MONJAS", "titulo": "Meme va al colegio de las monjas", "tipo": "partida", "capitulo": 13, "participantes": ["MEME", "AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO"], "descripcion": "Tres meses después de que José Arcadio parte al seminario, Aureliano Segundo y Fernanda llevan a Meme al colegio de las monjas donde le enseñarán a tocar el clavicordio. A su regreso traen un clavicordio que ocupa el lugar de la pianola.", "orden_cronologico": 1302, "lugar": "MACONDO"}, {"id": "EVT_AMARANTA_TEJE_MORTAJA", "titulo": "Amaranta empieza a tejer su propia mortaja", "tipo": "otro", "capitulo": 13, "participantes": ["AMARANTA_BUENDIA"], "descripcion": "Amaranta comienza a tejer su propia mortaja. Borda durante el día y deshace por las noches, no para vencer la soledad sino para sostenerla. La labor la ocupará hasta su muerte.", "orden_cronologico": 1303, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CEGUERA_URSULA", "titulo": "Úrsula oculta su ceguera y aprende a ver con la memoria", "tipo": "otro", "capitulo": 13, "participantes": ["URSULA_IGUARAN"], "descripcion": "Úrsula ha perdido la vista progresivamente desde antes del nacimiento de José Arcadio, pero lo oculta a todos. Aprende a orientarse por la memoria de los espacios, los olores y las voces. Descubre que cada habitante de la casa repite sus recorridos y actos cotidianos con exactitud, lo que le permite saber dónde está cada cosa y cada persona.", "orden_cronologico": 1304, "lugar": "CASA_BUENDIA"}, {"id": "EVT_LUCIDEZ_URSULA", "titulo": "La clarividencia de Úrsula en la vejez", "tipo": "vision", "capitulo": 13, "participantes": ["URSULA_IGUARAN"], "descripcion": "En su decrepitud ciega, Úrsula examina con insólita claridad a su familia. Comprende que el coronel Aureliano Buendía nunca quiso a nadie y que hizo sus guerras por soberbia, no por idealismo. Ve que Amaranta fue la más tierna, consumida por un amor sin medidas y una cobardía invencible. Reconoce que Rebeca, la que comió tierra, fue la única con valentía sin frenos, y empieza a invocarla con arrepentimiento.", "orden_cronologico": 1305, "lugar": "CASA_BUENDIA"}, {"id": "EVT_JOSE_ARCADIO_SEGUNDO_CAPATAZ", "titulo": "José Arcadio Segundo se hace capataz de la compañía bananera", "tipo": "otro", "capitulo": 13, "participantes": ["JOSE_ARCADIO_SEGUNDO", "FERNANDA_DEL_CARPIO"], "descripcion": "José Arcadio Segundo vende sus gallos de pelea y se emplea de capataz en la compañía bananera. Fernanda, que considera a la compañía la encarnación de la vulgaridad forastera, le prohíbe la entrada a la casa mientras tenga 'la sarna de los forasteros'.", "orden_cronologico": 1306, "lugar": "MACONDO"}, {"id": "EVT_SEPARACION_DEFINITIVA_AURELIANO", "titulo": "Separación definitiva de Aureliano Segundo y Fernanda", "tipo": "separacion", "capitulo": 13, "participantes": ["AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "PETRA_COTES"], "descripcion": "Aureliano Segundo traslada sus parrandas, luego sus establos, luego su oficina a casa de Petra Cotes. Una noche la mañana lo sorprende en la cama de la concubina. Fernanda le manda los baúles a pleno sol por la mitad de la calle para que lo vea todo el mundo, pero él celebra la libertad con tres días de parranda. Se instala definitivamente en casa de Petra, aunque sigue visitando a Fernanda.", "orden_cronologico": 1307, "lugar": "MACONDO"}, {"id": "EVT_CORONEL_QUEMA_MUNECAS_REMEDIOS", "titulo": "El coronel Aureliano Buendía quema las muñecas de Remedios y se instala en el taller", "tipo": "otro", "capitulo": 13, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "El coronel Aureliano Buendía hace una hoguera en el patio con las muñecas de Remedios Moscote que decoraban su dormitorio desde su boda. Úrsula le reprocha: 'tienes un corazón de piedra'. Él responde: 'el cuarto se está llenando de polillas'. Cuelga una hamaca en el taller y ya solo lo abandona para ir al patio a hacer sus necesidades.", "orden_cronologico": 1308, "lugar": "CASA_BUENDIA"}, {"id": "EVT_DUELO_ELEFANTA", "titulo": "Duelo gastronómico entre Aureliano Segundo y La Elefanta", "tipo": "otro", "capitulo": 13, "participantes": ["AURELIANO_SEGUNDO", "CAMILA_SAGASTUME", "PETRA_COTES", "FERNANDA_DEL_CARPIO"], "descripcion": "Aureliano Segundo se enfrenta a Camila Sagastume, 'La Elefanta', en un duelo que dura hasta el martes. Ella come con técnica y tranquilidad moral; él con voracidad desbocada. Al segundo amanecer, Aureliano Segundo cae inconsciente con espumarajos sobre el plato. Alcanza a pedir 'llévenme con Fernanda'. Petra Cotes embetuna los botines de charol que él quería en su ataúd. Se recupera en menos de una semana.", "orden_cronologico": 1309, "lugar": "MACONDO"}, {"id": "EVT_MEME_INVITA_COMPANERAS", "titulo": "Meme invita a 68 compañeras de colegio a la casa", "tipo": "otro", "capitulo": 13, "participantes": ["MEME", "FERNANDA_DEL_CARPIO", "URSULA_IGUARAN", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "En sus terceras vacaciones, Meme invita sin avisar a 68 compañeras y 4 monjas a pasar una semana. La casa se convierte en un caos de turnos para comer, bañarse y dormir. El coronel Aureliano Buendía escandaliza a las monjas orinando bajo el castaño. Amaranta asusta a una novicia diciéndole que el polvo blanco de la sopa es arsénico. Fernanda compra 72 bacinillas, que al final van a parar al cuarto de Melquíades.", "orden_cronologico": 1310, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CUARTO_BACINILLAS", "titulo": "El cuarto de Melquíades pasa a ser el cuarto de las bacinillas", "tipo": "otro", "capitulo": 13, "participantes": ["FERNANDA_DEL_CARPIO", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Fernanda guarda las 72 bacinillas compradas para las colegialas de Meme en el cuarto de Melquíades. La habitación que fue el centro espiritual de la casa pasa a llamarse 'el cuarto de las bacinillas'. Para el coronel Aureliano Buendía, es el nombre más apropiado: donde otros ven inmunidad al polvo, él ve un muladar.", "orden_cronologico": 1311, "lugar": "CASA_BUENDIA"}, {"id": "EVT_JOSE_ARCADIO_SEGUNDO_REGRESA_TALLER", "titulo": "José Arcadio Segundo reaparece y se encierra con el coronel Aureliano Buendía", "tipo": "otro", "capitulo": 13, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "José Arcadio Segundo reaparece en la casa, pasa sin saludar a nadie y se encierra en el taller con el coronel Aureliano Buendía. Úrsula, que lo orienta por el sonido de sus botas de capataz, observa que es el que más se parece a Santa Sofía de la Piedad, y que él y el coronel Aureliano Buendía son los únicos de la familia vinculados por afinidades verdaderas.", "orden_cronologico": 1312, "lugar": "CASA_BUENDIA"}, {"id": "EVT_GRINGOS_DESVIAN_RIO", "titulo": "La compañía bananera desvía el río y fortifica la tumba de José Arcadio", "tipo": "desastre", "capitulo": 12, "participantes": ["SENOR_JACK_BROWN"], "descripcion": "Los gringos, con recursos antes reservados a la Divina Providencia, modifican el régimen de lluvias, aceleran el ciclo de las cosechas y trasladan el río de donde estuvo siempre al otro extremo de la población, detrás del cementerio. Sobre la tumba descolorida de José Arcadio construyen una fortaleza de hormigón para que el olor a pólvora del cadáver no contamine las aguas.", "orden_cronologico": 1212, "lugar": "MACONDO"}, {"id": "EVT_ESPECTRO_JOSE_ARCADIO_BUENDIA", "titulo": "El espectro de José Arcadio Buendía camina por la casa", "tipo": "vision", "capitulo": 12, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "El intrincado frangollo de verdades y espejismos que traen la electricidad, el cine, el teléfono y el gramófono convulsiona al espectro de José Arcadio Buendía bajo el castaño y lo obliga a caminar por toda la casa aun a pleno día.", "orden_cronologico": 1213, "lugar": "CASA_BUENDIA"}, {"id": "EVT_DIPLOMA_CLAVICORDIO_MEME", "titulo": "Meme recibe el diploma de concertista de clavicordio", "tipo": "otro", "capitulo": 14, "participantes": ["MEME", "FERNANDA_DEL_CARPIO", "AURELIANO_SEGUNDO"], "descripcion": "Meme termina sus estudios de clavicordio y recibe el diploma de concertista. A pesar de las apariencias, ella misma reconoce que el instrumento le resulta indiferente.", "orden_cronologico": 1403, "lugar": "CONVENTO_CLAUSURA"}, {"id": "EVT_NACIMIENTO_AMARANTA_URSULA", "titulo": "Nacimiento de Amaranta Úrsula", "tipo": "nacimiento", "capitulo": 14, "participantes": ["AMARANTA_URSULA", "FERNANDA_DEL_CARPIO", "AURELIANO_SEGUNDO"], "descripcion": "Nace Amaranta Úrsula, la hija menor de Aureliano Segundo y Fernanda del Carpio.", "orden_cronologico": 1404, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CONOCE_MAURICIO_BABILONIA", "titulo": "Meme conoce a Mauricio Babilonia", "tipo": "otro", "capitulo": 14, "participantes": ["MEME", "MAURICIO_BABILONIA", "PATRICIA_BROWN"], "descripcion": "A través de Patricia Brown, Meme visita el taller mecánico de la compañía bananera y conoce allí a Mauricio Babilonia.", "orden_cronologico": 1405, "lugar": "TALLER_MECANICA"}, {"id": "EVT_MARIPOSAS_AMARILLAS_MAURICIO", "titulo": "Las mariposas amarillas anuncian a Mauricio Babilonia", "tipo": "vision", "capitulo": 14, "participantes": ["MAURICIO_BABILONIA", "MEME", "FERNANDA_DEL_CARPIO"], "descripcion": "Cada vez que Mauricio Babilonia se acerca, una nube de mariposas amarillas lo precede. Durante el encierro de Meme, las mariposas invaden la casa cada noche delatando sus visitas. Fernanda las mata con bomba de insecticida, convencida de que traen mala suerte. Una noche entra al dormitorio de Meme y las cataplasmas de mostaza esparcidas por el suelo le revelan la verdad.", "orden_cronologico": 1406, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FERNANDA_SORPRENDE_MEME_CINE", "titulo": "Fernanda sorprende a Meme besando a un hombre en el cine", "tipo": "conflicto", "capitulo": 14, "participantes": ["MEME", "FERNANDA_DEL_CARPIO"], "descripcion": "Fernanda entra al cine y reconoce a su hija besándose con un hombre en la penumbra. No alcanza a verle la cara, solo oye su voz decir «Lo siento, amor». La saca del cine sin decirle una palabra, la lleva por la calle de los Turcos y la encierra con llave en el dormitorio.", "orden_cronologico": 1407, "lugar": "TEATRO_MACONDO"}, {"id": "EVT_VISITA_MAURICIO_EXPULSION", "titulo": "Mauricio visita la casa y Fernanda lo echa", "tipo": "conflicto", "capitulo": 14, "participantes": ["MAURICIO_BABILONIA", "FERNANDA_DEL_CARPIO", "MEME"], "descripcion": "Mauricio Babilonia llega a la casa de los Buendía. Fernanda lo echa diciéndole «Lárguese»; identifica que es él quien vio a su hija en el cine.", "orden_cronologico": 1408, "lugar": "CASA_BUENDIA"}, {"id": "EVT_URSULA_RETIRO_CAMA", "titulo": "Úrsula se recoge en su cuarto tras la muerte de Amaranta", "tipo": "otro", "capitulo": 14, "participantes": ["URSULA_IGUARAN"], "descripcion": "Tras los nueve noches de velorio de Amaranta, Úrsula se mete en su cuarto y no vuelve a salir.", "orden_cronologico": 1409, "lugar": "CASA_BUENDIA"}, {"id": "EVT_LLEGADA_AURELIANO_BABILONIA_CASA", "titulo": "Aureliano Babilonia llega a la casa de los Buendía", "tipo": "llegada", "capitulo": 15, "participantes": ["AURELIANO_BABILONIA", "FERNANDA_DEL_CARPIO"], "descripcion": "Fernanda recibe en una canasta al bebé que las monjas le enviaron desde el convento. Lo cría en secreto, ocultando que es nieto de la familia.", "orden_cronologico": 1504, "lugar": "CASA_BUENDIA"}, {"id": "EVT_TREN_MUERTOS", "titulo": "El tren de los muertos", "tipo": "otro", "capitulo": 15, "participantes": ["JOSE_ARCADIO_SEGUNDO"], "descripcion": "José Arcadio Segundo despierta entre los cadáveres de los huelguistas en un tren que los lleva al mar para arrojarlos. Consigue escapar y llegar a Macondo.", "orden_cronologico": 1505, "lugar": "MACONDO"}, {"id": "EVT_JOSE_ARCADIO_SEGUNDO_ESCONDIDO", "titulo": "José Arcadio Segundo se esconde en el cuarto de Melquíades", "tipo": "otro", "capitulo": 15, "participantes": ["JOSE_ARCADIO_SEGUNDO"], "descripcion": "Perseguido por el ejército, José Arcadio Segundo se refugia en el cuarto de Melquíades, el único lugar que los soldados no logran ver cuando registran la casa. Allí pasa meses leyendo los pergaminos de Melquíades. Protegido por la luz sobrenatural y por la sensación de ser invisible, encuentra el reposo que no tuvo un solo instante de su vida anterior. El único miedo que persiste es el de que lo entierren vivo; se lo confiesa a Santa Sofía de la Piedad, quien le promete luchar por estar viva para asegurarse de que lo entierren muerto.", "orden_cronologico": 1506, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_INICIO_LLUVIA", "titulo": "Comienzo de las lluvias interminables", "tipo": "otro", "capitulo": 15, "participantes": [], "descripcion": "Tras la masacre comienza una lluvia que durará casi cinco años, arrastrando a Macondo hacia la decadencia y el olvido.", "orden_cronologico": 1507, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_MEME_CRACOVIA", "titulo": "Muerte de Meme en el convento de Cracovia", "tipo": "muerte", "capitulo": 15, "participantes": ["MEME"], "descripcion": "Meme muere anciana en el convento, sin haber pronunciado una sola palabra desde que Fernanda la arrancó de Macondo. Ni siquiera su hijo llega a conocerla.", "orden_cronologico": 1508, "lugar": "CRACOVIA"}, {"id": "EVT_MUERTE_LORENZO_GAVILAN", "titulo": "Muerte de Lorenzo Gavilán en la masacre", "tipo": "muerte", "capitulo": 15, "participantes": ["LORENZO_GAVILAN"], "descripcion": "Lorenzo Gavilán muere en la masacre de la estación. José Arcadio Segundo lo reconoce en el tren de los muertos: lleva enrollado en la mano el cinturón con la hebilla de plata moreliana con que trató de abrirse camino entre el pánico.", "orden_cronologico": 1509, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_SEGUNDO_DESCUBRE_NIETO", "titulo": "Aureliano Segundo descubre y acoge a su nieto Aureliano", "tipo": "otro", "capitulo": 16, "participantes": ["AURELIANO_SEGUNDO", "AURELIANO_BABILONIA", "FERNANDA_DEL_CARPIO"], "descripcion": "En un descuido de Fernanda, el pequeño Aureliano Babilonia aparece en el corredor. Aureliano Segundo descubre así quién es y lo acoge: le corta el pelo, lo viste y le enseña a perderle el miedo a la gente. Reconoce en él los rasgos de los Buendía. Fernanda acepta con alivio no tener que cargar sola con el secreto.", "orden_cronologico": 1602, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CANTALETA_FERNANDA", "titulo": "La cantaleta de Fernanda y la destrucción de la vajilla", "tipo": "conflicto", "capitulo": 16, "participantes": ["FERNANDA_DEL_CARPIO", "AURELIANO_SEGUNDO"], "descripcion": "Fernanda desata una cantaleta interminable contra Aureliano Segundo: su holgazanería, sus adulterios, la indignidad de su linaje. Aureliano Segundo la escucha impasible un día entero; cuando ya no puede más, rompe metódicamente tiestos, vajilla de china, cristalería de Bohemia, cuadros y espejos contra el suelo. Luego sale y regresa antes de medianoche con carne salada, arroz y plátanos. Desde entonces no vuelve a faltar comida en la casa.", "orden_cronologico": 1603, "lugar": "CASA_BUENDIA"}, {"id": "EVT_URSULA_DEMENCIA", "titulo": "Demencia senil de Úrsula: visitas imaginarias con los muertos", "tipo": "otro", "capitulo": 16, "participantes": ["URSULA_IGUARAN", "AMARANTA_URSULA", "AURELIANO_BABILONIA"], "descripcion": "En el tercer año de la lluvia, Úrsula pierde el sentido de la realidad y confunde épocas: llora durante tres días la muerte de Petronila Iguarán (enterrada hace más de un siglo), cree que el pequeño Aureliano es el coronel de niño y que el seminarista José Arcadio es el primogénito. Los niños organizan visitas imaginarias con sus antepasados muertos; ella conversa feliz con ellos. Solo al hablar del tesoro enterrado recobra lucidez para guardarlo.", "orden_cronologico": 1604, "lugar": "CASA_BUENDIA"}, {"id": "EVT_BUSQUEDA_TESORO_URSULA", "titulo": "Aureliano Segundo busca el tesoro enterrado de Úrsula", "tipo": "otro", "capitulo": 16, "participantes": ["AURELIANO_SEGUNDO", "URSULA_IGUARAN", "PILAR_TERNERA"], "descripcion": "Aureliano Segundo contrata cuadrillas de excavadores y sondea el patio con barretas. Pilar Ternera confirma la existencia del tesoro: 7 214 monedas en tres sacos de lona, en un radio de 122 metros de la cama de Úrsula, pero no hallable hasta que tres junios consecutivos sequen el barro. Las excavaciones agrietan la galería oriental y derrumban tres aposentos. El tesoro no aparece.", "orden_cronologico": 1605, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FIN_LLUVIA", "titulo": "Fin de las lluvias tras cuatro años, once meses y dos días", "tipo": "otro", "capitulo": 16, "participantes": [], "descripcion": "Un viernes a las dos de la tarde aparece un sol bermejo y áspero. La lluvia no vuelve en diez años. Había durado exactamente cuatro años, once meses y dos días.", "orden_cronologico": 1606, "lugar": "MACONDO"}, {"id": "EVT_MACONDO_RUINAS", "titulo": "Macondo en ruinas tras el diluvio", "tipo": "otro", "capitulo": 16, "participantes": ["AURELIANO_SEGUNDO"], "descripcion": "Al escampar, Macondo es un campo de escombros: muebles destrozados, esqueletos de animales cubiertos de lirios, casas abandonadas. La compañía bananera ha desmantelado sus instalaciones; de la ciudad alambrada solo quedan ruinas. El único rastro de los gringos es un guante de Patricia Brown en un automóvil sofocado por las trinitarias. Los árabes de la calle de los Turcos, impasibles, siguen sentados en el mismo lugar que sus padres y sus abuelos. Aureliano Segundo les pregunta de qué recursos misteriosos se valieron para no naufragar. Uno tras otro, sin ponerse de acuerdo, todos le dan la misma respuesta: «Nadando.»", "orden_cronologico": 1607, "lugar": "MACONDO"}, {"id": "EVT_PETRA_COTES_RIFAS", "titulo": "Petra Cotes inicia las rifas para reconstruir la fortuna", "tipo": "otro", "capitulo": 16, "participantes": ["PETRA_COTES", "AURELIANO_SEGUNDO"], "descripcion": "Arruinada por el diluvio, Petra Cotes escaba en su corazón y encuentra una rabia reflexiva y justa con la que jura restaurar la fortuna despilfarrada por el amante y exterminada por la lluvia. Cuando Aureliano Segundo vuelve a buscarla, la encuentra verde, desgreñada y sarnosa, pero escribiendo números en pedacitos de papel para hacer una rifa. Solo le queda una mula que ha mantenido viva con su rabia: cuando se acabaron las hierbas, el maíz y las raíces, la albergó en su propio dormitorio y le dio a comer las sábanas de percal, los tapices persas, los sobrecamas de peluche, las cortinas de terciopelo y el palio bordado con hilos de oro y borlones de seda de la cama episcopal.", "orden_cronologico": 1608, "lugar": "MACONDO"}, {"id": "EVT_HUIDA_CATAURE", "titulo": "Cataure huye de Macondo al extenderse la plaga del insomnio", "tipo": "partida", "capitulo": 3, "participantes": ["CATAURE"], "descripcion": "Cuando la plaga del insomnio que Cataure y Visitación trajeron de su tribu empieza a extenderse por Macondo, Cataure huye sin despedirse de nadie. Visitación se queda. No volverá a vérsele hasta la muerte de José Arcadio Buendía, cuando regresa para decir «He venido al sepelio del rey.»", "orden_cronologico": 315, "lugar": "CASA_MOSCOTE"}, {"id": "EVT_CARTA_FERNANDA_MEME_MUERTA", "titulo": "Fernanda le escribe a José Arcadio que su hermana Renata murió", "tipo": "otro", "capitulo": 15, "participantes": ["FERNANDA_DEL_CARPIO", "JOSE_ARCADIO_QUINTO", "MEME"], "descripcion": "Fernanda le escribe una extensa carta a su hijo José Arcadio, que ya va a recibir las órdenes menores, comunicándole que su hermana Renata había expirado en la paz del Señor a consecuencia del vómito negro. No le dice la verdad sobre el convento ni sobre el hijo que Meme dejó en Macondo.", "orden_cronologico": 1510, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FUGA_BROWN", "titulo": "Huida y ocultación de identidad del señor Brown", "tipo": "partida", "capitulo": 15, "participantes": ["SENOR_JACK_BROWN"], "descripcion": "Tan pronto como los trabajadores notifican el pliego de peticiones, el señor Brown engancha su suntuoso vagón de vidrio y desaparece de Macondo con su familia y los representantes de la compañía, conducidos a territorio seguro por el ejército. Más tarde es sorprendido viajando de incógnito en un vagón de tercera clase y obligado a firmar una copia del pliego. Al día siguiente comparece ante los jueces con el pelo pintado de negro y hablando castellano sin tropiezos; sus abogados demuestran que no es Jack Brown sino un vendedor de plantas medicinales llamado Dagoberto Fonseca. En una tercera ocasión los abogados exhiben un certificado de defunción autenticado por cónsules: el señor Brown habría sido atropellado en Chicago por un carro de bomberos el nueve de junio.", "orden_cronologico": 1511, "lugar": "MACONDO"}, {"id": "EVT_JUICIOS_BANANERA", "titulo": "Los abogados de la compañía declaran la inexistencia de los trabajadores", "tipo": "conflicto", "capitulo": 15, "participantes": ["JOSE_ARCADIO_SEGUNDO"], "descripcion": "Los abogados de la compañía bananera, vestidos de negro, desmontaban cada cargo con arbitrios que parecían magia. Primero demuestran que el hombre que firmó el pliego era un usurpador. Luego, ante los tribunales supremos, argumentan que la compañía no tiene ni ha tenido nunca trabajadores a su servicio, sino que los reclutaba ocasionalmente y con carácter temporal. Un fallo de tribunal proclama en bandos solemnes la inexistencia de los trabajadores.", "orden_cronologico": 1512, "lugar": "MACONDO"}, {"id": "EVT_VERSION_OFICIAL_BANANERA", "titulo": "La versión oficial: acuerdo sindical, tres días de jolgorios y lluvia indefinida", "tipo": "otro", "capitulo": 15, "participantes": ["SENOR_JACK_BROWN", "AURELIANO_SEGUNDO"], "descripcion": "El gobierno difunde un bando extraordinario: los obreros han obedecido pacíficamente, y los dirigentes sindicales, con espíritu patriótico, han reducido sus peticiones a dos puntos — reforma de los servicios médicos y construcción de letrinas. El señor Brown acepta las condiciones y ofrece pagar tres días de jolgorios públicos para celebrar el fin del conflicto. Cuando los militares le preguntan la fecha de la firma, mira el cielo rayado de relámpagos y responde: «Será cuando escampe. Mientras dure la lluvia, suspendemos toda clase de actividades.» Aureliano Segundo lee el bando y tampoco cree la versión de la masacre que le cuenta su hermano.", "orden_cronologico": 1513, "lugar": "MACONDO"}, {"id": "EVT_FERNANDA_MEDICOS_INVISIBLES", "titulo": "Fernanda y su correspondencia con los médicos invisibles", "tipo": "otro", "capitulo": 16, "participantes": ["FERNANDA_DEL_CARPIO", "URSULA_IGUARAN"], "descripcion": "Fernanda padece una dolencia ginecológica que no se atreve a nombrar y mantiene una ansiosa correspondencia con médicos invisibles que la tratan por vía telepática. La lluvia interrumpe el correo y pierde sus cartas. Baraja ponerse la máscara de tigre de su marido para hacerse examinar con nombre ficticio por los médicos de la compañía bananera, pero estos ya han desmantelado sus dispensarios. Consulta a Úrsula, pero su pudibundez la lleva a confundir los términos hasta tal punto que Úrsula concluye que el problema es intestinal y le receta una papeleta de calomel en ayunas. Prefiere morirse antes que ponerse en manos del único médico que queda en Macondo, un francés extravagante que se alimenta con hierba para burros.", "orden_cronologico": 1609, "lugar": "CASA_BUENDIA"}, {"id": "EVT_GUERRERO_TARTARO_ENCICLOPEDIA", "titulo": "El guerrero tártaro de la enciclopedia que se parece al coronel", "tipo": "otro", "capitulo": 16, "participantes": ["AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "AURELIANO_BABILONIA", "AMARANTA_URSULA"], "descripcion": "Hojeando la enciclopedia inglesa con los niños, Aureliano Segundo encuentra un jinete que, a pesar de su atuendo exótico, le resulta familiar. Tras examinarlo largamente concluye que es un retrato del coronel Aureliano Buendía. Se lo muestra a Fernanda, quien admite el parecido no solo con el coronel sino con todos los miembros de la familia. En realidad es un guerrero tártaro.", "orden_cronologico": 1610, "lugar": "CASA_BUENDIA"}, {"id": "EVT_URSULA_RESTAURA_CASA", "titulo": "Úrsula se recupera y emprende la restauración de la casa", "tipo": "otro", "capitulo": 17, "participantes": ["URSULA_IGUARAN", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "Tras el diluvio, Úrsula recupera ráfagas de lucidez y abandona la cama sin ayuda por primera vez desde la muerte de Amaranta. Descubre que la casa está devorada por comején, polilla, hormigas coloradas y cucarachas. Se lanza a limpiarla metódicamente: ahuyenta insectos con insecticida, raspa venas de comején, asfixia hormigas con cal viva y exige que se abran puertas y ventanas. Dice: «A este paso terminaremos devorados por las bestias.»", "orden_cronologico": 1700, "lugar": "CASA_BUENDIA"}, {"id": "EVT_URSULA_VISITA_JA_SEGUNDO", "titulo": "Úrsula abre el cuarto de Melquíades y confronta a José Arcadio Segundo", "tipo": "otro", "capitulo": 17, "participantes": ["URSULA_IGUARAN", "JOSE_ARCADIO_SEGUNDO"], "descripcion": "Decidida a no dejar ningún rincón a los insectos, Úrsula consigue que le abran el cuarto de Melquíades. La pestilencia casi la derriba. Encuentra a José Arcadio Segundo inmerso en sus pergaminos, irreconocible bajo la maraña de pelos. Le espeta: «Tanto tratar de inculcarte las buenas costumbres para que terminaras viviendo como un puerco.» Él responde con una frase que Úrsula reconoce como suya propia: «Qué quería, el tiempo pasa.» Ella replica: «Así es, pero no tanto», y comprende de nuevo que el tiempo da vueltas en redondo.", "orden_cronologico": 1701, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_JUDIO_ERRANTE", "titulo": "El Judío Errante: muerte de los pájaros y captura de la criatura", "tipo": "muerte", "capitulo": 17, "participantes": ["PADRE_ANTONIO_ISABEL"], "descripcion": "El día del entierro de Úrsula los pájaros se estrellan contra las paredes y mueren en los dormitorios. El padre Antonio Isabel predica que la mortandad se debe al Judío Errante, que él mismo vio: un híbrido de macho cabrío y hembra hereje cuyo aliento calcina el aire. Una mujer encuentra huellas de bípedo con pezuña hendida. Dos semanas después atrapan la criatura en una fosa: pesa como un buey, tiene muñones cicatrizados de alas desbastadas a hachazo, manos tersas y ojos grandes. La cuelgan de un almendro y luego la incineran.", "orden_cronologico": 1702, "lugar": "MACONDO"}, {"id": "EVT_PADRE_ANTONIO_ISABEL_ASILO", "titulo": "El padre Antonio Isabel es llevado a un asilo", "tipo": "otro", "capitulo": 17, "participantes": ["PADRE_ANTONIO_ISABEL", "PADRE_AUGUSTO_ANGEL"], "descripcion": "Delegados curiales enviados a investigar la mortandad de pájaros y el sacrificio del Judío Errante encuentran al padre Antonio Isabel jugando a la gallina ciega con los niños. Creyendo que su informe era producto de alucinación senil, se lo llevan a un asilo. Poco después llega en su lugar el padre Augusto Ángel.", "orden_cronologico": 1703, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_REBECA", "titulo": "Muerte de Rebeca", "tipo": "muerte", "capitulo": 17, "participantes": ["REBECA", "ARGENIDA", "AURELIANO_SEGUNDO"], "descripcion": "A finales del año, Argénida pide ayuda a las autoridades para derribar la puerta del dormitorio donde Rebeca llevaba tres días encerrada. La encuentran en la cama solitaria, enroscada como un camarón, con la cabeza pelada por la tiña y el pulgar metido en la boca. Aureliano Segundo se hace cargo del entierro. Intenta restaurar la casa para venderla, pero la destrucción es tan profunda que las paredes se desconchaban recién pintadas y la cizaña trituraba los pisos.", "orden_cronologico": 1704, "lugar": "MACONDO"}, {"id": "EVT_DECADENCIA_MACONDO_XVII", "titulo": "Macondo olvidado: gitanos, condecoración y tren amarillo", "tipo": "otro", "capitulo": 17, "participantes": ["AURELIANO_SEGUNDO", "PETRA_COTES"], "descripcion": "La desidia y el olvido corroen Macondo. Emisarios del presidente llegan a entregar la condecoración tantas veces rechazada por el coronel Aureliano Buendía, pero pierden la tarde buscando a algún descendiente. Aureliano Segundo está tentado de recibirla creyendo que es de oro macizo; Petra Cotes lo disuade. Los gitanos regresan con fierros imantados y lupas, y la gente vuelve a asombrarse como si fueran descubrimientos nuevos. Un desvencijado tren amarillo, que ni trae ni lleva a nadie, es lo único que queda del ferrocarril de la compañía bananera.", "orden_cronologico": 1705, "lugar": "MACONDO"}, {"id": "EVT_OPERACION_FERNANDA_PESARIO", "titulo": "La operación telepática de Fernanda y el pesario", "tipo": "otro", "capitulo": 17, "participantes": ["FERNANDA_DEL_CARPIO", "JOSE_ARCADIO_QUINTO"], "descripcion": "Fernanda se encierra en su dormitorio cubierta con una sábana blanca y con la cabeza al norte para la intervención telepática acordada con los médicos invisibles. Despierta con una costura bárbara de la ingle al esternón. Pero los médicos le escriben que no encontraron nada de lo descrito: solo un descenso del útero que requiere un pesario. Su pudibundez le impide preguntar qué es hasta que descubre que el médico francés se había ahorcado tres meses antes. Su hijo José Arcadio le manda los pesarios desde Roma.", "orden_cronologico": 1706, "lugar": "CASA_BUENDIA"}, {"id": "EVT_GALLINA_CONJURO", "titulo": "Pilar Ternera, los pesarios y la gallina del conjuro", "tipo": "otro", "capitulo": 17, "participantes": ["AURELIANO_SEGUNDO", "PILAR_TERNERA"], "descripcion": "Aureliano Segundo encuentra en el ropero de Fernanda unos objetos extraños —los pesarios enviados desde Roma— y los lleva a Pilar Ternera creyendo que son instrumentos de brujería; ella los quema en una hoguera. Luego, aquejado por un nudo en la garganta, la consulta. Ella lee en las barajas que Fernanda le está clavando alfileres en un retrato para retenerlo, y que eso le ha causado un tumor. Le indica mojar una gallina clueca y enterrarla viva bajo el castaño. Él lo hace de tan buena fe que al terminar ya siente que respira mejor. En realidad, lo que tiene es un tumor real que lo matará.", "orden_cronologico": 1707, "lugar": "MACONDO"}, {"id": "EVT_JA_SEGUNDO_MAESTRO_AURELIANO", "titulo": "José Arcadio Segundo enseña a Aureliano y descifran los pergaminos", "tipo": "otro", "capitulo": 17, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_BABILONIA"], "descripcion": "José Arcadio Segundo enseña a Aureliano a leer y escribir, lo inicia en los pergaminos y le transmite su interpretación de la compañía bananera: que corrompió y exprimió Macondo y que sus ingenieros provocaron el diluvio para eludir compromisos con los trabajadores. Ambos comprenden que en el cuarto siempre es marzo y siempre es lunes, y que José Arcadio Buendía no estaba loco: vislumbró que el tiempo puede astillarse. José Arcadio Segundo ha clasificado el alfabeto de los pergaminos: entre 47 y 53 caracteres que Aureliano reconoce en la enciclopedia inglesa.", "orden_cronologico": 1708, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_TUMOR_AURELIANO_SEGUNDO", "titulo": "Aureliano Segundo descubre que se está muriendo y vende rifas desesperadamente", "tipo": "otro", "capitulo": 17, "participantes": ["AURELIANO_SEGUNDO", "PETRA_COTES"], "descripcion": "El nudo en la garganta se vuelve tan opresivo que Aureliano Segundo comprende que se está muriendo. No se lo dice a nadie. Atormentado por no poder mandar a Amaranta Úrsula a Bruselas, triplica las rifas y recorre el pueblo de madrugada vendiendo billetes con la ansiedad de un moribundo: «No la dejen ir, que sólo llega una vez cada cien años.» La gente acaba burlándose de él y llamándole «don Divina Providencia».", "orden_cronologico": 1709, "lugar": "MACONDO"}, {"id": "EVT_RIFA_TIERRAS_DILUVIO", "titulo": "La gran rifa de las tierras del diluvio para mandar a Amaranta Úrsula a Bruselas", "tipo": "otro", "capitulo": 17, "participantes": ["AURELIANO_SEGUNDO", "PETRA_COTES", "AMARANTA_URSULA"], "descripcion": "Comprendiendo que con cerdos y chivos rifados su hija no llegará a Bruselas, Aureliano Segundo concibe la rifa de las tierras arrasadas por el diluvio. El alcalde la anuncia con un bando; los billetes a cien pesos se agotan en menos de una semana. La noche del sorteo hay una fiesta comparable a las de la compañía bananera, y Aureliano Segundo toca por última vez en el acordeón las canciones olvidadas de Francisco el Hombre, ya sin voz para cantarlas.", "orden_cronologico": 1710, "lugar": "MACONDO"}, {"id": "EVT_PARTIDA_AMARANTA_URSULA_BRUSELAS", "titulo": "Partida de Amaranta Úrsula a Bruselas", "tipo": "partida", "capitulo": 17, "participantes": ["AMARANTA_URSULA", "AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO"], "descripcion": "Dos meses después de la gran rifa, Amaranta Úrsula parte a Bruselas al cuidado de unas franciscanas que van a Toledo. Lleva un traje de seda rosada con pensamientos artificiales, zapatos de cordobán y un cinturón de lona con el dinero cosido al cuerpo. Aureliano Segundo la ve alejarse en el tren sin poder cantarle adiós — ya no tiene voz. Los esposos se quedan bajo el sol abrasante, tomados del brazo por primera vez desde el día de la boda, viendo el tren perderse en el horizonte.", "orden_cronologico": 1711, "lugar": "MACONDO"}, {"id": "EVT_PETRA_COTES_VIVERES_SECRETOS", "titulo": "Petra Cotes envía víveres en secreto a la casa Buendía", "tipo": "otro", "capitulo": 18, "participantes": ["PETRA_COTES", "FERNANDA_DEL_CARPIO"], "descripcion": "Tras la muerte de Aureliano Segundo, un amigo se presenta a pagar una deuda inventada, y desde entonces un mandadero lleva cada miércoles un canasto de víveres. Fernanda nunca supo que era Petra Cotes quien los enviaba: primero por humillarla, luego por orgullo y finalmente por compasión. En los peores tiempos Petra se quedó sin comer para que Fernanda no lo hiciera, y mantuvo el compromiso hasta ver pasar su entierro.", "orden_cronologico": 1800, "lugar": "MACONDO"}, {"id": "EVT_MELQUIADES_ULTIMA_VISITA", "titulo": "Última aparición de Melquíades y el encargo del sánscrito", "tipo": "vision", "capitulo": 18, "participantes": ["AURELIANO_BABILONIA", "MELQUIADES"], "descripcion": "Aureliano descifra que los pergaminos están en sánscrito. Melquíades confirma que sus visitas al cuarto están contadas, pero se va tranquilo porque Aureliano tendrá tiempo de aprender sánscrito antes de que los pergaminos cumplan un siglo. Le indica que en la tienda del sabio catalán hay un Sanskrit Primer que las polillas devorarán seis años después. La última vez que Aureliano lo percibe es como una presencia invisible que murmura: 'He muerto de fiebre en los médanos de Singapur.'", "orden_cronologico": 1801, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_SANTA_SOFIA_ABANDONA", "titulo": "Santa Sofía de la Piedad abandona la casa", "tipo": "partida", "capitulo": 18, "participantes": ["SANTA_SOFIA_DE_LA_PIEDAD", "AURELIANO_BABILONIA"], "descripcion": "Vencida por la invasión de maleza, comején y hormigas que ya ni el cuarto de Melquíades resiste, Santa Sofía le dice a Aureliano: 'Me rindo. Esta es mucha casa para mis pobres huesos.' Se va con un atadito de dos o tres mudas y catorce pescaditos de oro que le da Aureliano; dice que irá a Riohacha con una prima hermana, pero nadie la conocía ni ella había tenido contacto con pariente alguno. Jamás se vuelve a saber de ella.", "orden_cronologico": 1802, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_FERNANDA", "titulo": "Muerte de Fernanda del Carpio", "tipo": "muerte", "capitulo": 18, "participantes": ["FERNANDA_DEL_CARPIO", "AURELIANO_BABILONIA"], "descripcion": "Fernanda muere sola en su dormitorio, tendida con la capa de armiño y la corona de cartón dorado que usaba para evocar su pasado de reina ficticia. Aureliano la descubre al notar que la comida del día anterior sigue en el rescoldo. Durante cuatro meses vaporiza mercurio en el atanor del abuelo de su abuelo, siguiendo la fórmula de Melquíades, para conservar el cadáver. José Arcadio la encuentra intacta al llegar.", "orden_cronologico": 1803, "lugar": "CASA_BUENDIA"}, {"id": "EVT_LLEGADA_JOSE_ARCADIO_QUINTO", "titulo": "Llegada de José Arcadio y el reconocimiento del bastardo", "tipo": "llegada", "capitulo": 18, "participantes": ["JOSE_ARCADIO_QUINTO", "AURELIANO_BABILONIA", "FERNANDA_DEL_CARPIO"], "descripcion": "José Arcadio llega desde Roma en bodega de emigrantes, con los últimos desperdicios de su falso esplendor. Encuentra el cadáver de Fernanda, saca de debajo de su falda los pesarios y la llave del ropero, y lee la carta voluminosa que Fernanda dejó en un cofrecito damasquinado. En la tercera página detiene la lectura, examina a Aureliano con mirada de segundo reconocimiento y le dice: 'Entonces tú eres el bastardo.' Le ordena retirarse a su cuarto.", "orden_cronologico": 1804, "lugar": "CASA_BUENDIA"}, {"id": "EVT_AURELIANO_LIBRERIA_CATALAN", "titulo": "Aureliano visita la librería del sabio catalán", "tipo": "descubrimiento", "capitulo": 18, "participantes": ["AURELIANO_BABILONIA", "SABIO_CATALAN"], "descripcion": "Tras la muerte de Fernanda, Aureliano se concede el permiso que ella le negó y sale por primera vez. Recorre once cuadras hasta el callejón de los sueños y entra en la tienda abigarrada del sabio catalán, que escribe sin atenderlo. Encuentra sin dificultad los cinco libros indicados por Melquíades y los entrega con un pescadito de oro. El sabio lo devuelve todo: 'El último hombre que leyó esos libros debió ser Isaac el Ciego. Llévatelo.'", "orden_cronologico": 1805, "lugar": "MACONDO"}, {"id": "EVT_HALLAZGO_TESORO_URSULA", "titulo": "Hallazgo del tesoro escondido de Úrsula", "tipo": "descubrimiento", "capitulo": 18, "participantes": ["JOSE_ARCADIO_QUINTO"], "descripcion": "José Arcadio y un niño rubio de ojos rosados ven un resplandor amarillo bajo el cemento del dormitorio de Úrsula. Levantan las placas del rincón donde siempre estuvo la cama y encuentran la cripta que Aureliano Segundo no encontró en sus excavaciones: tres sacos de lona con alambre de cobre que contienen 7214 doblones de a cuatro, relumbrando como brasas en la oscuridad.", "orden_cronologico": 1806, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FIESTA_ALBERCA_CHAMPA", "titulo": "La fiesta en la alberca llena de champán", "tipo": "otro", "capitulo": 18, "participantes": ["JOSE_ARCADIO_QUINTO"], "descripcion": "Con el tesoro hallado, José Arcadio restaura el dormitorio de Meme y llena la alacena de manjares. Una noche él y los cuatro niños llenan la alberca de champán; se zambullen desnudos nadando como pájaros en un cielo de burbujas, mientras José Arcadio flota boca arriba evocando a Amaranta. Los niños destruyen las cortinas de terciopelo, cuartean el espejo de cristal de roca y desbaratan el baldaquín intentando acostarse en tumulto.", "orden_cronologico": 1807, "lugar": "CASA_BUENDIA"}, {"id": "EVT_JOSE_ARCADIO_EXPULSA_NINOS", "titulo": "José Arcadio expulsa a los niños", "tipo": "conflicto", "capitulo": 18, "participantes
