": ["JOSE_ARCADIO_QUINTO"], "descripcion": "Enardecido por el asco y la lástima de sí mismo, José Arcadio saca del baúl unas disciplinas de perrero eclesiástico que guardaba junto a un cilicio, y expulsa a los niños aullando y azotándolos sin misericordia. Queda postrado con una crisis de asma de varios días, y pide a Aureliano que compre polvos para inhalar en la botica, lo que constituye la segunda salida de Aureliano a la calle.", "orden_cronologico": 1808, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_AURELIANO_AMADOR", "titulo": "Muerte de Aureliano Amador ante la puerta de la casa", "tipo": "muerte", "capitulo": 18, "participantes": ["AURELIANO_AMADOR", "JOSE_ARCADIO_QUINTO", "AURELIANO_BABILONIA"], "descripcion": "Aureliano Amador, único superviviente de los 17 hijos del coronel Aureliano Buendía, llega de madrugada con ropas en piltrafas y una cruz de ceniza en la frente; lo sostiene no el instinto de conservación sino la costumbre del miedo. Se identifica y pide refugio, pero José Arcadio y Aureliano no lo reconocen y lo echan a empellones. Dos agentes de policía que lo habían rastreado por medio mundo surgen de entre los almendros y le hacen dos tiros de máuser que le penetran por la cruz de ceniza.", "orden_cronologico": 1809, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_JOSE_ARCADIO_QUINTO", "titulo": "Asesinato de José Arcadio Quinto ahogado en la alberca", "tipo": "muerte", "capitulo": 18, "participantes": ["JOSE_ARCADIO_QUINTO", "AURELIANO_BABILONIA"], "descripcion": "Una mañana de septiembre los cuatro niños expulsados irrumpen por los portillos del techo mientras José Arcadio se baña. Se meten vestidos en la alberca, lo agarran por el pelo y mantienen su cabeza hundida hasta que cesa la agonía. El silencioso y pálido cuerpo de delfín se desliza hasta el fondo de las aguas fragantes. Se llevan los tres sacos de oro que solo ellos y su víctima sabían dónde estaban. Aureliano lo descubre esa tarde flotando, enorme y tumefacto, y solo entonces comprende cuánto había empezado a quererlo.", "orden_cronologico": 1810, "lugar": "CASA_BUENDIA"}, {"id": "EVT_CANARIOS_FUGADOS", "titulo": "Los canarios de las islas Afortunadas se fugan", "tipo": "otro", "capitulo": 19, "participantes": ["AMARANTA_URSULA"], "descripcion": "Amaranta Úrsula retrasó el viaje meses para encontrar un barco que hiciera escala en las islas Afortunadas y allí seleccionó las veinticinco parejas de canarios más finos para repoblar el cielo de Macondo. A medida que los pájaros se reproducen los va soltando por parejas, pero más tardan en sentirse libres que en fugarse del pueblo: dan una vuelta en el cielo apenas el tiempo indispensable para encontrar el rumbo de regreso a las islas.", "orden_cronologico": 1901, "lugar": "MACONDO"}, {"id": "EVT_GASTON_ENTOMOLOGIA", "titulo": "Gastón colecciona insectos y monta en velocípedo", "tipo": "otro", "capitulo": 19, "participantes": ["GASTON"], "descripcion": "Convencido de que Amaranta Úrsula será derrotada por la realidad, Gastón no se molesta en armar el velocípedo y se dedica a perseguir huevos de araña entre las telarañas. Luego arma el aparatoso velocípedo con rueda anterior mucho mayor que la posterior, y se dedica a capturar y disecar insectos aborígenes que remite en frascos de mermelada a su antiguo profesor de historia natural de la Universidad de Lieja, donde estudió entomología avanzada aunque su vocación dominante es la aeronáutica.", "orden_cronologico": 1902, "lugar": "MACONDO"}, {"id": "EVT_GASTON_PROYECTO_AEREO", "titulo": "Gastón prepara el servicio de correo aéreo", "tipo": "acuerdo", "capitulo": 19, "participantes": ["GASTON"], "descripcion": "Gastón retoma el proyecto de correo aéreo que tenía planeado para el Congo Belga. Prepara un campo de aterrizaje en la antigua región encantada, estudia vientos y geografía del litoral. Sus gestiones infunden en el pueblo la sospecha de que quiere sembrar banano. Obtiene licencias y contratos de exclusividad. Convence a sus socios de Bruselas de embarcar el primer aeroplano al cuidado de un mecánico, pero el barco nunca aparece en las listas del Caribe y la correspondencia se vuelve mutuamente suspicaz.", "orden_cronologico": 1903, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_EXPLORA_MACONDO", "titulo": "Aureliano recorre Macondo y responde el teléfono", "tipo": "descubrimiento", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA"], "descripcion": "Aureliano recorre las calles polvorientas, examina la antigua zona bananera en ruinas — piscina seca llena de zapatos podridos, esqueleto de un perro alemán atado a una cadena. Un teléfono empieza a repicar en una casa desbaratada; lo descuelga y una mujer angustiada pregunta en inglés. Él le contesta: la huelga terminó, los tres mil muertos fueron echados al mar, la compañía bananera se fue, Macondo está en paz desde hace muchos años.", "orden_cronologico": 1904, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_ANCIANO_NIGROMANTA", "titulo": "Aureliano conoce al anciano antillano y a Nigromanta", "tipo": "otro", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "ANCIANO_ANTILLANO", "NIGROMANTA"], "descripcion": "En el barrio de tolerancia, Aureliano encuentra al más antiguo de los negros antillanos —único que recuerda al coronel Aureliano Buendía— cantando salmos en el pórtico. Conversa con él en papiamento y comparte el caldo de cabezas de gallo que prepara su bisnieta Nigromanta. Al morir el anciano, Aureliano deja de frecuentar la casa pero sigue encontrándose con Nigromanta bajo los almendros de la plaza.", "orden_cronologico": 1905, "lugar": "MACONDO"}, {"id": "EVT_AMANTES_AURELIANO_NIGROMANTA", "titulo": "Aureliano y Nigromanta se hacen amantes", "tipo": "otro", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "NIGROMANTA"], "descripcion": "Para sofocar su pasión por Amaranta Úrsula, Aureliano va a Nigromanta con el peso con cincuenta centavos que le pidió a su tía. Nigromanta lo lleva a su cuarto de veladoras y lienzo percudido, esperando despachar a un niño asustado, pero se encuentra con un poder que le exige una reacomodación sísmica. Se hacen amantes fijos. A la hora de la siesta él la visita, come desnudo con ella bajo las estrellas diurnas del techo de cinc. Cuando Aureliano le confiesa su amor por Amaranta Úrsula, ella lo sigue recibiendo pero le cobra los servicios con rigor, llevando la cuenta con rayitas de uña detrás de la puerta.", "orden_cronologico": 1906, "lugar": "MACONDO"}, {"id": "EVT_CUATRO_AMIGOS_LIBRERIA", "titulo": "Aureliano conoce a los cuatro amigos en la librería del sabio catalán", "tipo": "otro", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "ALVARO", "GERMAN", "ALFONSO", "GABRIEL", "SABIO_CATALAN"], "descripcion": "El sabio catalán instiga a Aureliano a terciar en una discusión sobre cómo matar cucarachas en la Edad Media; Aureliano diserta sobre las 1603 variedades de cucaracha y el único método eficaz: el deslumbramiento solar. El fatalismo enciclopédico es el principio de una gran amistad con Álvaro, Germán, Alfonso y Gabriel. Las sesiones empiezan en la librería a las seis de la tarde y terminan en los burdeles al amanecer.", "orden_cronologico": 1907, "lugar": "MACONDO"}, {"id": "EVT_BURDEL_NINO_DE_ORO", "titulo": "El burdel zoológico El Niño de Oro y el reencuentro con Pilar Ternera", "tipo": "otro", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "ALVARO", "GERMAN", "ALFONSO", "GABRIEL", "PILAR_TERNERA"], "descripcion": "Álvaro descubre El Niño de Oro: un inmenso salón al aire libre con doscientos alcaravanes, garzas, caimanes, serpientes de doce cascabeles y una tortuga de concha dorada. La anciana que vigila el ingreso en un mecedor de bejuco reconoce en Aureliano la viruela de la soledad del coronel Aureliano Buendía y exclama: '¡Ay, Aureliano!' Es Pilar Ternera, que ha renunciado a llevar las cuentas de su edad cuando cumplió los 145 años. Aureliano se refugia en su regazo para llorar su amor por Amaranta Úrsula; ella le dice: 'No te preocupes. En cualquier lugar en que esté, ella te está esperando.'", "orden_cronologico": 1908, "lugar": "MACONDO"}, {"id": "EVT_GASTON_ESPERA_AEROPLANO", "titulo": "Gastón espera el aeroplano que no llega y considera ir a Bruselas", "tipo": "otro", "capitulo": 19, "participantes": ["GASTON", "AMARANTA_URSULA"], "descripcion": "Gastón pasea por las calles mirando el cielo, esperando el aeroplano que sus socios dicen haber embarcado pero que no figura en las listas del Caribe. La correspondencia alcanza tal suspicacia recíproca que deja de escribir y empieza a sugerir un viaje rápido a Bruselas para aclarar el asunto. El plan se desvanece en cuanto Amaranta Úrsula reitera que no se moverá de Macondo ni aunque se quede sin marido.", "orden_cronologico": 1909, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_CONFIESA_AMOR_AMARANTA", "titulo": "Aureliano confiesa su amor a Amaranta Úrsula", "tipo": "conflicto", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "AMARANTA_URSULA"], "descripcion": "Amaranta Úrsula se pincha un dedo abriendo una lata de melocotones; Aureliano se precipita a chuparle la sangre con una avidez que le eriza la piel. Ella ríe inquieta. Aureliano se desborda: le cuenta que se levanta a medianoche a llorar en su ropa íntima. Espantada, Amaranta Úrsula cierra la mano herida hasta convertirla en un nudo de piedra y le dice: '¡Bruto! Me voy a Bélgica en el primer barco.'", "orden_cronologico": 1910, "lugar": "CASA_BUENDIA"}, {"id": "EVT_AMARANTA_AURELIANO_AMANTES", "titulo": "Amaranta Úrsula y Aureliano se hacen amantes", "tipo": "otro", "capitulo": 19, "participantes": ["AURELIANO_BABILONIA", "AMARANTA_URSULA", "GASTON"], "descripcion": "Eran las cuatro y media de la tarde. Aureliano sigue a Amaranta Úrsula hasta el dormitorio nupcial; ella le hace señas al cuarto contiguo donde Gastón escribe una carta. La resistencia de ella es genuina pero silenciosa para no alertar al marido: forcejean con agresiones espectrales y lentas que parecen una reconciliación en el fondo de un estanque. Amaranta Úrsula empieza a reírse con los labios apretados y la brega degenera en retozo. Una conmoción descomunal la inmoviliza; solo tiene tiempo de meterse una mordaza entre los dientes para que no se le salgan los chillidos.", "orden_cronologico": 1911, "lugar": "CASA_BUENDIA"}, {"id": "EVT_SABIO_CATALAN_REGRESA", "titulo": "El sabio catalán cierra la librería y regresa a su aldea", "tipo": "partida", "capitulo": 20, "participantes": ["SABIO_CATALAN", "AURELIANO_BABILONIA", "GERMAN", "ALFONSO", "GABRIEL", "ALVARO"], "descripcion": "Derrotado por la nostalgia de una primavera tenaz, el sabio catalán remata la librería y regresa a su aldea mediterránea. Se lleva los tres cajones de manuscritos con caligrafía morada peleando a insultos cartagineses con los inspectores del ferrocarril que quieren mandarlos como carga. Su despedida a los amigos: 'Ahí les dejo esa mierda.' Luego envía cartas desde el barco que muestran su nostalgización progresiva: cada carta más triste que la anterior, hasta que recomienda olvidar cuanto les enseñó, cagarsen en Horacio, y recordar que el pasado era mentira y toda primavera irrecuperable. 'El mundo habrá acabado de joderse el día en que los hombres viajen en primera clase y la literatura en el vagón de carga.'", "orden_cronologico": 2000, "lugar": "MACONDO"}, {"id": "EVT_AMIGOS_DISPERSAN", "titulo": "Los cuatro amigos abandonan Macondo", "tipo": "partida", "capitulo": 20, "participantes": ["ALVARO", "ALFONSO", "GERMAN", "GABRIEL", "MERCEDES"], "descripcion": "Álvaro vende todo, incluido un tigre cautivo, y compra un pasaje eterno en un tren sin fin, enviando tarjetas desde las estaciones intermedias. Alfonso y Germán se van un sábado con idea de regresar el lunes y nunca se vuelve a saber de ellos. Gabriel gana el concurso de una revista francesa y parte a París con dos mudas de ropa, zapatos y las obras completas de Rabelais; hay que hacerle señas al maquinista para que detenga el tren.", "orden_cronologico": 2001, "lugar": "MACONDO"}, {"id": "EVT_GASTON_ABANDONA_MACONDO", "titulo": "Gastón se va a Bruselas a recuperar el aeroplano", "tipo": "partida", "capitulo": 20, "participantes": ["GASTON", "AMARANTA_URSULA"], "descripcion": "Cansado de esperar el aeroplano, Gastón mete en una maletita lo indispensable y su archivo de correspondencia y parte con el propósito de regresar por el aire antes de que sus privilegios sean cedidos a aviadores alemanes con un proyecto más ambicioso. Ante la carta de Amaranta Úrsula que le confiesa el amor por Aureliano, responde con una calma casi paternal, dos páginas sobre las veleidades de la pasión y votos por su felicidad. Seis meses después escribe desde Leopoldville, donde por fin recibió el aeroplano, pidiendo solo que le manden el velocípedo: lo único que tenía valor sentimental.", "orden_cronologico": 2002, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_BUSCA_FILIACION", "titulo": "Aureliano busca su origen en los archivos parroquiales", "tipo": "descubrimiento", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA"], "descripcion": "Atormentado por creer que es hermano de su mujer, Aureliano acude a los archivos rezumantes y apolillados de la parroquia. Rastrea partidas de bautismo a través de cuatro tomos buscando entre los diecisiete Aurelianos, pero las fechas son demasiado remotas. El cura artrítico que lo observa desde la hamaca le pregunta su nombre. Cuando Aureliano responde y menciona las treinta y dos guerras y los tres mil muertos echados al mar, el cura le mira con lástima: 'Ay, hijo. A mí me bastaría con estar seguro de que tú y yo existimos en este momento.'", "orden_cronologico": 2004, "lugar": "MACONDO"}, {"id": "EVT_CARTA_MUERTE_SABIO", "titulo": "La carta ajena que nadie lee", "tipo": "otro", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA", "AMARANTA_URSULA"], "descripcion": "En el sexto mes del embarazo llega una carta franqueada en Barcelona con caligrafía administrativa y aspecto de recado enemigo. Aureliano se la arrebata a Amaranta Úrsula: 'Ésta no. No quiero saber lo que dice.' El sabio catalán no vuelve a escribir. La carta queda en la repisa donde Fernanda olvidó su anillo matrimonial, consumiéndose en su mala noticia mientras los amantes navegan contra la corriente.", "orden_cronologico": 2009, "lugar": "CASA_BUENDIA"}, {"id": "EVT_AURELIANO_VAGA_POR_PUEBLO", "titulo": "Aureliano vaga por Macondo tras la muerte de Amaranta Úrsula", "tipo": "otro", "capitulo": 20, "participantes": ["AURELIANO_BABILONIA", "NIGROMANTA"], "descripcion": "Aureliano tapa el cadáver con una manta y vaga por el pueblo desierto buscando un desfiladero al pasado. Llora ante la puerta de la antigua librería del sabio; se rompe los puños contra los muros de El Niño de Oro clausurado. En el último salón abierto del barrio de tolerancia un cantinero de brazo seco le invita a aguardiente; Aureliano le habla de la desgracia de su corazón, seco y achicharrado por haberlo levantado contra su hermana; terminan llorando juntos. En la madrugada grita en medio de la plaza: '¡Los amigos son unos hijos de puta!' Nigromanta lo recoge de un charco de vómito y lágrimas, lo lleva a su cuarto y tacha con una raya de carbón todas las deudas que él le debía.", "orden_cronologico": 2008, "lugar": "MACONDO"}];
const RAW_PERSONAJES_CRONO = [{"id": "JOSE_ARCADIO_BUENDIA_FUNDADOR", "nombre": "José Arcadio Buendía", "apodos": ["el fundador", "el patriarca"], "generacion": 1, "capitulo": 1, "grupo": "buendia", "descripcion": "Patriarca y fundador de Macondo. Obstinado e imaginativo, apasionado por los inventos y la alquimia. Pierde la cordura y pasa sus últimos años atado al castaño del patio hasta morir."}, {"id": "MELQUIADES", "nombre": "Melquíades", "apodos": [], "generacion": null, "capitulo": 1, "grupo": null, "descripcion": "Gitano anciano y sabio, jefe de la banda que visita Macondo. Introduce inventos y tecnología. Muere y regresa de entre los muertos varias veces. Escribe unos pergaminos proféticos en sánscrito que no serán descifrados hasta 100 años después."}, {"id": "AURELIANO_BUENDIA_CORONEL", "nombre": "Aureliano Buendía", "apodos": ["el coronel Aureliano Buendía", "Aurelito"], "generacion": 2, "capitulo": 1, "grupo": "buendia", "descripcion": "Segundo hijo de José Arcadio Buendía y Úrsula, primer ser humano nacido en Macondo. Silencioso y retraído, con capacidades presientes desde niño. Se convierte en coronel liberal, pierde 32 levantamientos armados, engendra 17 hijos con 17 mujeres, sobrevive 14 intentos de asesinato. Firma la rendición y pasa sus últimos años haciendo pececitos de oro en el taller. Muere apoyado en el castaño del patio, olvidado por todos."}, {"id": "AMARANTA_BUENDIA", "nombre": "Amaranta", "apodos": [], "generacion": 2, "capitulo": 2, "grupo": "buendia", "descripcion": "Hija de José Arcadio Buendía y Úrsula. Ama a Pietro Crespi pero lo rechaza cruelmente llevando a su suicidio. También rechaza a Gerineldo Márquez. Se quema la mano con carbones y lleva una venda negra hasta su muerte como penitencia. Muere virgen, tras coser su propio sudario, sabiendo el día exacto de su muerte."}, {"id": "REBECA", "nombre": "Rebeca", "apodos": [], "generacion": 2, "capitulo": 3, "grupo": "buendia", "descripcion": "Huérfana adoptada por los Buendía, supuesta prima lejana de Úrsula. Llega cargando los huesos de sus padres en una cesta. Come tierra y cal compulsivamente en momentos de ansiedad. Enamorada de Pietro Crespi, acaba casándose con José Arcadio hijo. Tras la muerte de su esposo se recluye en su casa y vive aislada del mundo hasta morir."}, {"id": "VISITACION", "nombre": "Visitación", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "India guajira que llegó a Macondo con su hermano huyendo de una plaga de insomnio en su tribu. Trabaja como sirvienta para los Buendía. Reconoce los síntomas del insomnio en Rebeca y advierte del peligro. Había rechazado un trono en su tribu. Muere en la casa de los Buendía."}, {"id": "PIETRO_CRESPI", "nombre": "Pietro Crespi", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Italiano apuesto y refinado, llega a instalar la pianola de los Buendía y enseñar a bailar. Maestro de música y director de escuela de baile. Amado por Rebeca y Amaranta. Tras ser rechazado definitivamente por Amaranta después de años de espera, se suicida cortándose las muñecas en su almacén."}, {"id": "APOLINAR_MOSCOTE", "nombre": "Don Apolinar Moscote", "apodos": [], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Magistrado enviado por el gobierno para gobernar Macondo. José Arcadio Buendía lo expulsa pero regresa con soldados y acaba quedándose. Conservador convencido. Padre de Remedios y Amparo Moscote. Manipula las elecciones locales a favor de los conservadores, detonando la guerra civil."}, {"id": "REMEDIOS_MOSCOTE", "nombre": "Remedios Moscote", "apodos": [], "generacion": null, "capitulo": 4, "grupo": "allegado", "descripcion": "Hija menor de Don Apolinar Moscote. El coronel Aureliano Buendía Aureliano se enamora de ella cuando tiene 9 años y se casan tras su primera menstruación. Serena y tranquila, cuida a José Arcadio Buendía atado al árbol y acepta a Aureliano José como propio. Muere joven a causa de una infección tras un aborto espontáneo de gemelos. Su daguerrotipo queda colgado en la pared de la casa."}, {"id": "ARCADIO", "nombre": "Arcadio", "apodos": [], "generacion": 3, "capitulo": 3, "grupo": "buendia", "descripcion": "Hijo de José Arcadio hijo y Pilar Ternera, criado por los Buendía ignorando su verdadero origen. Gobernante civil y militar de Macondo nombrado por el coronel Aureliano Buendía, resulta un tirano despiadado. Se casa con Santa Sofía de La Piedad. Es fusilado al amanecer al final de la guerra, dejando una hija recién nacida sin nombre y a su esposa embarazada."}, {"id": "AURELIANO_JOSE", "nombre": "Aureliano José", "apodos": [], "generacion": 3, "capitulo": 4, "grupo": "buendia", "descripcion": "Hijo del coronel Aureliano Buendía Aureliano Buendía y Pilar Ternera. Criado por Remedios Moscote como propio y luego por Amaranta. Desarrolla una obsesión incestuosa por su tía Amaranta, quien finalmente lo rechaza. Deserta de las tropas federalistas para regresar a casa. Es asesinado por soldados en un teatro."}, {"id": "SANTA_SOFIA_DE_LA_PIEDAD", "nombre": "Santa Sofía de La Piedad", "apodos": [], "generacion": null, "capitulo": 6, "grupo": "allegado", "descripcion": "Joven virgen a quien Pilar Ternera paga para que vaya en su lugar a la cama de Arcadio. Se convierte en su esposa. Madre de Remedios la Bella, José Arcadio Segundo y Aureliano Segundo. Trabaja incansablemente en la casa Buendía durante décadas sin quejarse, tratada más como sirvienta que como matriarca. Al final abandona la casa agotada y no se vuelve a saber de ella."}, {"id": "GERINELDO_MARQUEZ", "nombre": "Gerineldo Márquez", "apodos": ["el coronel Gerineldo Márquez"], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Amigo de infancia y camarada del coronel Aureliano Buendía Aureliano, uno de los 21 hombres con que inicia la guerra. Leal y convencido de los ideales liberales. Ama a Amaranta, quien lo rechaza. Administra Macondo como líder civil en ausencia del coronel Aureliano Buendía. Condenado a muerte por el propio Coronel por traición; Úrsula amenaza con matar a su hijo si lo ejecuta. Muere durante el diluvio."}, {"id": "JOSE_RAQUEL_MONCADA", "nombre": "José Raquel Moncada", "apodos": ["el general Moncada"], "generacion": null, "capitulo": 5, "grupo": null, "descripcion": "General conservador que acaba siendo alcalde de Macondo tras la guerra, convirtiendo el pueblo en un lugar pacífico. Viejo amigo del coronel Aureliano Buendía Aureliano pese a estar en bandos contrarios. Ejecutado por orden del coronel Aureliano Buendía al final del conflicto. El coronel Aureliano Buendía asume su responsabilidad excusándose en 'la revolución', algo que Moncada rechaza."}, {"id": "REMEDIOS_LA_BELLA", "nombre": "Remedios la Bella", "apodos": ["Remedios"], "generacion": 4, "capitulo": 8, "grupo": "buendia", "descripcion": "Hija de Arcadio y Santa Sofía de La Piedad. De belleza sobrenatural que provoca locura y muerte en los hombres que la rodean. Deambula desnuda sin entender el efecto que causa. Simple y pura hasta lo divino. Asciende al cielo un día mientras dobla sábanas en el patio con Fernanda, desapareciendo entre las nubes."}, {"id": "JOSE_ARCADIO_SEGUNDO", "nombre": "José Arcadio Segundo", "apodos": [], "generacion": 4, "capitulo": 7, "grupo": "buendia", "descripcion": "Gemelo de Aureliano Segundo, hijo de Arcadio y Santa Sofía. Delgado como el coronel Aureliano Buendía. Presencia un fusilamiento de niño y detesta las prácticas militares. Lidera la huelga de los trabajadores bananeros. Único superviviente de la masacre de las 3000 personas. Pasa sus últimos años oculto en el cuarto de Melquíades estudiando los pergaminos. Muere al mismo tiempo que su gemelo."}, {"id": "AURELIANO_SEGUNDO", "nombre": "Aureliano Segundo", "apodos": [], "generacion": 4, "capitulo": 7, "grupo": "buendia", "descripcion": "Gemelo de José Arcadio Segundo, hijo de Arcadio y Santa Sofía. Robusto y jovial. Se casa con Fernanda del Carpio pero mantiene a Petra Cotes como amante toda su vida. Amasa una fortuna gracias a la fértil multiplicación del ganado vinculada a su pasión por Petra. Muere del mismo tumor en la garganta al mismo instante que su gemelo."}, {"id": "PETRA_COTES", "nombre": "Petra Cotes", "apodos": [], "generacion": null, "capitulo": 10, "grupo": "allegado", "descripcion": "Viuda mestiza, amante permanente de Aureliano Segundo. Su pasión por él provoca la misteriosa multiplicación del ganado. Acepta con lucidez el reparto de Aureliano entre ella y Fernanda. En la vejez, con los animales muertos por el diluvio, vende rifas y envía comida a los Buendía privándose ella misma. Guarda las botas de Aureliano como garantía de que volverá."}, {"id": "FERNANDA_DEL_CARPIO", "nombre": "Fernanda del Carpio", "apodos": [], "generacion": null, "capitulo": 10, "grupo": "allegado", "descripcion": "Elegida como la más bella entre 5000 mujeres para ser reina de carnaval. Criada en total aislamiento por una familia venida a menos, educada en un convento. Religiosa, rígida y ajena a la realidad. Esposa de Aureliano Segundo. Solo permite relaciones 42 días al año según su calendario religioso. Lleva la casa Buendía con mano de hierro y muere sola, encontrada por Aureliano Babilonia en su cama."}, {"id": "MEME", "nombre": "Meme", "apodos": ["Renata Remedios", "Renata"], "generacion": 5, "capitulo": 11, "grupo": "buendia", "descripcion": "Hija de Aureliano Segundo y Fernanda del Carpio. Social y alegre, al contrario que su madre. Clavicordista sin pasión. Se enamora del mecánico Mauricio Babilonia. Cuando Fernanda descubre la relación hace disparar a Mauricio y envía a Meme a un convento, donde pierde el habla para siempre. Muere de vieja sin haber vuelto a ser feliz, dejando un hijo, Aureliano Babilonia."}, {"id": "MAURICIO_BABILONIA", "nombre": "Mauricio Babilonia", "apodos": [], "generacion": null, "capitulo": 14, "grupo": "allegado", "descripcion": "Mecánico pobre de la compañía bananera. Amante de Meme. Siempre rodeado de mariposas amarillas que anuncian su presencia. Recibe un disparo de un guardia cuando intenta colarse por el techo del baño para ver a Meme, quedándole paralítico de por vida. Muere de viejo, solo, atormentado por los recuerdos y las mariposas."}, {"id": "JOSE_ARCADIO_QUINTO", "nombre": "José Arcadio", "apodos": [], "generacion": 5, "capitulo": 11, "grupo": "buendia", "descripcion": "Hijo de Aureliano Segundo y Fernanda del Carpio, enviado al seminario de Roma para convertirse en papa. Regresa sin haberse ordenado, habiendo malvivido fuera. Restaura parte de la casa Buendía. Mantiene una extraña relación con los niños del vecindario. Es ahogado por ellos en la piscina, que le roban el oro de Úrsula."}, {"id": "AMARANTA_URSULA", "nombre": "Amaranta Úrsula", "apodos": [], "generacion": 5, "capitulo": 14, "grupo": "buendia", "descripcion": "Hija menor de Aureliano Segundo y Fernanda. Vital, hermosa y resuelta. Estudia en Bruselas y regresa con su esposo Gastón, convencida de poder revivir Macondo. Se enamora de su sobrino Aureliano Babilonia sin saber que lo es. Muere desangrada tras dar a luz al último Buendía, el niño con cola de cerdo."}, {"id": "AURELIANO_BABILONIA", "nombre": "Aureliano Babilonia", "apodos": [], "generacion": 6, "capitulo": 14, "grupo": "buendia", "descripcion": "Hijo de Meme y Mauricio Babilonia, criado en secreto por Fernanda. Vive recluido en el taller de Melquíades estudiando los pergaminos y aprendiendo sánscrito. Se enamora de su tía Amaranta Úrsula sin saber el parentesco. Descifra los manuscritos en el momento en que el viento arrasa Macondo, leyendo su propio destino en el instante en que ocurre."}, {"id": "GASTON", "nombre": "Gastón", "apodos": [], "generacion": null, "capitulo": 17, "grupo": "allegado", "descripcion": "Belga apasionado por la aviación, esposo de Amaranta Úrsula. La conoció al aterrizar de emergencia en un campo de flores. Intenta adaptarse a Macondo mientras planea montar un servicio de correo aéreo. Cuando Amaranta Úrsula le confiesa su amor por Aureliano Babilonia, responde con ecuanimidad y se va a Bruselas, guardando sus propios intereses con calma."}, {"id": "PRUDENCIO_AGUILAR", "nombre": "Prudencio Aguilar", "apodos": [], "generacion": null, "capitulo": 1, "grupo": null, "descripcion": "Vecino de Riohacha. En una pelea de gallos pone en evidencia públicamente la supuesta impotencia de José Arcadio Buendía. Este lo mata con una lanza. Su fantasma persigue al matrimonio Buendía con una tristeza tan profunda que provoca compasión, no terror, forzándoles a abandonar su pueblo y fundar Macondo. José Arcadio Buendía sigue hablando con su espectro hasta el final de su vida."}, {"id": "FRANCISCO_EL_HOMBRE", "nombre": "Francisco el Hombre", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Trovador itinerante de casi 200 años que recorre las comunidades de la región narrando sus historias y noticias como un cuentacuentos ambulante. A través de él Aureliano se entera de la muerte de su madre adoptiva. Representa el medio de comunicación oral antes de que lleguen el correo, el telégrafo y el teléfono."}, {"id": "PADRE_NICANOR", "nombre": "Padre Nicanor", "apodos": ["el padre Nicanor"], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Sacerdote horrorizado de que Macondo viva sin religión. Decide quedarse para construir una iglesia. Demuestra el poder de Dios levitándose 12 centímetros tras beber una taza de chocolate, repitiendo la demostración hasta recaudar fondos suficientes. Intenta sin éxito convencer a José Arcadio Buendía atado al árbol de la existencia de Dios."}, {"id": "BRUNO_CRESPI", "nombre": "Bruno Crespi", "apodos": [], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Hermano menor de Pietro Crespi. Administra la tienda de música mientras Pietro dirige la escuela de baile. Se casa con Amparo Moscote. Más tarde abre el primer cine de Macondo, que despierta sentimientos encontrados en la gente hasta que el alcalde explica que las imágenes son solo ilusiones."}, {"id": "AMPARO_MOSCOTE", "nombre": "Amparo Moscote", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Hija de Don Apolinar Moscote y hermana de Remedios. Hace de enlace entre Pietro Crespi y Rebeca, entregando en secreto las cartas del italiano. Se casa con Bruno Crespi. Cose el vestido de novia de Rebeca cuando Amaranta destruye el primero."}, {"id": "AURELIANO_TRISTE", "nombre": "Aureliano Triste", "apodos": [], "generacion": 3, "capitulo": 11, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía con distintas mujeres durante la guerra. Establece una fábrica de hielo en Macondo, cumpliendo el sueño del patriarca. Trae el ferrocarril a la aldea en su segunda visita, abriendo la puerta a la llegada de la compañía bananera y la modernidad."}, {"id": "AURELIANO_CENTENO", "nombre": "Aureliano Centeno", "apodos": [], "generacion": 3, "capitulo": 11, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo para ayudar a Aureliano Triste en la producción de hielo. Descubre por casualidad cómo fabricar helados, iniciando un nuevo negocio."}, {"id": "AURELIANO_AMADOR", "nombre": "Aureliano Amador", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Único superviviente de la noche en que los 17 hermanos fueron cazados uno a uno por la marca de ceniza en la frente. Se refugia con los indios. Reaparece años después hecho jirones en la puerta de la casa Buendía, donde nadie lo reconoce, y es abatido por dos policías en el acto."}, {"id": "NIGROMANTA", "nombre": "Nigromanta", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Bisnieta del anciano negro antillano que guardaba memoria del coronel Aureliano Buendía. Prostituta del barrio de tolerancia, grande, de huesos sólidos y cabeza acorazada de pelos de alambre. Lleva desde que nació un cintillo de acero alrededor de la cintura. Aureliano Babilonia acude a ella para sofocar su pasión por Amaranta Úrsula, pero termina confiándole su amor reprimido; a partir de entonces ella le cobra los servicios con tanto rigor que lleva la cuenta con rayitas de uña detrás de la puerta."}, {"id": "AURELIANO_ULTIMO", "nombre": "Aureliano", "apodos": [], "generacion": 7, "capitulo": 20, "grupo": "buendia", "descripcion": "Hijo de Aureliano Babilonia y Amaranta Úrsula, producto del incesto que la estirpe temió durante siete generaciones. Nace con cola de cerdo, el signo profetizado desde los tiempos de Úrsula Iguarán. Su madre muere en el parto. Abandonado en el jardín, es devorado por las hormigas. Su muerte coincide con la destrucción de Macondo por el viento mientras Aureliano descifra los pergaminos."}, {"id": "JOSE_ARCADIO_HIJO", "nombre": "José Arcadio", "apodos": [], "generacion": 2, "capitulo": 1, "grupo": "buendia", "descripcion": "Hijo mayor de José Arcadio Buendía y Úrsula. Nacido en el camino hacia Macondo antes de su fundación. Físicamente enorme y tatuado. Tiene una relación con Pilar Ternera de la que nace Arcadio. Se marcha con los gitanos y regresa años después. Se casa con Rebeca. Muere asesinado de un disparo sin herida visible, con olor a pólvora."}, {"id": "PILAR_TERNERA", "nombre": "Pilar Ternera", "apodos": [], "generacion": null, "capitulo": 2, "grupo": "allegado", "descripcion": "Habitante original de Macondo, traída por sus padres para alejarla de un hombre que la violó con 14 años. Lectora de cartas, adivina y proxeneta. Se acuesta con José Arcadio (hijo) y con el coronel Aureliano Buendía Aureliano, engendrando hijos de ambos hermanos. Vive 145 años y muere en su mecedora en el burdel que regenta al final de la novela."}, {"id": "URSULA_IGUARAN", "nombre": "Úrsula Iguarán", "apodos": [], "generacion": 1, "capitulo": 1, "grupo": "buendia", "descripcion": "Matriarca de la familia Buendía. Prima y esposa de José Arcadio Buendía. Voz de la razón y sustento real de la familia. Emprendedora, incansable y longeva (vive más de 110 años). Pierde la vista en su vejez pero lo disimula memorizando distancias y rutinas."}, {"id": "CATAURE", "nombre": "Cataure", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Indio guajiro, hermano de Visitación. Llegó a Macondo huyendo de la peste del insomnio que asolaba su tribu. Desapareció en la noche en que reconoció la enfermedad en los ojos de Rebeca, sin despedirse ni dar explicaciones."}, {"id": "MAGNIFICO_VISBAL", "nombre": "Magnífico Visbal", "apodos": [], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Amigo de la infancia de Aureliano Buendía e hijo de uno de los fundadores de Macondo. Acompaña al Coronel en sus salidas a la tienda de Catarino."}, {"id": "DOCTOR_ALIRIO_NOGUERA", "nombre": "Alirio Noguera", "apodos": ["el doctor Noguera", "el falso homeópata"], "generacion": null, "capitulo": 5, "grupo": null, "descripcion": "Médico homeópata fraudulento que llega a Macondo con un diploma falso de Leipzig y glóbulos de azúcar. En realidad es un agitador federalista que escapó a Curazao disfrazado de cura tras ser capturado en la primera aventura liberal. Recluta a la juventud de Macondo para un plan de asesinatos individuales contra funcionarios conservadores y sus familias. Aureliano lo rechaza llamándolo matarife. Fusilado en la plaza por el ejército conservador sin juicio previo."}, {"id": "GREGORIO_STEVENSON", "nombre": "Gregorio Stevenson", "apodos": ["el coronel Stevenson"], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Coronel liberal enviado por el coronel Aureliano Buendía Aureliano Buendía para negociar la rendición de Macondo. Llega disfrazado de anciana montada en un burro cargado de escobas. Usa un pescadito de oro como salvoconducto. Arcadio lo encarcela por no traer carta escrita. Logra convencer a Arcadio de darle armas y defiende el cuartel solo con veinte cartuchos disparando por distintas ventanas antes de morir en la reconquista conservadora."}, {"id": "ROQUE_CARNICERO", "nombre": "Roque Carnicero", "apodos": ["el capitán Carnicero"], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Capitán del ejército conservador, especialista en ejecuciones sumarias. Dirige el pelotón que fusila a Arcadio. Su nombre propio es una coincidencia irónica con su oficio. Aparecerá más adelante en relación directa con el coronel Aureliano Buendía Aureliano Buendía."}, {"id": "CAPITAN_AQUILES_RICARDO", "nombre": "Aquiles Ricardo", "apodos": [], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Capitán comandante de la guarnición conservadora de Macondo durante el período de paz. Los liberales lo señalan como provocador. Mata a Aureliano José de un tiro en la espalda al intentar registrarlo en la puerta del teatro; muere él mismo cuatro horas antes, abatido por dos balas de origen desconocido."}, {"id": "EL_CACHORRO", "nombre": "Padre Coronel", "apodos": ["El Cachorro"], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Sacerdote veterano de la primera guerra federalista que reemplaza al padre Nicanor Reyna, consumido por las fiebres hepáticas. El pueblo lo apoda El Cachorro."}, {"id": "DON_MELCHOR_ESCALONA", "nombre": "Melchor Escalona", "apodos": ["don Melchor Escalona"], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Maestro viejo enviado desde la ciénaga para hacerse cargo de la escuela restaurada de Macondo. Conocido por hacer caminar de rodillas a los alumnos desaplicados y darles ají picante a los lenguaraces, con la aprobación de los padres."}, {"id": "CARMELITA_MONTIEL", "nombre": "Carmelita Montiel", "apodos": [], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Joven virgen de veinte años que vive en casa de Pilar Ternera. Estaba destinada a ser la compañera de Aureliano José, pero la noche en que lo esperaba con la cama preparada con hojas de romero, él fue al teatro y lo mataron."}, {"id": "GENERAL_TEOFILO_VARGAS", "nombre": "Teófilo Vargas", "apodos": [], "generacion": null, "capitulo": 9, "grupo": null, "descripcion": "General rebelde, indio puro, montaraz, analfabeto. Dotado de una malicia taciturna y una vocación mesiánica que suscita fanatismo en sus hombres. En la segunda asamblea de comandantes rebeldes se adelanta al Coronel y se apodera del mando central. Muere despedazado a machetazos en una emboscada."}, {"id": "VIUDA_MONCADA", "nombre": "Viuda de Moncada", "apodos": [], "generacion": null, "capitulo": 9, "grupo": null, "descripcion": "Esposa del general Moncada, vive en Manaure. Cuando el coronel Aureliano Buendía va a entregarle los objetos personales de su marido, le niega el paso: «Usted mandará en su guerra, pero yo mando en mi casa.» El coronel Aureliano Buendía manda saquear y quemar la casa."}, {"id": "PADRE_ANTONIO_ISABEL", "nombre": "Padre Antonio Isabel", "apodos": [], "generacion": null, "capitulo": 10, "grupo": null, "descripcion": "Párroco de Macondo, sucesor de El Cachorro. Cría gallos de pelea en el patio de la curia y enseña catecismo y teología mientras los cuida. Tutor de José Arcadio Segundo para su primera comunión. Manifiesta desde joven los primeros síntomas del delirio senil: llega a creer que el Diablo ganó la rebelión contra Dios y ocupa el trono celestial."}, {"id": "DON_FERNANDO", "nombre": "Don Fernando", "apodos": [], "generacion": null, "capitulo": 11, "grupo": null, "descripcion": "Padre de Fernanda del Carpio. Aristocrata venido a menos de una ciudad de 32 campanarios. Viste siempre de negro con cuello laminado y leontina de oro; pasa los días encerrado en su despacho. Mandó educar a Fernanda como reina y la entregó a Aureliano Segundo cuando un militar desconocido acudió a su casa. Se comunica con su hija solo por carta. Muere y es enviado a Macondo en un ataúd de plomo lleno de perlas vivas, en una caja de Navidad."}, {"id": "ARGENIDA", "nombre": "Argénida", "apodos": [], "generacion": null, "capitulo": 7, "grupo": null, "descripcion": "Vieja sirvienta que acompaña a Rebeca en su encierro voluntario. Es la única persona con quien Rebeca tiene contacto con el mundo exterior; actúa como intermediaria cuando los hijos del coronel Aureliano Buendía restauran la fachada de la casa."}, {"id": "CAMILA_SAGASTUME", "nombre": "Camila Sagastume", "apodos": ["La Elefanta"], "generacion": null, "capitulo": 13, "grupo": null, "descripcion": "Conocida en todo el país como 'La Elefanta'. Mujer gigantesca y maciza, de rostro hermoso y manos finas, directora de una academia de canto. Aprendió a comer como disciplina moral, no deportiva: quien tiene la conciencia en orden puede comer sin tregua. Compite con Aureliano Segundo en un duelo gastronómico que dura hasta el martes; se detiene voluntariamente para no propiciar la muerte del adversario."}, {"id": "MISTER_HERBERT", "nombre": "Míster Herbert", "apodos": [], "generacion": null, "capitulo": 12, "grupo": null, "descripcion": "Hombre rechoncho y sonriente, empresario de globos cautivos. Llega un miércoles a Macondo, almuerza en casa de los Buendía y examina los bananos con un estilete, granatorio, calibrador, termómetro e higrómetro. Sus observaciones atraen ingenieros, agrónomos y al señor Jack Brown, desencadenando la llegada de la compañía bananera."}, {"id": "SENOR_JACK_BROWN", "nombre": "Señor Jack Brown", "apodos": ["Mr. Brown"], "generacion": null, "capitulo": 12, "grupo": null, "descripcion": "Jefe visible de la compañía bananera estadounidense. Llega en un vagón suplementario laminado de plata con poltronas de terciopelo y techo de vidrios azules, acompañado de abogados de negro y perros alemanes feroces. Instala a los funcionarios locales en el gallinero electrificado y reemplaza las autoridades de Macondo por forasteros autoritarios."}, {"id": "AURELIANO_SERRADOR", "nombre": "Aureliano Serrador", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo durante el auge bananero. Muere asesinado en la noche del exterminio: alguien le dispara desde entre la muchedumbre de la Calle de los Turcos y cae dentro de un caldero de manteca hirviendo."}, {"id": "AURELIANO_ARCAYA", "nombre": "Aureliano Arcaya", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo durante el auge bananero. Muere asesinado en la noche del exterminio: alguien llama a la puerta de su cuarto con el pretexto de avisarle del peligro y le espera con una descarga de máuser que le desbarata el cráneo."}, {"id": "CATARINO", "nombre": "Catarino", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Dueño de la tienda de Catarino."}, {"id": "RENATA_ARGOTE", "nombre": "Renata Argote", "apodos": [], "generacion": null, "capitulo": 11, "grupo": null, "descripcion": "Madre de Fernanda del Carpio, esposa de Don Fernando. De su nombre proviene el de su nieta Meme, cuyo nombre de pila es Renata Remedios."}, {"id": "NICANOR_ULLOA", "nombre": "Nicanor Ulloa", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Padre de Rebeca. Amigo de José Arcadio Buendía. Muerto antes del inicio de la novela; sus restos llegan a Macondo en el talego que carga su hija."}, {"id": "REBECA_MONTIEL", "nombre": "Rebeca Montiel", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Madre de Rebeca, esposa de Nicanor Ulloa. Muerta antes del inicio de la novela; sus restos llegan a Macondo junto a los de su marido en el talego que carga su hija."}, {"id": "PATRICIA_BROWN", "nombre": "Patricia Brown", "apodos": [], "generacion": null, "capitulo": 14, "grupo": null, "descripcion": "Hija del señor Jack Brown, jefe de la compañía bananera. Es una de las tres jóvenes norteamericanas que traban amistad con muchachas de Macondo. Meme aprende inglés, tenis y natación en su casa. Es la intermediaria involuntaria que facilita el primer encuentro de Meme con Mauricio Babilonia en el taller mecánico."}, {"id": "LORENZO_GAVILAN", "nombre": "Lorenzo Gavilán", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Coronel de la revolución mexicana exiliado en Macondo. Amigo de José Arcadio Segundo en los tiempos de la huelga bananera; dice haber sido testigo del heroísmo de Artemio Cruz. Muere en la masacre; José Arcadio Segundo lo identifica entre los cadáveres del tren."}, {"id": "GENERAL_CARLOS_CORTES_VARGAS", "nombre": "General Carlos Cortés Vargas", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Jefe militar que firmó el Decreto Número 4, que declaraba cuadrilla de malhechores a los huelguistas y autorizó al ejército a matarlos a bala."}, {"id": "PETRONILA_IGUARAN", "nombre": "Petronila Iguarán", "apodos": [], "generacion": null, "capitulo": 16, "grupo": null, "descripcion": "Bisabuela de Úrsula Iguarán. Muerta desde hacía más de un siglo cuando transcurre la novela. Úrsula, en su demencia senil, llora durante tres días inconsolables su muerte."}, {"id": "MAYOR_ENRIQUE_GARCIA_ISAZA", "nombre": "Mayor Enrique García Isaza", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Secretario del general Carlos Cortés Vargas. Cofirmante del Decreto Número 4 que declaró cuadrilla de malhechores a los huelguistas bananeros y autorizó al ejército a matarlos."}, {"id": "PADRE_AUGUSTO_ANGEL", "nombre": "Padre Augusto Ángel", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Párroco enviado a Macondo para sustituir al padre Antonio Isabel tras su internamiento en un asilo. Intransigente, audaz y temerario: toca personalmente las campanas varias veces al día y recorre las casas despertando a los dormilones para que vayan a misa. Acaba vencido por la desidia, el polvo ardiente y el sopor del calor."}, {"id": "TRANQUILINA_MARIA_MINIATA_BUENDIA", "nombre": "Tranquilina María Miniata Alacoque Buendía", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Abuela de Úrsula Iguarán. Solo aparece en las visiones delirantes de Úrsula en su vejez: se la ve abanicándose con una pluma de pavorreal en su mecedor de tullida."}, {"id": "AURELIANO_ARCADIO_BUENDIA_ABUELO", "nombre": "Aureliano Arcadio Buendía", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Bisabuelo de Úrsula Iguarán. Aparece en sus delirios seniles vestido con su falso dormán de las guardias virreinales."}, {"id": "AURELIANO_IGUARAN_PADRE", "nombre": "Aureliano Iguarán", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Padre de Úrsula Iguarán. Aparece en los delirios seniles de su hija. Conocido por haber inventado una oración para que se achicharraran y cayeran los gusanos de las vacas."}, {"id": "ANCIANO_ANTILLANO", "nombre": "El anciano antillano", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "El más antiguo de los negros antillanos que quedaron en Macondo. La cabeza algodonada le da aspecto de negativo fotográfico. Canta salmos lúgubres del atardecer en el pórtico de su casa. Único habitante del barrio de tolerancia que guarda memoria del coronel Aureliano Buendía. Bisabuelo de Nigromanta."}, {"id": "ALVARO", "nombre": "Álvaro", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos que Aureliano conoce en la librería del sabio catalán. Descubridor del burdel zoológico El Niño de Oro. Demostró una noche de parranda que la literatura es el mejor juguete que se ha inventado para burlarse de la gente."}, {"id": "GERMAN", "nombre": "Germán", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos de la librería del sabio catalán. Una noche intentó incendiar el burdel de la propietaria risueña para demostrar que no existía."}, {"id": "ALFONSO", "nombre": "Alfonso", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos de la librería del sabio catalán. Autor de historias truculentas como la de los alcaravanes que sacaron los ojos a picotazos a cuatro clientes. Le torció el pescuezo al loro del burdel y lo echó en la olla del sancocho."}, {"id": "GABRIEL", "nombre": "Gabriel", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Bisnieto del coronel Gerineldo Márquez. El único de los cuatro amigos de la librería que no pone en duda la existencia del coronel Aureliano Buendía ni la masacre bananera. Une a Aureliano en una complicidad fundada en hechos reales que nadie más cree. Duerme donde lo sorprende la hora; Aureliano lo encomienda a Nigromanta. Gana un concurso literario y parte a París."}, {"id": "CURA_SIN_NOMBRE", "nombre": "El cura sin nombre", "apodos": [], "generacion": null, "capitulo": 20, "grupo": null, "descripcion": "Cura anciano que sustituyó al padre Augusto Ángel en la parroquia de Macondo. El texto precisa que nadie se tomó el trabajo de averiguar su nombre. Atormentado por la artritis y el insomnio de la duda, espera la piedad de Dios tendido en una hamaca mientras los lagartos y las ratas se disputan la herencia del templo vecino."}, {"id": "MERCEDES", "nombre": "Mercedes", "apodos": [], "generacion": null, "capitulo": 20, "grupo": null, "descripcion": "La boticaria silenciosa de Macondo, novia de Gabriel. Único puente entre Aureliano Babilonia y el mundo exterior tras la partida de los amigos: a través de ella llegan las noticias esporádicas de Gabriel en París. Cuando Aureliano vuelve a buscarla tras la muerte de Amaranta Úrsula, la botica ya no existe y nadie recuerda haberla conocido."}, {"id": "SABIO_CATALAN", "nombre": "El sabio catalán", "apodos": [], "generacion": null, "capitulo": 18, "grupo": null, "descripcion": "Librero catalán de Macondo, dueño de una tienda abigarrada y sombría de libros usados en el callejón donde antes se interpretaban los sueños. Cabellera plateada como penacho de cacatúa, ojos azules vivos y estrechos. Escribe sin cesar una prosa morada en hojas sueltas de cuaderno escolar. Le devuelve a Aureliano los cinco libros y el pescadito de oro advirtiéndole: 'El último que leyó esos libros debió ser Isaac el Ciego.'"}];
</script>
<script>
(function(){

  5:  {t:'Las guerras (I)',    s:'El Coronel toma las armas. Los primeros levantamientos.'},

  16: {t:'Fernanda',          s:'Meme en el convento. Aureliano Babilonia nace en secreto.'},
  17: {t:'La decadencia',     s:'La casa se llena de líquenes. Úrsula diminuta.'},

};

var byId = {};
RAW_PERSONAJES_CRONO.forEach(function(p){ byId[p.id] = p; });
const RAW_LUGARES_CRONO = [{"id": "MACONDO", "nombre": "Macondo"}, {"id": "CASA_BUENDIA", "nombre": "Casa de los Buendía"}, {"id": "PATIO_CASA_BUENDIA", "nombre": "Patio de la casa Buendía"}, {"id": "EL_CASTANO", "nombre": "El castaño"}, {"id": "LABORATORIO_ALQUIMIA", "nombre": "Laboratorio de alquimia / Taller del coronel"}, {"id": "CUARTO_MELQUIADES", "nombre": "Cuarto de Melquíades"}, {"id": "CUARTEL_MACONDO", "nombre": "Cuartel de Macondo"}, {"id": "CASA_MOSCOTE", "nombre": "Casa de los Moscote"}, {"id": "CASA_REBECA", "nombre": "Casa de Rebeca"}, {"id": "TALLER_CRESPI", "nombre": "Tienda de Pietro Crespi"}, {"id": "CEMENTERIO_MACONDO", "nombre": "Cementerio de Macondo"}, {"id": "ESTACION_FERROCARRIL", "nombre": "Estación de ferrocarril"}, {"id": "HOTEL_FORASTEROS", "nombre": "Hotel de los forasteros"}, {"id": "TIENDA_CATARINO", "nombre": "Tienda de Catarino"}, {"id": "IGLESIA_MACONDO", "nombre": "Iglesia de Macondo"}, {"id": "CASA_PILAR", "nombre": "Casa de Pilar Ternera"}, {"id": "BURDEL_PILAR", "nombre": "Burdel de Pilar Ternera"}, {"id": "PLANTACION_BANANERA", "nombre": "Plantación bananera"}, {"id": "EL_RIO", "nombre": "El río"}, {"id": "LA_CIENAGA", "nombre": "La ciénaga"}, {"id": "NEERLANDIA", "nombre": "Hacienda Neerlandia"}, {"id": "RIOHACHA", "nombre": "Riohacha"}, {"id": "MANAURE", "nombre": "Manaure"}, {"id": "PARIS", "nombre": "París"}, {"id": "BRUSELAS", "nombre": "Bruselas"}, {"id": "COMEDOR", "nombre": "Comedor de la casa Buendía"}, {"id": "COCINA", "nombre": "Cocina de la casa Buendía"}, {"id": "DORMITORIO_PRINCIPAL", "nombre": "Dormitorio principal (JAB y Úrsula)"}, {"id": "GRANERO", "nombre": "Granero de la casa Buendía"}, {"id": "SALA_VISITA", "nombre": "Sala de visitas"}, {"id": "SALA_ESTAR", "nombre": "Sala de estar"}, {"id": "CORREDOR_BEGONIAS", "nombre": "Corredor de las begonias"}, {"id": "BANO_CASA", "nombre": "Baño de la casa Buendía"}, {"id": "ALCOBA_REMEDIOS_MOSCOTE", "nombre": "Alcoba de Remedios Moscote"}, {"id": "CARPA_GITANOS", "nombre": "Carpa de los gitanos"}, {"id": "PLAZA_MACONDO", "nombre": "Plaza de Macondo"}, {"id": "CALLE_TURCOS", "nombre": "Calle de los Turcos"}, {"id": "DESPACHO_CORREGIDOR", "nombre": "Despacho del corregidor"}, {"id": "CASA_CURAL", "nombre": "Casa cural"}, {"id": "TEATRO_MACONDO", "nombre": "Teatro de Macondo"}, {"id": "OFICINA_TELEGRAFICA", "nombre": "Oficina telegráfica"}, {"id": "CASA_PETRA_COTES", "nombre": "Casa de Petra Cotes"}, {"id": "GALLERA_MACONDO", "nombre": "Gallera de Macondo"}, {"id": "FABRICA_HIELO", "nombre": "Fábrica de hielo"}, {"id": "CALLE_ANTILLANOS", "nombre": "Calle de los antillanos"}, {"id": "LIBRERIA_CATALAN", "nombre": "Librería del sabio catalán"}, {"id": "BARRIO_TOLERANCIA", "nombre": "Barrio de tolerancia"}, {"id": "CASA_NIGROMANTA", "nombre": "Casa de Nigromanta"}, {"id": "GALLINERO_ELECTRIFICADO", "nombre": "Gallinero electrificado (recinto gringo)"}, {"id": "TALLER_MECANICA", "nombre": "Taller mecánico de la compañía"}, {"id": "CIUDAD_FERNANDA", "nombre": "Ciudad de Fernanda del Carpio"}, {"id": "CONVENTO_CLAUSURA", "nombre": "Convento de clausura"}, {"id": "SELVA", "nombre": "La selva"}, {"id": "LA_SIERRA", "nombre": "La sierra"}, {"id": "GALEON_SELVA", "nombre": "Galeón español en la selva"}, {"id": "RANCHERIA_ANCESTRAL", "nombre": "Ranchería ancestral de los Buendía"}, {"id": "CAPITAL_PROVINCIA", "nombre": "Capital de la provincia"}, {"id": "CURAZAO", "nombre": "Curaçao"}, {"id": "CABO_DE_LA_VELA", "nombre": "Cabo de la Vela"}, {"id": "LA_GUAJIRA", "nombre": "La Guajira"}, {"id": "SANTIAGO_DE_CUBA", "nombre": "Santiago de Cuba"}, {"id": "CRACOVIA", "nombre": "Cracovia"}, {"id": "ROMA", "nombre": "Roma"}, {"id": "ESTACION_CIENAGA", "nombre": "Estación de La Ciénaga"}, {"id": "CAMPO_ATERRIZAJE", "nombre": "Campo de aterrizaje de Gastón"}, {"id": "TANGANYIKA", "nombre": "Tanganyika"}, {"id": "LEOPOLDVILLE", "nombre": "Leopoldville"}, {"id": "SINGAPUR", "nombre": "Singapur"}, {"id": "BARCELONA", "nombre": "Barcelona"}];
var lugarById = {};
RAW_LUGARES_CRONO.forEach(function(l){ lugarById[l.id] = l; });

var TIPO_COLOR = {
  muerte:'#c0695a', conflicto:'#b07040', guerra:'#8b4040',
  llegada:'#5a8a6a', partida:'#6a7a5a', nacimiento:'#7a9ab0',
  descubrimiento:'#8070a0', acuerdo:'#6a8070', vision:'#9070a0',
  boda:'#a08070', desastre:'#909070', invencion:'#70909a',
  milagro:'#9090a0', separacion:'#807060', otro:'var(--ink-faint)'
};
var TIPO_LABEL = {
  muerte:'Muerte', conflicto:'Conflicto', guerra:'Guerra',
  llegada:'Llegada', partida:'Partida', nacimiento:'Nacimiento',
  descubrimiento:'Descubrimiento', acuerdo:'Acuerdo', vision:'Visión',
  boda:'Boda', desastre:'Desastre', invencion:'Invención',
  milagro:'Milagro', separacion:'Separación', otro:'Otro'
};

var tipoFilter = new Set();
var allTipos = Object.keys(TIPO_LABEL).filter(function(t){
  return RAW_EVENTOS.some(function(e){ return e.tipo === t; });
});

var chipsEl = document.getElementById('tipo-chips');
allTipos.forEach(function(t){
  var btn = document.createElement('button');
  btn.className = 'chip';
  btn.innerHTML = '<span class="tipo-dot" style="background:' + TIPO_COLOR[t] + '"></span>' + (TIPO_LABEL[t] || t);
  btn.addEventListener('click', function(){
    if(tipoFilter.has(t)) tipoFilter.delete(t); else tipoFilter.add(t);
    btn.classList.toggle('is-active', tipoFilter.has(t));
    render();
  });
  chipsEl.appendChild(btn);
});

var viewMode = 'capitulo'; // 'capitulo' | 'cronologico'

function makeLugarLink(lugarId) {
  if (!lugarId) return '';
  var l = lugarById[lugarId];
  if (!l) return '';
  return '<a class="lugar-link" href="lugares.html?lugar=' + lugarId + '">' + l.nombre + '</a>';
}
function makeWhoList(participantes){
  if(!participantes || !participantes.length) return '';
  var html = '<div class="who-list">';
  participantes.slice(0,5).forEach(function(pid){
    var p = byId[pid];
    var nombre = p ? p.nombre : pid.replace(/_/g,' ');
    html += '<a class="who-chip" href="personajes.html?personaje=' + pid + '">' + nombre + '</a>';
  });
  if(participantes.length > 5) html += '<span class="who-chip">+' + (participantes.length-5) + '</span>';
  html += '</div>';
  return html;
}

function renderCapitulo(){
  var tl = document.getElementById('timeline');
  tl.innerHTML = '';

  // Group by capitulo
  var groups = {};
  RAW_EVENTOS.forEach(function(e){
    var cap = e.capitulo || 0;
    if(!groups[cap]) groups[cap] = [];
    groups[cap].push(e);
  });

  var caps = Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
  caps.forEach(function(cap){
    var list = groups[cap].slice().sort(function(a,b){
      return (a.orden_cronologico||9999) - (b.orden_cronologico||9999);
    });
    if(!list.length) return;

    var meta = CHAPTER_META[cap] || {t:'Capítulo '+cap, s:''};
    var section = document.createElement('div');
    section.className = 'ch-section';

    var head = document.createElement('div');
    head.className = 'ch-section-head';
    head.innerHTML =
      '<div class="roman">' + toRoman(cap) + '</div><span class="ch-chevron">▾</span>';
    head.addEventListener('click', function(){ section.classList.toggle('is-collapsed'); });
    section.appendChild(head);

    var body = document.createElement('div');
    body.className = 'ch-section-body';
    list.forEach(function(e){
      var row = document.createElement('div');
      row.className = 'event-row';
      row.dataset.eventoId = e.id;
      row.innerHTML =
        '<div class="marker">' +
          '<span class="cap-num">Cap. ' + toRoman(e.capitulo) + '</span>' +
          (e.orden_cronologico ? '<span class="oc">#' + e.orden_cronologico + '</span>' : '') +
        '</div>' +
        '<div>' +
          '<div class="title">' + e.titulo + '</div>' +
          '<div class="summary">' + e.descripcion + '</div>' +
          makeWhoList(e.participantes) +
          makeLugarLink(e.lugar) +
        '</div>';
      if(tipoFilter.size > 0 && !tipoFilter.has(e.tipo)) return;
      body.appendChild(row);
    });
    section.appendChild(body);
    tl.appendChild(section);
  });
}

function renderCronologico(){
  var tl = document.getElementById('timeline');
  tl.innerHTML = '';

  var list = RAW_EVENTOS.slice();
  list.sort(function(a,b){
    var oa = a.orden_cronologico || 99999;
    var ob = b.orden_cronologico || 99999;
    return oa - ob;
  });

  // Group by chapter blocks (each cap is a block in chronological view)
  var lastCap = null;
  var block = null;

  list.forEach(function(e){
    var cap = e.capitulo || 0;
    if(cap !== lastCap){
      if(block) tl.appendChild(block);
      block = document.createElement('div');
      block.className = 'crono-block';
      var meta = CHAPTER_META[cap] || {t:'Cap.'+cap, s:''};
      var lbl = document.createElement('div');
      lbl.className = 'block-label';
      lbl.innerHTML = '<span class="bl-oc">' + toRoman(cap) + '</span><span>' + meta.t + '</span>';
      block.appendChild(lbl);
      lastCap = cap;
    }

    var row = document.createElement('div');
    row.className = 'crono-ev';
    row.dataset.eventoId = e.id;
    row.innerHTML =
      '<div class="oc-tag">' +
        (e.orden_cronologico ? '<span>#' + e.orden_cronologico + '</span>' : '') +
        '<span class="cap">Cap. ' + toRoman(e.capitulo) + '</span>' +
      '</div>' +
      '<div>' +
        '<div class="title">' + e.titulo + '</div>' +
        '<div class="summary">' + e.descripcion + '</div>' +
        makeWhoList(e.participantes) +
        makeLugarLink(e.lugar) +
      '</div>';
    if(tipoFilter.size > 0 && !tipoFilter.has(e.tipo)) return;
    block.appendChild(row);
  });
  if(block) tl.appendChild(block);
}

var ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
function toRoman(n){ return ROMAN[n] || String(n); }

function render(){
  if(viewMode === 'capitulo') renderCapitulo();
  else renderCronologico();
}

document.getElementById('btn-capitulo').addEventListener('click', function(){
  viewMode = 'capitulo';
  document.getElementById('btn-capitulo').classList.add('is-active');
  document.getElementById('btn-cronologico').classList.remove('is-active');
  render();
});
document.getElementById('btn-cronologico').addEventListener('click', function(){
  viewMode = 'cronologico';
  document.getElementById('btn-cronologico').classList.add('is-active');
  document.getElementById('btn-capitulo').classList.remove('is-active');
  render();
});

render();

// URL param: ?evento=EVT_ID → highlight and scroll to that event row
(function(){
  try{
    var params = new URLSearchParams(location.search);
    var targetId = params.get('evento');
    if(!targetId) return;
    var el = document.querySelector('[data-evento-id="' + targetId + '"]');
    if(!el) return;
    el.classList.add('is-highlight');
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }catch(e){}
})();

})();
</script>
