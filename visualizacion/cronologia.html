<style>
  .crono-head{
    padding: 56px 56px 40px;
    display:grid; grid-template-columns: 1.4fr 1fr; gap: 64px; align-items:end;
    max-width: 1440px; margin-left: auto; margin-right: auto;
  }
  .mode-switch{
    display:flex; padding: 2px;
    border: 1px solid var(--rule); border-radius: var(--shape-radius);
    font-family: var(--font-label); font-size: 11px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
  }
  .mode-switch button{
    background: transparent; border: none; cursor: pointer;
    padding: 8px 18px; color: var(--ink-soft); border-radius: var(--shape-radius);
    transition: all .15s;
  }
  .mode-switch button.is-active{background: var(--accent); color: var(--bg)}

  .tipo-toolbar{
    padding: 10px max(56px, calc((100vw - 1440px) / 2 + 56px));
    border-top: var(--border-double); border-bottom: var(--border-double);
    display:flex; gap: 6px; flex-wrap:wrap; align-items:center;
  }
  .tipo-toolbar .chip{ font-size: 10px; padding: 4px 10px; }
  .timeline{
    padding: 48px 56px 80px;
    max-width: 900px; margin: 0 auto;
  }

  /* Chapter section */
  .ch-section{margin-bottom: 48px}
  .ch-section-head{
    display:flex; align-items:baseline; gap: 0;
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: var(--border-double);
    cursor: pointer; transition: opacity .15s;
  }
  .ch-section-head:hover{opacity: 0.8}
  .ch-section.is-collapsed .ch-section-body{display:none}
  .ch-section-head .roman{
    font-family: var(--font-display); font-style:italic; font-size: 28px;
    color: var(--accent); line-height:1;
  }
  html[data-mode="light"] .ch-section-head .roman{font-style:normal; font-weight:500}
  .ch-chevron{
    font-size: 11px; color: var(--ink-faint); opacity: 0.5;
    margin-left: 8px; align-self: center;
    transition: transform .2s ease;
    display: inline-block;
  }
  .ch-section.is-collapsed .ch-chevron{ transform: rotate(-90deg); }

  /* Event row (chapter view) */
  .event-row{
    display:grid; grid-template-columns: 80px 1fr; gap: 20px;
    padding: 14px 0; border-bottom: 1px dotted var(--ink-faint);
  }
  .event-row.is-pending{opacity: 0.45}
  .event-row .marker{
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    padding-top:2px;
  }
  .event-row .marker .cap-num{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent);
  }
  .event-row .marker .oc{
    font-family: var(--font-label); font-size:9px;
    color: var(--ink-faint);
  }
  .event-row .title{
    font-family: var(--font-display); font-size:17px; color:var(--ink);
    font-style:italic; margin-bottom:5px; line-height:1.2;
  }
  html[data-mode="light"] .event-row .title{font-style:normal; font-weight:500}
  .event-row .summary{
    font-size:14px; line-height:1.6; color:var(--ink-soft); margin-bottom:8px;
  }
  .who-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
  .who-chip{
    font-family: var(--font-label); font-size:9px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); padding: 2px 7px;
    border: 1px solid var(--ink-faint); border-radius: var(--shape-radius);
    text-decoration: none; display: inline-block;
  }
  a.who-chip:hover{ color: var(--accent); border-color: var(--accent); }

  /* Chronological view */
  .crono-block{margin-bottom: 40px}
  .crono-block .block-label{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--rule);
    display:flex; align-items:baseline; gap:14px;
  }
  .crono-block .block-label .bl-oc{color: var(--accent); font-size:12px}
  .crono-ev{
    display:grid; grid-template-columns: 100px 1fr; gap:20px;
    padding: 12px 0; border-bottom: 1px dotted var(--ink-faint);
  }
  .crono-ev.is-pending{opacity: 0.45}
  .crono-ev .oc-tag{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); padding-top:3px;
    display:flex; flex-direction:column; gap:3px;
  }
  .crono-ev .oc-tag .cap{color: var(--accent-soft)}
  .crono-ev .title{
    font-family: var(--font-display); font-size:17px; color:var(--ink);
    font-style:italic; margin-bottom:4px;
  }
  html[data-mode="light"] .crono-ev .title{font-style:normal; font-weight:500}
  .crono-ev .summary{font-size:14px; line-height:1.6; color:var(--ink-soft); margin-bottom:6px}

  /* Legend */
  .legend-bar{
    padding: 20px 56px; border-top: var(--border-double);
    display:flex; gap:24px; align-items:center;
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
  }
  .legend-bar .item{display:flex; align-items:center; gap:8px; color: var(--ink-soft)}
  .legend-bar .dot{
    width:8px; height:8px; border-radius:50%; background: var(--accent); flex:0 0 auto;
  }
  .legend-bar .dot.pending{background:transparent; border:1px solid var(--ink-faint)}
  .event-row.is-highlight, .crono-ev.is-highlight{
    background: var(--accent-bg);
    outline: 1px solid var(--accent-soft);
    border-radius: 2px;
  }
  .lugar-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: var(--label-letter);
    text-transform: var(--label-transform);
    color: var(--ink-faint);
    text-decoration: none;
    transition: color .12s;
  }
  .lugar-link:hover { color: var(--accent); }
  .lugar-link::before { content: '◈'; margin-right: 3px; }

  /* Tipo filter */
  .tipo-dot{
    display:inline-block; width:7px; height:7px;
    border-radius: var(--shape-radius);
    transform: rotate(var(--shape-square-rotate));
    flex-shrink:0; vertical-align:middle; margin-right:4px;
  }

  @media (max-width: 768px) {
    .crono-head {
      grid-template-columns: 1fr;
      padding: 24px 20px 20px;
      gap: 24px;
    }
    .tipo-toolbar {
      padding: 10px 20px;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tipo-toolbar::-webkit-scrollbar { display: none }
    .timeline {
      padding: 32px 20px 60px;
    }
    .event-row {
      grid-template-columns: 52px 1fr;
      gap: 12px;
    }
    .crono-ev {
      grid-template-columns: 60px 1fr;
      gap: 12px;
    }
  }
</style>
</head>

<script>
const RAW_EVENTOS = [{"id": "EVT_MATANZA_AGUILAR", "titulo": "José Arcadio Buendía mata a Prudencio Aguilar", "tipo": "conflicto", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "PRUDENCIO_AGUILAR"], "descripcion": "José Arcadio Buendía gana una pelea de gallos a Prudencio Aguilar, quien insulta públicamente su virilidad (Úrsula aún no consumaba el matrimonio). José Arcadio Buendía regresa con la lanza de su abuelo y se la clava en la garganta. Esa noche entra al cuarto y obliga a Úrsula a quitarse el pantalón de castidad.", "orden_cronologico": 20, "lugar": "RIOHACHA"}, {"id": "EVT_FUNDACION_MACONDO", "titulo": "Fundación de Macondo", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "Al cabo de la travesía, la expedición acampa junto a un río pedregoso de aguas frías. Esa noche José Arcadio Buendía sueña que se levanta una ciudad ruidosa con casas de paredes de espejo cuyo nombre, Macondo, tiene resonancia sobrenatural. Al día siguiente convence a los suyos de que nunca encontrarán el mar y funda la aldea talando árboles junto a la orilla.", "orden_cronologico": 50, "lugar": "MACONDO"}, {"id": "EVT_PRIMERA_VISITA_GITANOS", "titulo": "Primera visita de los gitanos: el imán de Melquíades", "tipo": "llegada", "capitulo": 1, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Melquíades y su banda de gitanos llegan a Macondo exhibiendo un imán. José Arcadio Buendía, fascinado, los sigue arrastrando ollas, cazuelas y tenazas. Intercambia sus mulas y una partida de chivos por dos lingotes imantados, convencido de que con ellos podrá sacar oro del subsuelo.", "orden_cronologico": 100, "lugar": "CARPA_GITANOS"}, {"id": "EVT_SEGUNDA_VISITA_GITANOS", "titulo": "Segunda visita de los gitanos: catalejo y lupa gigante", "tipo": "llegada", "capitulo": 1, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Melquíades regresa con un catalejo y una lupa del tamaño de un tambor. Declara que 'la ciencia ha eliminado las distancias'. José Arcadio Buendía intercambia los imanes y tres monedas coloniales por la lupa, fascinado por sus posibilidades militares.", "orden_cronologico": 101, "lugar": "CARPA_GITANOS"}, {"id": "EVT_JAB_GUERRA_SOLAR", "titulo": "José Arcadio Buendía experimenta con la lupa como arma solar", "tipo": "otro", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "José Arcadio Buendía usa la lupa para concentrar los rayos del sol y prende fuego a una pila de material. Se quema. Redacta un manual sobre la 'guerra solar' y lo envía a las autoridades militares sin obtener respuesta.", "orden_cronologico": 102, "lugar": "MACONDO"}, {"id": "EVT_JAB_TIERRA_REDONDA", "titulo": "José Arcadio Buendía proclama que la tierra es redonda", "tipo": "descubrimiento", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN", "MELQUIADES"], "descripcion": "Usando el catalejo y un astrolabio, José Arcadio Buendía concluye que la tierra es redonda como una naranja. Úrsula, convencida de que ha enloquecido, destroza el astrolabio. Melquíades, de regreso, lo avala públicamente y le regala un globo terráqueo.", "orden_cronologico": 103, "lugar": "MACONDO"}, {"id": "EVT_REGALO_LABORATORIO_ALQUIMIA", "titulo": "Melquíades regala el laboratorio de alquimia", "tipo": "otro", "capitulo": 1, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Como muestra de amistad y admiración por el espíritu científico de José Arcadio Buendía, Melquíades le regala un completo laboratorio de alquimia. Allí pasará largas horas José Arcadio intentando transmutar metales.", "orden_cronologico": 104, "lugar": "LABORATORIO_ALQUIMIA"}, {"id": "EVT_JAB_FUNDE_MONEDAS", "titulo": "José Arcadio Buendía funde los doblones de oro de Úrsula", "tipo": "otro", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "En su empeño alquímico, José Arcadio Buendía funde los treinta doblones de oro que Úrsula había heredado y guardado toda la vida. El resultado es un chicharrón carbonizado que no pudo desprenderse del fondo del caldero.", "orden_cronologico": 105, "lugar": "LABORATORIO_ALQUIMIA"}, {"id": "EVT_GITANOS_DENTADURA_POSTIZA", "titulo": "Melquíades regresa rejuvenecido con dentadura postiza", "tipo": "llegada", "capitulo": 1, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Melquíades regresa a Macondo con una dentadura postiza que lleva en el bolsillo y solo se pone para hablar. Presenta la dentadura como el último invento de los sabios de Memphis. José Arcadio Buendía, encantado, pierde interés en la alquimia.", "orden_cronologico": 106, "lugar": "MACONDO"}, {"id": "EVT_TOQUE_HIELO", "titulo": "El coronel Aureliano Buendía toca el hielo por primera vez", "tipo": "descubrimiento", "capitulo": 1, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "JOSE_ARCADIO_HIJO"], "descripcion": "José Arcadio Buendía lleva a sus hijos a la carpa de los gitanos donde hay un bloque de hielo. José Arcadio (hijo) se niega a tocarlo. El coronel Aureliano Buendía Aureliano coloca la mano y la retira en el acto creyendo que está ardiendo. Este momento abre la primera frase de la novela.", "orden_cronologico": 107, "lugar": "CARPA_GITANOS"}, {"id": "EVT_EXPEDICION_NORTE", "titulo": "Expedición de José Arcadio Buendía hacia el norte", "tipo": "otro", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "José Arcadio Buendía organiza una expedición hacia el norte con herramientas, brújula y mapas, buscando una ruta que una Macondo con los grandes inventos del mundo. La expedición dura varios meses.", "orden_cronologico": 108, "lugar": "MACONDO"}, {"id": "EVT_GALEON_SELVA", "titulo": "La expedición descubre un galeón español en la selva", "tipo": "descubrimiento", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Durante la expedición al norte, el grupo encuentra en medio de la selva un galeón español varado sobre tierra firme, cubierto de flores silvestres y con su mástil intacto. El hallazgo revela que en ese lugar alguna vez hubo mar.", "orden_cronologico": 109, "lugar": "GALEON_SELVA"}, {"id": "EVT_JAB_ENCUENTRA_MAR", "titulo": "La expedición llega al mar por el norte", "tipo": "descubrimiento", "capitulo": 1, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Continuando la expedición, José Arcadio Buendía llega a un mar de aguas grises 'color de ceniza' batidas por olas ruidosas. Grita que Macondo está rodeada de agua. Acampa dos noches en la orilla y regresa convencido de que el pueblo nunca tendrá salida al mar.", "orden_cronologico": 110, "lugar": null}, {"id": "EVT_PRIMERA_MUERTE_MELQUIADES", "titulo": "Primera muerte de Melquíades (en Singapur)", "tipo": "muerte", "capitulo": 1, "participantes": ["MELQUIADES"], "descripcion": "Un gitano armenio informa a José Arcadio Buendía de que Melquíades ha muerto de fiebres en los pantanos de Singapur. Esta es su primera muerte; en el capítulo 2 regresa porque no pudo soportar la soledad.", "orden_cronologico": 111, "lugar": "SINGAPUR"}, {"id": "EVT_GITANOS_NUEVOS", "titulo": "Los gitanos regresan con la estera voladora", "tipo": "llegada", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "JOSE_ARCADIO_HIJO", "PILAR_TERNERA"], "descripcion": "Los mismos saltimbanquis y malabaristas que llevaron el hielo regresan cuando Amaranta cumple sus cuarenta días de nacida. Esta vez traen una estera voladora y otros juegos de artificio; los vecinos desentierran sus últimos pedacitos de oro para volar sobre las casas. José Arcadio (hijo) y Pilar Ternera viven horas de desahogo entre la muchedumbre, comportándose como dos novios dichosos.", "orden_cronologico": 202, "lugar": "CARPA_GITANOS"}, {"id": "EVT_RELACION_PILAR_JOSE_ARCADIO", "titulo": "Relación entre José Arcadio y Pilar Ternera", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_HIJO", "PILAR_TERNERA"], "descripcion": "Pilar Ternera, mujer alegre y deslenguada que adivina el porvenir con las barajas y llegó a Macondo con el éxodo fundacional, despierta una obsesión en José Arcadio (hijo) por su olor a humo. Él la visita de noche entrando por la puerta que ella deja entornada. Aureliano (hermano) se entera y vive el amor vicariamente a través de sus relatos.", "orden_cronologico": 203, "lugar": "CASA_PILAR"}, {"id": "EVT_PARTIDA_JOSE_ARCADIO_GITANOS", "titulo": "José Arcadio se marcha con los gitanos", "tipo": "partida", "capitulo": 2, "participantes": ["JOSE_ARCADIO_HIJO"], "descripcion": "El sábado siguiente a su noche con la joven gitana, José Arcadio (hijo) se amarra un trapo rojo en la cabeza y se va con la farándula sin avisar a nadie. Úrsula lo descubre ausente y sale a buscarlo; preguntando el camino se aleja tanto de la aldea que ya no piensa en regresar.", "orden_cronologico": 204, "lugar": "MACONDO"}, {"id": "EVT_MATRIMONIO_JAB_URSULA", "titulo": "Boda de José Arcadio Buendía y Úrsula Iguarán", "tipo": "boda", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "José Arcadio Buendía y Úrsula, primos criados juntos, se casan a pesar de la oposición familiar por miedo a engendrar hijos con cola de cerdo (ya había un precedente en la familia). La boda se celebra con fiesta de banda y cohetes durante tres días. Úrsula, aterrorizada por los pronósticos de su madre, lleva un pantalón de lona con hebilla de hierro para impedir la consumación; así pasan varios meses.", "orden_cronologico": 10, "lugar": "RIOHACHA"}, {"id": "EVT_FANTASMA_PRUDENCIO", "titulo": "El fantasma de Prudencio Aguilar acosa a los Buendía", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN", "PRUDENCIO_AGUILAR"], "descripcion": "El fantasma de Prudencio Aguilar aparece repetidamente: junto a la tinaja intentando taponarse el cuello con esparto, en el baño lavándose la sangre, paseando bajo la lluvia. José Arcadio Buendía le grita que lo matará cada vez que regrese; el muerto no se va. Conmovido por su soledad, José Arcadio Buendía le promete marcharse del pueblo para siempre y le pide que descanse.", "orden_cronologico": 30, "lugar": "RIOHACHA"}, {"id": "EVT_TRAVESIA_SIERRA", "titulo": "Travesía de la sierra: el éxodo fundacional", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "José Arcadio Buendía lidera un grupo de familias jóvenes en una travesía de más de dos años a través de la sierra, huyendo del fantasma de Prudencio Aguilar y buscando el mar. Viajan en sentido contrario a Riohacha para no dejar rastro. Úrsula hace parte del camino en hamaca por las varices. Al cabo nunca encuentran el mar.", "orden_cronologico": 40, "lugar": "LA_SIERRA"}, {"id": "EVT_NACIMIENTO_JOSE_ARCADIO_HIJO", "titulo": "Nacimiento de José Arcadio (hijo) durante la travesía", "tipo": "nacimiento", "capitulo": 2, "participantes": ["JOSE_ARCADIO_HIJO", "URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Con el estómago estragado por la carne de mico y el caldo de culebra, Úrsula da a luz un hijo con todas sus partes humanas. Nace durante la travesía, antes de que la expedición llegue al lugar donde fundará Macondo.", "orden_cronologico": 45, "lugar": "LA_SIERRA"}, {"id": "EVT_NACIMIENTO_AMARANTA", "titulo": "Nacimiento de Amaranta", "tipo": "nacimiento", "capitulo": 2, "participantes": ["AMARANTA_BUENDIA", "URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Úrsula da a luz a Amaranta un jueves de enero a las dos de la madrugada. Es liviana y acuosa como una lagartija, pero con todas sus partes humanas. Aureliano, que rondaba la casa de Pilar Ternera, no se entera hasta que la casa se llena de gente.", "orden_cronologico": 80, "lugar": "CASA_BUENDIA"}, {"id": "EVT_JOSE_ARCADIO_GITANA", "titulo": "José Arcadio (hijo) pasa la noche con la joven gitana", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_HIJO"], "descripcion": "En la feria de la estera voladora, José Arcadio (hijo) ve a la mujer más bella de su vida: una gitana muy joven, agobiada de abalorios. Se aprieta contra ella entre la multitud hasta que ella cede. Van a la carpa gitana, donde ella se desprende de sus corpiños superpuestos. Otras personas de la farándula comparten el espacio sin rubor. José Arcadio se marcha el sábado con un trapo rojo en la cabeza.", "orden_cronologico": 210, "lugar": "CARPA_GITANOS"}, {"id": "EVT_EMBARAZO_PILAR_JOSE_ARCADIO", "titulo": "Pilar Ternera anuncia su embarazo a José Arcadio", "tipo": "otro", "capitulo": 2, "participantes": ["JOSE_ARCADIO_HIJO", "PILAR_TERNERA"], "descripcion": "Durante la feria de la estera voladora, Pilar Ternera aprovecha el entusiasmo de José Arcadio para decirle: 'Ahora sí eres un hombre. Vas a tener un hijo.' La noticia lo encierra en casa durante días y agrava su angustia hasta que decide irse con los gitanos.", "orden_cronologico": 211, "lugar": "CASA_PILAR"}, {"id": "EVT_BUSQUEDA_URSULA", "titulo": "Úrsula sale a buscar a su hijo y desaparece", "tipo": "partida", "capitulo": 2, "participantes": ["URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Al descubrir que José Arcadio (hijo) se ha ido con los gitanos, Úrsula sale a buscarlo siguiendo el camino que le van indicando. Se aleja tanto que ya no piensa en regresar. José Arcadio Buendía forma un grupo para buscarla; pescadores indígenas señalan por señas que no la han visto pasar. Vuelven a la aldea tres días después sin haberla encontrado.", "orden_cronologico": 212, "lugar": "MACONDO"}, {"id": "EVT_REGRESO_URSULA", "titulo": "Regreso de Úrsula con la ruta de la ciénaga", "tipo": "llegada", "capitulo": 2, "participantes": ["URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Úrsula regresa exaltada y rejuvenecida, con ropas de un estilo desconocido en la aldea, acompañada de hombres y mujeres de piel parda que hablan su misma lengua. Viene del otro lado de la ciénaga, a solo dos días de camino, donde hay pueblos con correo mensual y máquinas del bienestar. Ha descubierto la ruta que su marido no encontró: Macondo queda conectada con el mundo.", "orden_cronologico": 213, "lugar": "MACONDO"}, {"id": "EVT_LLEGADA_REBECA", "titulo": "Llegada de Rebeca a la casa Buendía", "tipo": "llegada", "capitulo": 3, "participantes": ["REBECA", "URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Una huérfana de once años llamada Rebeca llega con una carta para José Arcadio Buendía y una cesta con los huesos de sus padres. Los Buendía la adoptan. Trae consigo la plaga del insomnio.", "orden_cronologico": 300, "lugar": "CASA_BUENDIA"}, {"id": "EVT_PLAGA_INSOMNIO", "titulo": "La plaga del insomnio se extiende por Macondo", "tipo": "desastre", "capitulo": 3, "participantes": ["REBECA", "VISITACION", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN"], "descripcion": "La plaga del insomnio contraída por Rebeca se extiende a toda la familia y al pueblo a través de los dulces de Úrsula. Provoca pérdida progresiva de la memoria. Aureliano etiqueta los objetos para no olvidar sus nombres.", "orden_cronologico": 301, "lugar": "MACONDO"}, {"id": "EVT_REGRESO_MELQUIADES", "titulo": "Melquíades regresa de la muerte", "tipo": "llegada", "capitulo": 3, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "Melquíades regresa de entre los muertos porque no pudo soportar la soledad. Trae el remedio para la plaga del insomnio y la tecnología para producir daguerrotipos. Escribe sus pergaminos proféticos en sánscrito.", "orden_cronologico": 302, "lugar": "MACONDO"}, {"id": "EVT_LLEGADA_APOLINAR_MOSCOTE", "titulo": "Llegada de Don Apolinar Moscote como magistrado", "tipo": "llegada", "capitulo": 3, "participantes": ["APOLINAR_MOSCOTE"], "descripcion": "El gobierno envía a Don Apolinar Moscote como corregidor con una orden de pintar las casas de azul. José Arcadio Buendía lo expulsa pero regresa con soldados y su familia, entre ellos su hija Remedios de nueve años.", "orden_cronologico": 303, "lugar": "MACONDO"}, {"id": "EVT_LLEGADA_PIETRO_CRESPI", "titulo": "Llegada de Pietro Crespi", "tipo": "llegada", "capitulo": 4, "participantes": ["PIETRO_CRESPI", "REBECA", "AMARANTA_BUENDIA"], "descripcion": "El músico y técnico italiano Pietro Crespi llega para instalar y enseñar a tocar la pianola que Úrsula encargó para la inauguración de la reforma de la casa. Rebeca y Amaranta se enamoran de él.", "orden_cronologico": 400, "lugar": "CASA_BUENDIA"}, {"id": "EVT_RELACION_PILAR_CORONEL", "titulo": "Relación entre el coronel Aureliano Buendía Aureliano y Pilar Ternera", "tipo": "otro", "capitulo": 4, "participantes": ["AURELIANO_BUENDIA_CORONEL", "PILAR_TERNERA"], "descripcion": "Pilar Ternera se ofrece como intermediaria entre Aureliano y Remedios Moscote. En un episodio nocturno tienen relaciones sexuales. Ella queda embarazada de Aureliano José.", "orden_cronologico": 401, "lugar": "CASA_PILAR"}, {"id": "EVT_MATRIMONIO_AURELIANO_REMEDIOS", "titulo": "Boda del coronel Aureliano Buendía Aureliano y Remedios Moscote", "tipo": "boda", "capitulo": 5, "participantes": ["AURELIANO_BUENDIA_CORONEL", "REMEDIOS_MOSCOTE", "PADRE_NICANOR"], "descripcion": "Tras la primera menstruación de Remedios, el padre Nicanor oficia la boda en el salón de la casa. Remedios lleva el primer trozo de pastel a José Arcadio Buendía atado al castaño.", "orden_cronologico": 500, "lugar": "CASA_BUENDIA"}, {"id": "EVT_LLEGADA_PADRE_NICANOR", "titulo": "Llegada del padre Nicanor Reyna", "tipo": "llegada", "capitulo": 5, "participantes": ["PADRE_NICANOR"], "descripcion": "El sacerdote llega horrorizado de que el pueblo viva sin religión. Decide quedarse a hacer la obra de Dios y construir una iglesia. Intenta sin éxito probar la existencia de Dios ante José Arcadio Buendía.", "orden_cronologico": 501, "lugar": "MACONDO"}, {"id": "EVT_LEVITACION_PADRE_NICANOR", "titulo": "El padre Nicanor levita sobre el suelo", "tipo": "milagro", "capitulo": 5, "participantes": ["PADRE_NICANOR"], "descripcion": "El padre Nicanor bebe una taza de chocolate y se eleva doce centímetros sobre el suelo durante varios días, recaudando así el dinero necesario para construir la iglesia.", "orden_cronologico": 502, "lugar": "EL_CASTANO"}, {"id": "EVT_LOCURA_JOSE_ARCADIO_BUENDIA", "titulo": "Locura y atadura de José Arcadio Buendía al castaño", "tipo": "otro", "capitulo": 4, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "José Arcadio Buendía sufre un arrebato violento tras perder la noción lineal del tiempo. Diez hombres lo atan al castaño del patio, donde permanecerá hasta su muerte hablando en latín y comunicándose con el fantasma de Prudencio Aguilar.", "orden_cronologico": 402, "lugar": "EL_CASTANO"}, {"id": "EVT_MUERTE_MELQUIADES", "titulo": "Muerte definitiva de Melquíades", "tipo": "muerte", "capitulo": 4, "participantes": ["MELQUIADES", "JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN", "ARCADIO"], "descripcion": "Melquíades sufre un rápido proceso de envejecimiento y se ahoga en el río mientras Arcadio lo llevaba a bañarse. José Arcadio Buendía se niega a enterrarlo convencido de su inmortalidad y quema mercurio 72 horas junto al cadáver. Cuando este empieza a descomponerse, lo entierran con honores en el centro del nuevo cementerio, con una lápida que reza solo \"MELQUÍADES\". Es el primer entierro y el más concurrido de Macondo.", "orden_cronologico": 403, "lugar": "EL_RIO"}, {"id": "EVT_SUICIDIO_PIETRO_CRESPI", "titulo": "Suicidio de Pietro Crespi", "tipo": "muerte", "capitulo": 6, "participantes": ["PIETRO_CRESPI", "AMARANTA_BUENDIA"], "descripcion": "Cansado de esperar a Amaranta, Pietro Crespi le vuela a proponer matrimonio y ella lo rechaza con crueldad. Su hermano Bruno lo encuentra muerto con las muñecas cortadas.", "orden_cronologico": 600, "lugar": "TALLER_CRESPI"}, {"id": "EVT_AMARANTA_QUEMA_MANO", "titulo": "Amaranta se quema la mano con brasas", "tipo": "otro", "capitulo": 6, "participantes": ["AMARANTA_BUENDIA"], "descripcion": "Tras el suicidio de Pietro Crespi, Amaranta pone la mano sobre las brasas del fogón hasta quemársela. Se cubre la mano con una venda negra que no se quitará nunca.", "orden_cronologico": 601, "lugar": "CASA_BUENDIA"}, {"id": "EVT_REGRESO_JOSE_ARCADIO_HIJO", "titulo": "Regreso de José Arcadio a Macondo", "tipo": "llegada", "capitulo": 5, "participantes": ["JOSE_ARCADIO_HIJO"], "descripcion": "Un hombre enorme cubierto de tatuajes llega a la casa. Solo Úrsula lo reconoce como su hijo José Arcadio, desaparecido con los gitanos. Ha dado la vuelta al mundo 65 veces. Más tarde se casará con Rebeca.", "orden_cronologico": 503, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MATRIMONIO_JOSE_ARCADIO_REBECA", "titulo": "Boda de José Arcadio (hijo) y Rebeca", "tipo": "boda", "capitulo": 5, "participantes": ["JOSE_ARCADIO_HIJO", "REBECA", "PADRE_NICANOR"], "descripcion": "Tras una relación furtiva, José Arcadio y Rebeca se casan, a pesar de que Úrsula no permite que los recién casados entren en la casa. El padre Nicanor aclara que no son hermanos biológicos.", "orden_cronologico": 504, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_REMEDIOS_MOSCOTE", "titulo": "Muerte de Remedios Moscote", "tipo": "muerte", "capitulo": 5, "participantes": ["REMEDIOS_MOSCOTE", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Remedios Moscote muere de madrugada a causa de una infección, posiblemente ligada a la pérdida de los gemelos que gestaba. Su ausencia devuelve al Coronel Aureliano a la soledad y la introspección de su infancia.", "orden_cronologico": 505, "lugar": "CASA_BUENDIA"}, {"id": "EVT_NACIMIENTO_ARCADIO", "titulo": "Nacimiento de Arcadio", "tipo": "nacimiento", "capitulo": 3, "participantes": ["ARCADIO", "PILAR_TERNERA", "JOSE_ARCADIO_HIJO"], "descripcion": "Hijo de José Arcadio (hijo) y Pilar Ternera. Llevado a la casa de los Buendía con dos semanas de vida. Se le llama Arcadio y nunca se le revela su verdadera identidad.", "orden_cronologico": 215, "lugar": "CASA_PILAR"}, {"id": "EVT_NACIMIENTO_AURELIANO_JOSE", "titulo": "Nacimiento de Aureliano José", "tipo": "nacimiento", "capitulo": 5, "participantes": ["AURELIANO_JOSE", "PILAR_TERNERA", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Hijo del coronel Aureliano Buendía Aureliano Buendía y Pilar Ternera. Adoptado por la primera esposa del coronel Aureliano Buendía, Remedios Moscote, quien lo acepta como propio.", "orden_cronologico": 506, "lugar": "CASA_PILAR"}, {"id": "EVT_SEDUCCION_JOSE_ARCADIO_REBECA", "titulo": "José Arcadio seduce a Rebeca", "tipo": "otro", "capitulo": 5, "participantes": ["JOSE_ARCADIO_HIJO", "REBECA"], "descripcion": "Obsesionada con la presencia de José Arcadio, Rebeca va a su cuarto durante la siesta y él la seduce en la hamaca. Tres días después se casan en la misa de cinco.", "orden_cronologico": 507, "lugar": "CASA_BUENDIA"}, {"id": "EVT_PEDIDA_MANO_AMARANTA_CRESPI", "titulo": "Pietro Crespi le pide matrimonio a Amaranta", "tipo": "otro", "capitulo": 5, "participantes": ["PIETRO_CRESPI", "AMARANTA_BUENDIA"], "descripcion": "Tras el fracaso definitivo del noviazgo con Rebeca, Pietro Crespi desarrolla afecto genuino por Amaranta y un martes le propone matrimonio. Amaranta acepta en principio pero impone un aplazamiento indefinido.", "orden_cronologico": 508, "lugar": "CASA_BUENDIA"}, {"id": "EVT_FRAUDE_ELECTORAL", "titulo": "Fraude en las elecciones conservadoras", "tipo": "conflicto", "capitulo": 5, "participantes": ["APOLINAR_MOSCOTE", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "El sargento del ejército sustituye papeletas rojas liberales por azules conservadoras ante la vista del corregidor Moscote, quien lo justifica como necesario para evitar reclamaciones. Aureliano presencia el fraude y declara que si fuera liberal iría a la guerra por eso.", "orden_cronologico": 509, "lugar": "MACONDO"}, {"id": "EVT_CONSPIRACION_NOGUERA", "titulo": "La conspiración del doctor Noguera", "tipo": "conflicto", "capitulo": 5, "participantes": ["DOCTOR_ALIRIO_NOGUERA", "AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ", "MAGNIFICO_VISBAL"], "descripcion": "El falso homeópata recluta a jóvenes de Macondo para asesinar individualmente a funcionarios conservadores y sus familias. Aureliano, horrorizado, lo rechaza y lo llama matarife. Noguera lo descarta como sentimental sin porvenir.", "orden_cronologico": 510, "lugar": "MACONDO"}, {"id": "EVT_OCUPACION_MILITAR_MACONDO", "titulo": "El ejército conservador ocupa Macondo", "tipo": "guerra", "capitulo": 5, "participantes": ["APOLINAR_MOSCOTE", "AURELIANO_BUENDIA_CORONEL", "DOCTOR_ALIRIO_NOGUERA"], "descripcion": "Un pelotón llega de madrugada con dos piezas de artillería y establece el cuartel en la escuela. Se impone el toque de queda a las seis de la tarde y una requisa drástica de armas. El padre Nicanor recibe un culatazo al intentar impresionar a los militares con su levitación.", "orden_cronologico": 511, "lugar": "MACONDO"}, {"id": "EVT_FUSILAMIENTO_NOGUERA", "titulo": "Fusilamiento del doctor Noguera", "tipo": "muerte", "capitulo": 5, "participantes": ["DOCTOR_ALIRIO_NOGUERA"], "descripcion": "Tras la ocupación militar conservadora, el ejército arresta al doctor Noguera, lo ata a un árbol de la plaza y lo fusila sin fórmula de juicio.", "orden_cronologico": 512, "lugar": "MACONDO"}, {"id": "EVT_PRIMERA_GUERRA_LIBERAL", "titulo": "El coronel Aureliano Buendía Aureliano lidera el primer levantamiento armado", "tipo": "guerra", "capitulo": 5, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ", "APOLINAR_MOSCOTE"], "descripcion": "Denunciando el fraude electoral conservador, el coronel Aureliano Buendía Aureliano Buendía sale con veintiún hombres para unirse al ejército liberal. Arcadio es nombrado líder civil y militar de Macondo.", "orden_cronologico": 513, "lugar": "MACONDO"}, {"id": "EVT_TIRANIA_ARCADIO", "titulo": "Tiranía de Arcadio en Macondo", "tipo": "conflicto", "capitulo": 6, "participantes": ["ARCADIO", "URSULA_IGUARAN", "APOLINAR_MOSCOTE"], "descripcion": "Arcadio gobierna Macondo como un déspota: impone cuatro decretos diarios, fusila a un trompetista, y está a punto de ejecutar a Don Apolinar Moscote. Úrsula lo detiene y lo humilla públicamente.", "orden_cronologico": 602, "lugar": "MACONDO"}, {"id": "EVT_FUSILAMIENTO_CORONEL_SALVADO", "titulo": "El coronel Aureliano Buendía ante el pelotón de fusilamiento; lo salva su hermano", "tipo": "guerra", "capitulo": 7, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_ARCADIO_HIJO", "GERINELDO_MARQUEZ", "ROQUE_CARNICERO"], "descripcion": "Conducido al paredón frente a la casa de Rebeca, los soldados sortean quién disparará. Roque Carnicero saca el as de espadas y se niega a hacerlo; sus seis hombres lo imitan. En ese momento José Arcadio cruza la calle con una escopeta y ordena que no disparen. El pelotón al completo, encabezado por Roque Carnicero, se une al bando rebelde.", "orden_cronologico": 700, "lugar": "PLAZA_MACONDO"}, {"id": "EVT_MUERTE_JOSE_ARCADIO_BUENDIA", "titulo": "Muerte de José Arcadio Buendía", "tipo": "muerte", "capitulo": 7, "participantes": ["JOSE_ARCADIO_BUENDIA_FUNDADOR", "URSULA_IGUARAN", "CATAURE"], "descripcion": "José Arcadio Buendía muere atado al castaño del patio, acompañado únicamente por Úrsula. Esa madrugada llueven flores amarillas sobre Macondo: pétalos tan densos que al amanecer el pueblo parece cubierto de nieve dorada. Cataure, el hermano indio de Visitación, regresa para despedirse del patriarca y le dice: «He venido al sepelio del rey.» Tras el entierro desaparece de nuevo para siempre. El espíritu de Prudencio Aguilar lo espera al otro lado.", "orden_cronologico": 701, "lugar": "EL_CASTANO"}, {"id": "EVT_MUERTE_JOSE_ARCADIO_HIJO", "titulo": "Asesinato misterioso de José Arcadio (hijo)", "tipo": "muerte", "capitulo": 7, "participantes": ["JOSE_ARCADIO_HIJO", "REBECA"], "descripcion": "José Arcadio es asesinado de un disparo en su dormitorio. No presenta herida visible pero emana un intenso olor a pólvora que persiste incluso después de su entierro. Un hilo de sangre sale bajo la puerta, cruza la calle y llega hasta la cocina de Úrsula para avisarla. Rebeca dice que estaba en el baño y no oyó nada.", "orden_cronologico": 702, "lugar": "CASA_REBECA"}, {"id": "EVT_MUERTE_AURELIANO_JOSE", "titulo": "Asesinato de Aureliano José en el teatro", "tipo": "muerte", "capitulo": 8, "participantes": ["AURELIANO_JOSE", "CAPITAN_AQUILES_RICARDO", "PILAR_TERNERA", "CARMELITA_MONTIEL"], "descripcion": "Pilar Ternera le advierte que no salga esa noche y le ofrece quedarse con Carmelita Montiel. Él no capta la súplica y va al teatro. En la entrada, el capitán Aquiles Ricardo intenta cachearlo; Aureliano José, desarmado, echa a correr. El capitán le dispara en la espalda. Muere desangrado a la medianoche. Carmelita Montiel, que lo esperaba con la cama preparada de romero, encuentra en blanco los naipes de su porvenir.", "orden_cronologico": 817, "lugar": "TEATRO_MACONDO"}, {"id": "EVT_EJECUCION_MONCADA", "titulo": "Ejecución del general José Raquel Moncada", "tipo": "muerte", "capitulo": 9, "participantes": ["JOSE_RAQUEL_MONCADA", "AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "El consejo de guerra exige la ejecución de los oficiales conservadores. A pesar de las súplicas de Úrsula, el coronel Aureliano Buendía no conmuta la sentencia de su viejo amigo Moncada, quien le dice que con su odio se ha vuelto igual que sus enemigos.", "orden_cronologico": 900, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_RELACION_INCESTUOSA_AMARANTA_AJ", "titulo": "Relación secreta entre Amaranta y Aureliano José", "tipo": "otro", "capitulo": 8, "participantes": ["AMARANTA_BUENDIA", "AURELIANO_JOSE"], "descripcion": "Aureliano José, criado por Amaranta desde niño, desarrolla una atracción que ella acaba correspondiendo. Se encuentran en la oscuridad del mosquitero, se persiguen por los rincones de la casa. Amaranta corta la relación abruptamente cuando casi los sorprende Úrsula, consciente de que ha llegado demasiado lejos.", "orden_cronologico": 812, "lugar": "CASA_BUENDIA"}, {"id": "EVT_REGRESO_SECRETO_CORONEL_CAP8", "titulo": "Regreso secreto del coronel Aureliano Buendía a Macondo antes del armisticio", "tipo": "guerra", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ", "ROQUE_CARNICERO", "AURELIANO_JOSE"], "descripcion": "En desacuerdo con los términos del armisticio, el coronel Aureliano Buendía regresa sigilosamente de madrugada con diez oficiales. Dispersan la guarnición, entierran las armas y destruyen los archivos. Al amanecer abandonan el pueblo. Aureliano José se va con su padre.", "orden_cronologico": 818, "lugar": "MACONDO"}, {"id": "EVT_ALZAMIENTOS_POSTARMISTICIO", "titulo": "Ocho levantamientos del coronel Aureliano Buendía en un año tras el armisticio", "tipo": "guerra", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "En el año siguiente al armisticio el coronel Aureliano Buendía intenta ocho alzamientos: cañonea Riohacha desde una goleta, ocupa una aduana fronteriza quince días, lanza un llamado a la guerra general y trata de cruzar 1500 km de selva para proclamar la guerra cerca de la capital.", "orden_cronologico": 803, "lugar": null}, {"id": "EVT_MUERTE_VISITACION", "titulo": "Muerte de Visitación", "tipo": "muerte", "capitulo": 8, "participantes": ["VISITACION"], "descripcion": "Visitación muere de muerte natural, el gusto que se dio después de haber renunciado a un trono por miedo al insomnio. Su última voluntad es que el sueldo ahorrado en más de veinte años se mande al Coronel para que siga la guerra. Úrsula no lo saca al creer que el coronel Aureliano Buendía está muerto.", "orden_cronologico": 804, "lugar": "MACONDO"}, {"id": "EVT_NOTICIAS_FALSAS_MUERTE_CORONEL", "titulo": "Cuatro informes falsos de la muerte del coronel Aureliano Buendía", "tipo": "otro", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN", "AMARANTA_BUENDIA"], "descripcion": "En menos de dos años el gobierno anuncia cuatro veces la muerte del coronel Aureliano Buendía. El cuarto informe se tiene por cierto durante casi seis meses. Úrsula y Amaranta superponen lutos hasta que llega la noticia de que está vivo en el Caribe.", "orden_cronologico": 805, "lugar": null}, {"id": "EVT_CORONEL_FEDERALISMO_CARIBE", "titulo": "El coronel Aureliano Buendía lucha por el federalismo en el Caribe y Centroamérica", "tipo": "guerra", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "El coronel Aureliano Buendía aparece bajo nombres distintos en repúblicas del Caribe, sumado al federalismo triunfante. Su proyecto: unificar las fuerzas federalistas de América Central para barrer con los regímenes conservadores desde Alaska hasta la Patagonia. La primera noticia directa que recibe Úrsula es una carta borrosa desde Santiago de Cuba.", "orden_cronologico": 806, "lugar": "CABO_DE_LA_VELA"}, {"id": "EVT_MONCADA_ALCALDE_MACONDO", "titulo": "General Moncada, primer alcalde de Macondo", "tipo": "acuerdo", "capitulo": 8, "participantes": ["JOSE_RAQUEL_MONCADA"], "descripcion": "Al terminar la guerra, Moncada es nombrado corregidor y luego primer alcalde de Macondo. Viste traje civil, sustituye militares por policías desarmados, hace respetar la amnistía y auxilia a familias de liberales muertos. Crea un ambiente de confianza que hace ver la guerra como una pesadilla del pasado.", "orden_cronologico": 807, "lugar": "MACONDO"}, {"id": "EVT_TEATRO_BRUNO_CRESPI", "titulo": "Bruno Crespi construye un teatro en Macondo", "tipo": "otro", "capitulo": 8, "participantes": ["BRUNO_CRESPI"], "descripcion": "Bruno Crespi, cuya tienda de juguetes e instrumentos musicales no cesa de prosperar, construye un vasto teatro al aire libre con escaños de madera, telón de terciopelo con máscaras griegas y tres taquillas en forma de cabezas de león. Las compañías españolas lo incluyen en sus itinerarios.", "orden_cronologico": 808, "lugar": "TEATRO_MACONDO"}, {"id": "EVT_BODA_BRUNO_CRESPI_AMPARO", "titulo": "Boda de Bruno Crespi y Amparo Moscote", "tipo": "boda", "capitulo": 8, "participantes": ["BRUNO_CRESPI", "AMPARO_MOSCOTE"], "descripcion": "Bruno Crespi se casa con Amparo Moscote, hija de don Apolinar Moscote y hermana de Remedios.", "orden_cronologico": 809, "lugar": null}, {"id": "EVT_GEMELOS_ESCUELA_REMEDIOS_BELLA", "titulo": "Los gemelos van a la escuela; Remedios empieza a ser llamada 'la Bella'", "tipo": "otro", "capitulo": 8, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_SEGUNDO", "REMEDIOS_LA_BELLA", "DON_MELCHOR_ESCALONA"], "descripcion": "Aureliano Segundo y José Arcadio Segundo son los primeros alumnos en sentarse en la escuela restaurada de don Melchor Escalona. Su hermana Remedios, heredera de la belleza de Santa Sofía de la Piedad, empieza a ser conocida como Remedios la Bella.", "orden_cronologico": 810, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_REGRESO_AURELIANO_JOSE", "titulo": "Regreso de Aureliano José; quiere casarse con Amaranta", "tipo": "llegada", "capitulo": 8, "participantes": ["AURELIANO_JOSE", "AMARANTA_BUENDIA"], "descripcion": "Aureliano José deserta de las tropas federalistas de Nicaragua, se enrola en un barco alemán y aparece en la cocina de la casa. Macizo, prieto y peludo como un indio. Su determinación secreta es casarse con Amaranta. Le propone matrimonio invocando que un soldado le aseguró que la guerra contra los curas se libra para que uno pueda casarse con su propia madre.", "orden_cronologico": 811, "lugar": "MACONDO"}, {"id": "EVT_RECHAZO_DEFINITIVO_AMARANTA_AJ", "titulo": "Amaranta echa la aldaba para siempre a Aureliano José", "tipo": "otro", "capitulo": 8, "participantes": ["AMARANTA_BUENDIA", "AURELIANO_JOSE"], "descripcion": "Tras meses de resistencia y encuentros nocturnos, Amaranta rechaza a Aureliano José con determinación inflexible. Echa para siempre la aldaba del dormitorio. Él busca consuelo en mujeres de la tienda de Catarino y en la indiferencia fingida, pero ya ha perdido terreno irrecuperable.", "orden_cronologico": 815, "lugar": "CASA_BUENDIA"}, {"id": "EVT_LLEGADA_17_AURELIANOS", "titulo": "Los diecisiete hijos del coronel Aureliano Buendía llegan a ser bautizados", "tipo": "otro", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN", "AMARANTA_BUENDIA", "JOSE_RAQUEL_MONCADA"], "descripcion": "En menos de doce años, diecisiete hijos del coronel Aureliano Buendía son traídos para ser bautizados, todos varones, todos con el mismo aire de soledad. Se les bautiza con el nombre de Aureliano y el apellido de la madre. Úrsula los registra en una libreta. Moncada es padrino del primero. Amaranta quiere quedarse con ellos pero las madres se oponen.", "orden_cronologico": 813, "lugar": "MACONDO"}, {"id": "EVT_PILAR_MADRE_DESCUBIERTA", "titulo": "Aureliano José descubre que Pilar Ternera es su madre", "tipo": "otro", "capitulo": 8, "participantes": ["AURELIANO_JOSE", "PILAR_TERNERA"], "descripcion": "Al contrario que Arcadio, que nunca conoció su origen, Aureliano José se entera de que es hijo de Pilar Ternera. Son más que madre e hijo: cómplices en la soledad. Él duerme la siesta en su casa, donde ella acoge a los amantes del vecindario.", "orden_cronologico": 814, "lugar": "CASA_PILAR"}, {"id": "EVT_ATAQUE_MACONDO_CAP8", "titulo": "El coronel Aureliano Buendía ataca Macondo con mil hombres", "tipo": "guerra", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_RAQUEL_MONCADA", "URSULA_IGUARAN"], "descripcion": "El primero de octubre al amanecer, el coronel Aureliano Buendía ataca Macondo con mil hombres bien armados. La guarnición recibe orden de resistir hasta el final. A mediodía un cañonazo rebelde pulveriza la fachada de la tesorería mientras Moncada almuerza con Úrsula. A las dos de la tarde Moncada sabe que ha perdido.", "orden_cronologico": 819, "lugar": "MACONDO"}, {"id": "EVT_CAPTURA_MONCADA", "titulo": "Captura del general Moncada al intentar huir de Macondo", "tipo": "guerra", "capitulo": 8, "participantes": ["JOSE_RAQUEL_MONCADA", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Moncada es capturado esa noche cuando intenta fugarse de Macondo, después de escribirle una extensa carta al Coronel recordándole los propósitos de humanizar la guerra y deseándole la victoria contra la corrupción.", "orden_cronologico": 820, "lugar": "MACONDO"}, {"id": "EVT_ANULACION_TITULOS_TIERRA", "titulo": "El coronel Aureliano Buendía anula los títulos de tierra usurpados por José Arcadio", "tipo": "acuerdo", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "REBECA"], "descripcion": "Revisando títulos de propiedad hasta cien años atrás, el coronel Aureliano Buendía descubre las tropelías legalizadas de su hermano José Arcadio. Los anula de una plumada. Visita a Rebeca para comunicárselo; ella, convertida en espectro, responde: «Se hará lo que tú dispongas. Siempre creí que eres un descastado.»", "orden_cronologico": 821, "lugar": "MACONDO"}, {"id": "EVT_JUICIOS_GUERRA_CAP8", "titulo": "Juicios sumarios de guerra bajo Gerineldo Márquez", "tipo": "guerra", "capitulo": 8, "participantes": ["GERINELDO_MARQUEZ", "AURELIANO_BUENDIA_CORONEL", "ROQUE_CARNICERO", "URSULA_IGUARAN"], "descripcion": "El coronel Gerineldo Márquez preside los consejos de guerra revolucionarios que condenan y fusilan a toda la oficialidad del ejército regular prisionera. El coronel Roque Carnicero se encarga de apresurar los juicios. Úrsula y las madres de los oficiales liberales testifican en defensa de Moncada, sin éxito.", "orden_cronologico": 822, "lugar": "MACONDO"}, {"id": "EVT_VISITA_CORONEL_MONCADA_CARCEL", "titulo": "El coronel Aureliano Buendía visita a Moncada en la celda antes del fusilamiento", "tipo": "otro", "capitulo": 8, "participantes": ["AURELIANO_BUENDIA_CORONEL", "JOSE_RAQUEL_MONCADA"], "descripcion": "Poco antes del amanecer el coronel Aureliano Buendía visita a Moncada. Le dice: «No te fusilo yo. Te fusila la revolución.» Moncada le responde: «De tanto odiar a los militares has terminado por ser igual a ellos.» Le entrega el reloj, el anillo, los lentes y la medalla para que se los mande a su esposa en Manaure.", "orden_cronologico": 823, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_MUERTE_CAPITAN_AQUILES", "titulo": "Muerte del capitán Aquiles Ricardo", "tipo": "muerte", "capitulo": 8, "participantes": ["CAPITAN_AQUILES_RICARDO"], "descripcion": "Cuatro horas antes de que Aureliano José muera desangrado, el capitán Aquiles Ricardo es abatido por dos balas simultáneas de origen nunca establecido. Más de cuatrocientos hombres desfilan frente al teatro y descargan sus revólveres contra su cadáver.", "orden_cronologico": 816, "lugar": "TEATRO_MACONDO"}, {"id": "EVT_RENDICION_CORONEL", "titulo": "El coronel Aureliano Buendía firma el armisticio de Neerlandia", "tipo": "acuerdo", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "El armisticio se firma bajo una ceiba gigantesca en Neerlandia, sin música ni celebraciones. El coronel Aureliano Buendía llega en mula embarrada, sin afeitar. Un joven coronel rebelde entrega 72 ladrillos de oro de la revolución (cubiertos de barro cocido), que el coronel Aureliano Buendía incluye en el inventario de la rendición. Lleva 32 levantamientos y casi veinte años de guerra.", "orden_cronologico": 901, "lugar": "NEERLANDIA"}, {"id": "EVT_DISPARO_CORONEL", "titulo": "El coronel Aureliano Buendía se dispara en el pecho y sobrevive", "tipo": "otro", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN", "PILAR_TERNERA"], "descripcion": "A las 3:15 h, en su tienda de campaña tras firmar el armisticio, el coronel Aureliano Buendía se dispara en el círculo de yodo que su médico le marcó en el pecho. La bala pasa sin tocar ningún órgano vital. Úrsula lo presiente en Macondo: la leche se llena de gusanos y ve el fantasma de José Arcadio Buendía. El fracaso del suicidio le devuelve el prestigio perdido.", "orden_cronologico": 902, "lugar": "NEERLANDIA"}, {"id": "EVT_NACIMIENTO_GEMELOS", "titulo": "Nacimiento de los gemelos y Remedios la Bella", "tipo": "nacimiento", "capitulo": 6, "participantes": ["SANTA_SOFIA_DE_LA_PIEDAD", "JOSE_ARCADIO_SEGUNDO", "AURELIANO_SEGUNDO", "REMEDIOS_LA_BELLA"], "descripcion": "Santa Sofía de la Piedad da a luz tres hijos de Arcadio: los gemelos José Arcadio Segundo y Aureliano Segundo, y una niña que más adelante será conocida como Remedios la Bella.", "orden_cronologico": 603, "lugar": "MACONDO"}, {"id": "EVT_VACIO_GUERRA_GERINELDO", "titulo": "Gerineldo Márquez siente el vacío de la guerra", "tipo": "otro", "capitulo": 9, "participantes": ["GERINELDO_MARQUEZ", "AMARANTA_BUENDIA"], "descripcion": "El coronel Gerineldo Márquez pierde paulatinamente el contacto real con la guerra. Las conversaciones telegráficas con el coronel Aureliano Buendía se vuelven incomprensibles. Su único refugio es el costurero de Amaranta, a quien visita cada tarde durante años contemplando cómo cose.", "orden_cronologico": 903, "lugar": "MACONDO"}, {"id": "EVT_RECHAZO_DEFINITIVO_GERINELDO", "titulo": "Amaranta rechaza definitivamente a Gerineldo: 'ya somos demasiado viejos'", "tipo": "otro", "capitulo": 9, "participantes": ["AMARANTA_BUENDIA", "GERINELDO_MARQUEZ"], "descripcion": "Tras cuatro años de cortejo, Amaranta da a Gerineldo Márquez la respuesta definitiva en agosto: «Olvidémonos para siempre. Ya somos demasiado viejos para estas cosas.» Se encierra a llorar su soledad hasta la muerte.", "orden_cronologico": 904, "lugar": "MACONDO"}, {"id": "EVT_TELEGRAMA_LLUVIA", "titulo": "El telegrama de la lluvia", "tipo": "otro", "capitulo": 9, "participantes": ["GERINELDO_MARQUEZ", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Gerineldo, desolado tras el rechazo de Amaranta, le telegrafía al Coronel: «Está lloviendo en Macondo.» Silencio. Luego los aparatos responden: «No seas pendejo, Gerineldo. Es natural que esté lloviendo en agosto.»", "orden_cronologico": 905, "lugar": "OFICINA_TELEGRAFICA"}, {"id": "EVT_REGRESO_CORONEL_DECAIDO", "titulo": "El coronel Aureliano Buendía regresa a Macondo completamente cambiado", "tipo": "llegada", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN", "AMARANTA_BUENDIA"], "descripcion": "El coronel Aureliano Buendía regresa sin escolta, envuelto en una manta a pesar del calor, con tres amantes instaladas en una misma casa. Pasa el tiempo en hamaca. Desatiende despachos, manda a la delegación política 'donde las putas'. Úrsula y Amaranta comprenden que lo han perdido para siempre.", "orden_cronologico": 906, "lugar": "MACONDO"}, {"id": "EVT_ASAMBLEA_Y_MUERTE_TEOFILO_VARGAS", "titulo": "Teófilo Vargas toma el mando rebelde y muere en emboscada", "tipo": "guerra", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GENERAL_TEOFILO_VARGAS"], "descripcion": "El coronel Aureliano Buendía convoca una asamblea para unificar el mando rebelde. El general Teófilo Vargas, indio puro y mesiánico, se adelanta a sus intenciones, deshace la coalición y se apodera del mando central. Quince días después es despedazado a machetazos en una emboscada. El coronel Aureliano Buendía no dio la orden, pero la consintió tácitamente, y asume el mando central.", "orden_cronologico": 907, "lugar": null}, {"id": "EVT_FRIO_INTERIOR_CORONEL", "titulo": "El frío interior que perseguirá al Coronel hasta la muerte", "tipo": "otro", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "La noche en que asume el mando central, el coronel Aureliano Buendía despierta pidiendo a gritos una manta. Un frío interior que le raya los huesos lo acompañará durante meses y luego para siempre.", "orden_cronologico": 908, "lugar": "NEERLANDIA"}, {"id": "EVT_SAQUEO_CASA_VIUDA_MONCADA", "titulo": "El coronel Aureliano Buendía manda quemar la casa de la viuda de Moncada", "tipo": "conflicto", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "VIUDA_MONCADA"], "descripcion": "El coronel Aureliano Buendía va a Manaure a cumplir la última voluntad de Moncada y entregar sus objetos personales a su viuda. Ella no le permite pasar de la puerta: «Usted mandará en su guerra, pero yo mando en mi casa.» Su guardia personal saquea y reduce a cenizas la casa.", "orden_cronologico": 909, "lugar": "MANAURE"}, {"id": "EVT_PROPUESTAS_SOLO_PODER", "titulo": "La comisión liberal propone renunciar a los ideales; 'solo luchamos por el poder'", "tipo": "acuerdo", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "Seis abogados del partido liberal piden al Coronel renunciar a la revisión de títulos de tierra, a la lucha anticlerical y a la igualdad de hijos naturales. El coronel Aureliano Buendía sonríe: «Quiere decir que solo estamos luchando por el poder.» Firma. Gerineldo Márquez lo llama traición.", "orden_cronologico": 910, "lugar": "MACONDO"}, {"id": "EVT_ARRESTO_GERINELDO", "titulo": "Gerineldo Márquez arrestado y condenado a muerte por traición", "tipo": "conflicto", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "Cuando Gerineldo llama traición a la firma, el coronel Aureliano Buendía le ordena entregar las armas y presentarse en el cuartel. Es condenado a muerte por los tribunales revolucionarios. El coronel Aureliano Buendía permanece insensible a las súplicas de clemencia.", "orden_cronologico": 911, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_AMENAZA_URSULA_CORONEL", "titulo": "Úrsula amenaza al Coronel con matarlo si fusila a Gerineldo", "tipo": "conflicto", "capitulo": 9, "participantes": ["URSULA_IGUARAN", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "La víspera de la ejecución, Úrsula visita al Coronel durante tres minutos: «Tan pronto como vea el cadáver, te lo juro por los huesos de mi padre y mi madre, te he de sacar de donde te metas y te mataré con mis propias manos.» Añade: «Es lo mismo que habría hecho si hubieras nacido con cola de puerco.»", "orden_cronologico": 912, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_LIBERACION_GERINELDO", "titulo": "El coronel Aureliano Buendía libera a Gerineldo en el último momento", "tipo": "otro", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "GERINELDO_MARQUEZ"], "descripcion": "Tras una noche de tormentosa vigilia, el coronel Aureliano Buendía aparece en la celda una hora antes de la ejecución: «Terminó la farsa, compadre. Vámonos de aquí, antes de que acaben de fusilarte los mosquitos.» Gerineldo lo recrimina: «Vale más estar muerto que verte convertido en un chafarote.»", "orden_cronologico": 913, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_DESTRUCCION_RASTROS_CORONEL", "titulo": "El coronel Aureliano Buendía destruye todo rastro de su paso por el mundo", "tipo": "otro", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "Antes del armisticio, el coronel Aureliano Buendía simplifica el taller de platería, regala su ropa a los ordenanzas y entierra sus armas en el patio. Solo conserva una pistola con una sola bala. Úrsula le impide destruir el daguerrotipo de Remedios Moscote: «Ese retrato dejó de pertenecerte. Es una reliquia de familia.»", "orden_cronologico": 914, "lugar": "CASA_BUENDIA"}, {"id": "EVT_QUEMA_VERSOS_CORONEL", "titulo": "El coronel Aureliano Buendía quema sus versos en el horno de la panadería", "tipo": "otro", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "Lleva el baúl con sus versos a la panadería y le da el primer rollo a Santa Sofía de la Piedad para encender el horno: «Arde mejor, porque son cosas muy viejas.» Ella le dice que los queme él mismo. Los quema, y destruye el baúl con una hachuela.", "orden_cronologico": 915, "lugar": "CASA_BUENDIA"}, {"id": "EVT_PILAR_VISITA_CORONEL_ARMISTICIO", "titulo": "Pilar Ternera visita al Coronel antes del armisticio; le repite 'cuídate la boca'", "tipo": "vision", "capitulo": 9, "participantes": ["PILAR_TERNERA", "AURELIANO_BUENDIA_CORONEL"], "descripcion": "Pilar visita al Coronel antes del armisticio. Él se asombra de cuánto ha envejecido, pero reconoce la profundidad de su lectura de barajas. Ella le repite: «Cuídate la boca.» Él le pregunta a su médico el sitio exacto del corazón; el médico lo marca con un círculo de yodo.", "orden_cronologico": 916, "lugar": "CASA_PILAR"}, {"id": "EVT_PREMONICION_LECHE_URSULA", "titulo": "Premonición de Úrsula: la leche con gusanos y el fantasma", "tipo": "vision", "capitulo": 9, "participantes": ["URSULA_IGUARAN", "JOSE_ARCADIO_BUENDIA_FUNDADOR"], "descripcion": "En el momento exacto en que el coronel Aureliano Buendía se dispara en Neerlandia, Úrsula destapa la olla de la leche y la encuentra llena de gusanos. Grita «¡Han matado a Aureliano!» Ve el fantasma de José Arcadio Buendía empapado de lluvia, y al anochecer discos anaranjados cruzando el cielo.", "orden_cronologico": 917, "lugar": "MACONDO"}, {"id": "EVT_PENSIONES_GUERRA", "titulo": "El coronel Aureliano Buendía amenaza con nueva guerra por las pensiones", "tipo": "conflicto", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "El gobierno supedita las pensiones de los excombatientes a una comisión especial. El coronel Aureliano Buendía dicta un telegrama amenazante al presidente: si las pensiones no se resuelven en quince días, proclama la guerra a muerte. El gobierno responde con arresto domiciliario.", "orden_cronologico": 918, "lugar": "OFICINA_TELEGRAFICA"}, {"id": "EVT_ARRESTO_DOMICILIARIO_CORONEL", "titulo": "Arresto domiciliario del coronel Aureliano Buendía tras el armisticio", "tipo": "conflicto", "capitulo": 9, "participantes": ["AURELIANO_BUENDIA_CORONEL", "URSULA_IGUARAN"], "descripcion": "Ante la amenaza de nueva guerra, el gobierno rodea la casa del coronel Aureliano Buendía con guardia militar y prohíbe toda visita. Medidas similares se adoptan en todo el país contra otros caudillos. En dos meses los instigadores están muertos, exiliados o asimilados por la administración pública.", "orden_cronologico": 919, "lugar": "CASA_BUENDIA"}, {"id": "EVT_REJUVENECIMIENTO_CASA_URSULA", "titulo": "Úrsula rejuvenece la casa", "tipo": "otro", "capitulo": 9, "participantes": ["URSULA_IGUARAN"], "descripcion": "Cuando sabe que su hijo vivirá, Úrsula lava y pinta la casa, cambia los muebles, restaura el jardín, siembra flores nuevas y abre puertas y ventanas. Decreta el fin de los lutos superpuestos, cambia sus trajes rigurosos por ropas juveniles. La pianola vuelve a sonar.", "orden_cronologico": 920, "lugar": "CASA_BUENDIA"}, {"id": "EVT_GUARDIA_MUERE_REMEDIOS", "titulo": "El joven comandante de la guardia muere de amor por Remedios la Bella", "tipo": "muerte", "capitulo": 9, "participantes": ["REMEDIOS_LA_BELLA"], "descripcion": "El día de Año Nuevo, el joven comandante de la guardia que custodia la casa amanece muerto de amor junto a la ventana de Remedios la Bella, enloquecido por sus desaires. Es la primera víctima de la belleza de Remedios.", "orden_cronologico": 921, "lugar": "CASA_BUENDIA"}, {"id": "EVT_EXTERMINIO_17_AURELIANOS", "titulo": "Exterminio de los 17 hijos del coronel Aureliano Buendía Aureliano", "tipo": "muerte", "capitulo": 12, "participantes": ["AURELIANO_BUENDIA_CORONEL", "AURELIANO_TRISTE", "AURELIANO_CENTENO", "AURELIANO_SERRADOR", "AURELIANO_ARCAYA", "AURELIANO_AMADOR"], "descripcion": "En el curso de una semana, los 17 hijos del coronel Aureliano Buendía son cazados como conejos en distintos lugares del litoral. La marca imborrable de ceniza en la frente los identifica para los asesinos. Aureliano Triste recibe un balazo en la frente; Aureliano Centeno es hallado en su hamaca con un punzón de picar hielo entre las cejas; Aureliano Serrador cae en un caldero de manteca hirviendo en la Calle de los Turcos; Aureliano Arcaya es abatido con una descarga de máuser al abrir la puerta. Solo Aureliano Amador escapa saltando la cerca de su patio y refugiándose con los indios de la sierra.", "orden_cronologico": 1200, "lugar": "MACONDO"}, {"id": "EVT_FERROCARRIL_LLEGA", "titulo": "Llegada del ferrocarril a Macondo", "tipo": "llegada", "capitulo": 11, "participantes": ["AURELIANO_TRISTE"], "descripcion": "Aureliano Triste conduce el primer tren que llega a Macondo, adornado de flores y con ocho meses de retraso. La población sale a la calle atónita ante la 'cocina arrastrando un pueblo'. Úrsula ve en el esquema del ferrocarril el mismo espíritu de José Arcadio Buendía fundador, y siente que el tiempo da vueltas en redondo.", "orden_cronologico": 1100, "lugar": "ESTACION_FERROCARRIL"}, {"id": "EVT_LLEGADA_COMPANIA_BANANERA", "titulo": "Llegada de la compañía bananera", "tipo": "llegada", "capitulo": 12, "participantes": ["SENOR_JACK_BROWN", "MISTER_HERBERT", "AURELIANO_BUENDIA_CORONEL", "AURELIANO_SEGUNDO"], "descripcion": "Tras la visita de míster Herbert, llegan ingenieros, agrónomos y topógrafos; luego el señor Jack Brown en su vagón laminado de plata. Macondo se convierte en un campamento de casas de cinc; los gringos construyen su barrio aparte cercado con malla electrificada y amanecido negro de golondrinas achicharradas. Las autoridades locales son sustituidas por forasteros autoritarios y sicarios de machete.", "orden_cronologico": 1201, "lugar": "MACONDO"}, {"id": "EVT_CONFUSION_GEMELOS", "titulo": "Los gemelos se intercambian los nombres en la escuela", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "JOSE_ARCADIO_SEGUNDO", "DON_MELCHOR_ESCALONA"], "descripcion": "Los gemelos, que ya confundían a todos desde niños, optan en la escuela por intercambiarse la ropa, las esclavas con sus nombres y los propios nombres. Don Melchor Escalona pierde los estribos al descubrir la suplantación. Desde entonces nadie sabe con certeza quién es quién.", "orden_cronologico": 1000, "lugar": "CUARTEL_MACONDO"}, {"id": "EVT_JOSE_ARCADIO_VE_FUSILAMIENTO", "titulo": "José Arcadio Segundo presencia un fusilamiento", "tipo": "otro", "capitulo": 10, "participantes": ["JOSE_ARCADIO_SEGUNDO", "GERINELDO_MARQUEZ"], "descripcion": "Gerineldo Márquez lleva a José Arcadio Segundo a ver un fusilamiento, contra el parecer de Úrsula. El condenado permanece erguido mientras la camisa se le empapa de sangre, y sigue sonriendo cuando lo meten en el cajón de cal. El muchacho queda convencido de que lo entierran vivo. Desde entonces detesta la guerra y lo militar.", "orden_cronologico": 1001, "lugar": "CEMENTERIO_MACONDO"}, {"id": "EVT_JOSE_ARCADIO_RELIGIOSO_GALLOS", "titulo": "José Arcadio Segundo se vuelve religioso y gallero bajo el padre Antonio Isabel", "tipo": "otro", "capitulo": 10, "participantes": ["JOSE_ARCADIO_SEGUNDO", "PADRE_ANTONIO_ISABEL"], "descripcion": "Traumatizado por el fusilamiento, José Arcadio Segundo toca las campanas, ayuda en misa al padre Antonio Isabel y cría gallos de pelea en el patio de la curia. El párroco le enseña teología entre los gallos. Hace su primera comunión, queda desconcertado por las preguntas del confesionario. Pronto se convierte en experto gallero y hombre de fortuna.", "orden_cronologico": 1002, "lugar": "MACONDO"}, {"id": "EVT_AURELIANO_SEGUNDO_PETRA_COTES", "titulo": "Aureliano Segundo conoce a Petra Cotes por equivocación", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "JOSE_ARCADIO_SEGUNDO", "PETRA_COTES"], "descripcion": "Una mujer que vende números de rifa confunde a Aureliano Segundo con su hermano y lo lleva a su cuarto. Aureliano Segundo descubre que ella se acuesta alternativamente con los dos creyendo que son el mismo hombre. En lugar de aclarar el equívoco, lo prolonga. Ambos hermanos contraen una enfermedad venérea y se curan por separado. Aureliano Segundo se queda con Petra Cotes hasta la muerte.", "orden_cronologico": 1003, "lugar": "CASA_PETRA_COTES"}, {"id": "EVT_PROSPERIDAD_SOBRENATURAL_PETRA", "titulo": "Proliferación sobrenatural de los animales de Aureliano Segundo", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "PETRA_COTES"], "descripcion": "Los animales de Aureliano Segundo se reproducen con una fecundidad inexplicable desde que Petra Cotes los rodea. Empieza con conejos que llenan el patio en una noche, sigue con una vaca que pare trillizos. En poco tiempo Aureliano Segundo acumula una de las mayores fortunas de la ciénaga. Él atribuye la prosperidad al amor de Petra Cotes.", "orden_cronologico": 1004, "lugar": "CASA_PETRA_COTES"}, {"id": "EVT_CASA_EMPAPELADA_BILLETES", "titulo": "Aureliano Segundo empapela la casa con billetes de a peso", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "URSULA_IGUARAN"], "descripcion": "Harto de las reprimendas de Úrsula sobre el dinero, Aureliano Segundo cubre toda la casa —fachada, cocina, baños y dormitorios— con billetes de a peso engrudo con brocha. El pueblo se agolpa en la calle a contemplar la glorificación del despilfarro. Úrsula hace despegar los billetes y repintar la casa de blanco.", "orden_cronologico": 1005, "lugar": "CASA_BUENDIA"}, {"id": "EVT_SAN_JOSE_ORO", "titulo": "El San José de yeso estaba relleno de monedas de oro", "tipo": "otro", "capitulo": 10, "participantes": ["URSULA_IGUARAN", "AMARANTA_BUENDIA"], "descripcion": "Al despegar los billetes de la pared, un trabajador vuelca una imagen de San José de yeso dejada por unos desconocidos durante la guerra. La imagen hueca se rompe: estaba llena de casi 200 kg de monedas de oro. Úrsula, que le había rezado sin saberlo, mete las monedas en tres sacos y las entierra en secreto esperando a que los dueños regresen.", "orden_cronologico": 1006, "lugar": "CASA_BUENDIA"}, {"id": "EVT_NAVEGACION_RIO_JOSE_ARCADIO", "titulo": "José Arcadio Segundo intenta hacer navegable el río; llegan las matronas francesas", "tipo": "otro", "capitulo": 10, "participantes": ["JOSE_ARCADIO_SEGUNDO"], "descripcion": "Inspirado por la historia del galeón español, José Arcadio Segundo intenta hacer navegable el río rompiendo piedras y despejando el cauce. Consigue remontar una balsa de troncos tirada por veinte hombres, a bordo de la cual llegan matronas francesas que transforman los métodos amorosos del pueblo y sustituyen la tienda de Catarino por un bazar de farolitos japoneses. Proclama la hazaña como una victoria.", "orden_cronologico": 1007, "lugar": "EL_RIO"}, {"id": "EVT_GALANTE_REMEDIOS", "titulo": "El caballero misterioso corteja a Remedios la Bella y se arruina", "tipo": "otro", "capitulo": 10, "participantes": ["REMEDIOS_LA_BELLA"], "descripcion": "Un apuesto forastero aparece cada domingo en la iglesia con una rosa amarilla para Remedios la Bella. Instala una banda frente a su ventana, noches enteras. Remedios la recibe sin malicia. El caballero se degrada progresivamente: de príncipe impecable a pendenciero harapiento. Años después muere dormido sobre las vías del tren.", "orden_cronologico": 1008, "lugar": "IGLESIA_MACONDO"}, {"id": "EVT_CORONEL_VEJEZ_PESCADITOS", "titulo": "El coronel Aureliano Buendía se recluye a fabricar pescaditos de oro en su vejez", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_BUENDIA_CORONEL"], "descripcion": "Encerrado en su taller, el coronel Aureliano Buendía fabrica pescaditos de oro que un antiguo soldado vende por la ciénaga a cambio de monedas, que él funde de nuevo en pescaditos. El círculo vicioso exasperante es su único refugio: la concentración artesanal le otorga la paz del espíritu que la guerra le negó. «Esperando que pase mi entierro», responde a quien le saluda.", "orden_cronologico": 1009, "lugar": "LABORATORIO_ALQUIMIA"}, {"id": "EVT_AURELIANO_SEGUNDO_VE_MELQUIADES", "titulo": "Aureliano Segundo ve el fantasma de Melquíades en el cuarto cerrado", "tipo": "vision", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "MELQUIADES"], "descripcion": "Aureliano Segundo, leyendo en el cuarto de Melquíades, ve al gitano sentado tal como lo describía la memoria hereditaria de la familia. Melquíades le habla del mundo durante años pero se niega a traducir los manuscritos: «Nadie debe conocer su sentido mientras no hayan cumplido cien años.» Úrsula entra al cuarto y no lo ve.", "orden_cronologico": 1010, "lugar": "CUARTO_MELQUIADES"}, {"id": "EVT_NACIMIENTO_JOSE_ARCADIO_QUINTO", "titulo": "Nacimiento de Jose Arcadio primer hijo de Aureliano Segundo y Fernanda", "tipo": "nacimiento", "capitulo": 10, "participantes": ["JOSE_ARCADIO_QUINTO", "AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "URSULA_IGUARAN"], "descripcion": "Aureliano Segundo nombra a su primer hijo José Arcadio. Úrsula pide criarlo ella misma: «Éste será cura, y si Dios me da vida, ha de llegar a ser Papa.» Se celebra con champán, cohetes y seis vacas sacrificadas para el pueblo.", "orden_cronologico": 1011, "lugar": "MACONDO"}, {"id": "EVT_CARNAVAL_FERNANDA", "titulo": "El carnaval sangriento: Remedios reina y la masacre de los falsos beduinos", "tipo": "otro", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO", "REMEDIOS_LA_BELLA", "JOSE_ARCADIO_SEGUNDO"], "descripcion": "Las matronas francesas organizan un carnaval y Remedios la Bella es proclamada reina. Llega una comparsa rival con su propia reina: Fernanda del Carpio, seleccionada entre cinco mil mujeres para ser reina de Madagascar. Un grito de «¡Viva el coronel Aureliano Buendía!» desata disparos: los beduinos de la comparsa eran soldados del ejército regular. Mueren 9 payasos, 4 colombinas, 17 reyes de baraja y otros. José Arcadio Segundo salva a Remedios; Aureliano Segundo lleva a Fernanda en brazos a la casa.", "orden_cronologico": 1012, "lugar": "MACONDO"}, {"id": "EVT_MATRIMONIO_AURELIANO_SEG_FERNANDA", "titulo": "Boda de Aureliano Segundo y Fernanda del Carpio", "tipo": "boda", "capitulo": 10, "participantes": ["AURELIANO_SEGUNDO", "FERNANDA_DEL_CARPIO"], "descripcion": "Aureliano Segundo va al pueblo de Fernanda para pedirle matrimonio. La boda dura veinte días. Él no abandona a su amante Petra Cotes y visita a Fernanda solo para mantener la apariencia familiar.", "orden_cronologico": 1013, "lugar": "IGLESIA_MACONDO"}, {"id": "EVT_ASCENSION_REMEDIOS_BELLA", "titulo": "Remedios la Bella asciende al cielo", "tipo": "milagro", "capitulo": 12, "participantes": ["REMEDIOS_LA_BELLA", "FERNANDA_DEL_CARPIO", "AMARANTA_BUENDIA", "URSULA_IGUARAN"], "descripcion": "Una tarde de marzo, mientras doblan sábanas en el patio, Remedios la Bella palidece y dice sentirse mejor que nunca. Un viento de luz le arranca las sábanas a Fernanda; Amaranta trata de agarrarse para no caer. Úrsula, casi ciega, es la única que comprende la naturaleza del viento y deja ir las sábanas. Remedios la Bella se eleva y desaparece para siempre en los altos aires.", "orden_cronologico": 1202, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_CORONEL_AURELIANO", "titulo": "Muerte del coronel Aureliano Buendía Aureliano Buendía", "tipo": "muerte", "capitulo": 13, "participantes": ["AURELIANO_BUENDIA_CORONEL", "SANTA_SOFIA_DE_LA_PIEDAD"], "descripcion": "El 11 de octubre, el coronel Aureliano Buendía sale por primera vez en años a ver el desfile de un circo. Al ver una mujer vestida de oro sobre un elefante, revive la tarde prodigiosa de los gitanos y el hielo. Después se apoya en el castaño del patio, mete la cabeza entre los hombros y muere de pie, solo y olvidado. La familia no se entera hasta el día siguiente, cuando Santa Sofía de la Piedad ve bajar los gallinazos.", "orden_cronologico": 1300, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MUERTE_AMARANTA", "titulo": "Muerte de Amaranta Buendía", "tipo": "muerte", "capitulo": 14, "participantes": ["AMARANTA_BUENDIA", "URSULA_IGUARAN"], "descripcion": "Amaranta termina la mortaja que comenzó a coser el día que la muerte se le apareció vestida de azul. Ofrece llevar cartas a los difuntos. Se acuesta y muere en el silencio de su alcoba, todavía virgen y con la venda negra en la mano.", "orden_cronologico": 1400, "lugar": "CASA_BUENDIA"}, {"id": "EVT_AMOR_MEME_MAURICIO", "titulo": "Relación de Meme y Mauricio Babilonia", "tipo": "otro", "capitulo": 14, "participantes": ["MEME", "MAURICIO_BABILONIA", "PILAR_TERNERA"], "descripcion": "Meme se enamora del mecánico Mauricio Babilonia, rodeado siempre de mariposas amarillas. Se encuentran dos veces por semana en la casa de Pilar Ternera. La relación dura tres meses.", "orden_cronologico": 1401, "lugar": "BURDEL_PILAR"}, {"id": "EVT_DISPARO_MAURICIO", "titulo": "Mauricio Babilonia es disparado por un guardia", "tipo": "conflicto", "capitulo": 14, "participantes": ["MAURICIO_BABILONIA", "MEME", "FERNANDA_DEL_CARPIO"], "descripcion": "Sin confrontar a su hija, Fernanda invita a almorzar al alcalde y le pide que establezca una guardia nocturna con el pretexto de que roban gallinas. Esa noche, cuando Mauricio levanta las tejas del techo del baño para reunirse con Meme, que lo espera desnuda entre alacranes y mariposas, la guardia le dispara. Un proyectil incrustado en la columna vertebral lo deja paralítico de por vida. Muere años después en la soledad, atormentado por los recuerdos y las mariposas amarillas, públicamente repudiado como ladrón de gallinas.", "orden_cronologico": 1402, "lugar": "CASA_BUENDIA"}, {"id": "EVT_MEME_AL_CONVENTO", "titulo": "Fernanda envía a Meme a un convento", "tipo": "partida", "capitulo": 15, "participantes": ["MEME", "FERNANDA_DEL_CARPIO", "DON_FERNANDO"], "descripcion": "Al día siguiente del disparo a Mauricio Babilonia, Fernanda empaca tres mudas de ropa y lleva a Meme al tren sin darle explicación. Meme, que no ha vuelto a hablar desde que oyó el disparo, sube como sonámbula. Viajan en tren, luego en un cochecito por una ciudad desolada, luego en buque fluvial, luego a lomo de mula por el páramo. Meme sabe dónde está porque en el espanto del insomnio ve pasar al caballero vestido de negro — su abuelo Don Fernando — que en una víspera de Navidad llegó a la casa dentro de un cofre de plomo. Al día siguiente Fernanda la conduce al convento donde ella misma fue educada. Una novicia le tiende la mano diciéndole «Vamos, Renata» y la clausura se cierra tras ella para siempre. Meme nunca vuelve a pronunciar una palabra.", "orden_cronologico": 1500, "lugar": "MACONDO"}, {"id": "EVT_NACIMIENTO_AURELIANO_BABILONIA", "titulo": "Nacimiento de Aureliano Babilonia", "tipo": "nacimiento", "capitulo": 15, "participantes": ["AURELIANO_BABILONIA", "MEME", "MAURICIO_BABILONIA", "FERNANDA_DEL_CARPIO"], "descripcion": "Meme da a luz a un hijo varón en el convento. El antiguo director espiritual de Fernanda le envía al niño en una canastilla con una carta explicando que nació dos meses antes y fue bautizado Aureliano porque la madre no despegó los labios. Fernanda lo recibe horrorizada pero no tiene valor para ahogarlo en la alberca. A Santa Sofía de la Piedad le dice que lo encontró flotando en una canastilla.", "orden_cronologico": 1501, "lugar": "MACONDO"}, {"id": "EVT_HUELGA_BANANERA", "titulo": "Huelga de los trabajadores de la plantación bananera", "tipo": "conflicto", "capitulo": 15, "participantes": ["JOSE_ARCADIO_SEGUNDO", "LORENZO_GAVILAN"], "descripcion": "Los trabajadores de la compañía bananera van a la huelga exigiendo mejoras. José Arcadio Segundo, amigo del coronel exiliado Lorenzo Gavilán, participa activamente en la organización.", "orden_cronologico": 1502, "lugar": "PLANTACION_BANANERA"}, {"id": "EVT_MASACRE_BANANERA", "titulo": "Decreto Número 4 y masacre de los huelguistas", "tipo": "muerte", "capitulo": 15, "participantes": ["JOSE_ARCADIO_SEGUNDO", "GENERAL_CARLOS_CORTES_VARGAS", "MAYOR_ENRIQUE_GARCIA_ISAZA"], "descripcion": "El general Carlos Cortés Vargas firma el Decreto Número 4 que declara cuadrilla de malhechores a los huelguistas y autoriza al ejército a matarlos a bala. Se lee en la estación ante más de tres mil personas concentradas. El capitán da cinco minutos para retirarse; nadie se mueve. Las ametralladoras abren fuego. José Arcadio Segundo despierta en un tren cargado de cadáveres que van a ser arrojados al mar como el banano de rechazo. El gobierno niega que haya habido muertos.", "orden_cronologico": 1503, "lugar": "MACONDO"}, {"id": "EVT_DILUVIO_CUATRO_ANOS", "titulo": "El diluvio de cuatro años, once meses y dos días", "tipo": "desastre", "capitulo": 16, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_SEGUNDO", "URSULA_IGUARAN", "FERNANDA_DEL_CARPIO"], "descripcion": "Una lluvia que no cesa durante casi cinco años pone a Macondo al borde del olvido. La plantación bananera y la ciudad son abandonadas. La casa Buendía queda invadida de humedad. Úrsula aparece cubierta de sanguijuelas.", "orden_cronologico": 1600, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_GERINELDO_MARQUEZ", "titulo": "Muerte del coronel Gerineldo Márquez", "tipo": "muerte", "capitulo": 16, "participantes": ["GERINELDO_MARQUEZ", "URSULA_IGUARAN"], "descripcion": "El cortejo fúnebre de Gerineldo Márquez pasa en una carreta de bueyes bajo el diluvio. Sobre el ataúd llevan la bandera sucia de sangre y pólvora y el sable con borlas de cobre que colgaba en casa de Amaranta. Detrás van los últimos sobrevivientes de la capitulación de Neerlandia, descalzos, chapaleando en el fango. Úrsula se hace llevar a la puerta y lo despide: «Adiós, Gerineldo, hijo mío. Salúdame a mi gente y dile que nos vemos cuando escampe.» Luego le confiesa a Aureliano Segundo que solo está esperando que pare la lluvia para morirse.", "orden_cronologico": 1601, "lugar": "MACONDO"}, {"id": "EVT_MUERTE_GEMELOS", "titulo": "Muerte simultánea de los gemelos", "tipo": "muerte", "capitulo": 17, "participantes": ["JOSE_ARCADIO_SEGUNDO", "AURELIANO_SEGUNDO", "SANTA_SOFIA_DE_LA_PIEDAD", "PETRA_COTES", "FERNANDA_DEL_CARPIO"], "descripcion": "El 9 de agosto, José Arcadio Segundo cae de bruces sobre los pergaminos en el cuarto de Melquíades con los ojos abiertos, tr
