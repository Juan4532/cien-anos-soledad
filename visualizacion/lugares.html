<style>
  /* ---- Scrollbars ---- */
  .lug-tree::-webkit-scrollbar,
  .lug-detail::-webkit-scrollbar { width: 6px; }
  .lug-tree::-webkit-scrollbar-track,
  .lug-detail::-webkit-scrollbar-track { background: transparent; }
  .lug-tree::-webkit-scrollbar-thumb,
  .lug-detail::-webkit-scrollbar-thumb {
    background: var(--rule);
    border-radius: 999px;
  }
  .lug-tree::-webkit-scrollbar-thumb:hover,
  .lug-detail::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  .lug-tree, .lug-detail {
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }

  /* ---- Lugares layout ---- */
  .lug-wrap {
    display: flex;
    height: calc(100vh - 80px - 56px);
    overflow: hidden;
    max-width: 1440px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Sidebar */
  .lug-sidebar {
    width: 310px;
    flex-shrink: 0;
    border-right: var(--border-double);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lug-sidebar-head {
    padding: 24px 16px 14px;
    border-bottom: var(--border-double);
    flex-shrink: 0;
  }
  .lug-search {
    width: 100%;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    font-family: var(--font-label);
    font-size: 11px;
    letter-spacing: var(--label-letter);
    padding: 7px 11px;
    border-radius: var(--shape-radius);
    outline: none;
    transition: border-color .15s;
  }
  .lug-search:focus { border-color: var(--accent); }
  .tipo-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 9px;
  }

  /* Tree */
  .lug-tree {
    flex: 1;
    overflow-y: auto;
  }
  .tree-node {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .12s;
    user-select: none;
  }
  .tree-node:hover { background: var(--accent-bg); }
  .tree-node.is-active {
    background: var(--accent-bg);
    border-left-color: var(--accent);
  }
  .tree-node.is-active .tree-name { color: var(--accent); }
  .tree-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 9px;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
    width: 13px;
    text-align: center;
  }
  .tree-spacer { width: 13px; flex-shrink: 0; }
  .tree-dot {
    width: 7px;
    height: 7px;
    border-radius: var(--shape-radius);
    flex-shrink: 0;
    transform: rotate(var(--shape-square-rotate));
  }
  .tree-name {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .tree-node.depth-0 .tree-name {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }

  /* Detail panel */
  .lug-detail {
    flex: 1;
    overflow-y: auto;
    padding: 48px 60px 80px;
  }
  .lug-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-italic);
    font-style: italic;
    font-size: 20px;
    color: var(--ink-faint);
  }
  .lug-detail-inner {
    max-width: 800px;
  }
  .de-badges {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tipo-badge {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: var(--label-letter);
    text-transform: var(--label-transform);
    border: 1px solid currentColor;
    padding: 2px 9px;
    border-radius: var(--shape-radius);
  }
  .lug-title {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 300;
    line-height: 1.05;
    margin-bottom: 28px;
  }
  .lug-desc {
    font-family: var(--font-italic);
    font-style: italic;
    font-size: 18px;
    line-height: 1.65;
    color: var(--ink-soft);
    border-left: 2px solid var(--rule);
    padding-left: 20px;
    margin-bottom: 44px;
    max-width: 640px;
  }
  .lug-section-label {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: var(--label-letter);
    text-transform: var(--label-transform);
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  .child-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 44px;
  }
  .child-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border: 1px solid var(--rule);
    border-radius: var(--shape-radius);
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .child-chip:hover {
    border-color: var(--accent-soft);
    color: var(--accent);
  }
  .ev-row {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
    align-items: baseline;
  }
  .ev-cap {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: var(--label-letter);
    text-transform: var(--label-transform);
    color: var(--ink-faint);
  }
  .ev-titulo {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.4;
    transition: color .12s;
  }
  a.ev-row { text-decoration: none; color: inherit; cursor: pointer; }
  a.ev-row:hover .ev-titulo { color: var(--accent); }
  a.ev-row:hover .ev-cap { color: var(--accent-soft); }

  @media (max-width: 768px) {
    .lug-wrap {
      flex-direction: column;
      height: auto;
      min-height: calc(100vh - 80px - 56px);
    }
    .lug-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: var(--border-double);
      max-height: 44vh;
    }
    .lug-detail {
      padding: 28px 20px 60px;
    }
    .lug-title { font-size: 36px }
  }
</style>

;
</script>
<script>
(function(){
'use strict';

// ── Índices ────────────────────────────────────────────────────────────────
const byId = Object.fromEntries(RAW_LUGARES.map(l => [l.id, l]));
const byParent = {};
RAW_LUGARES.forEach(l => {
  const p = l.dentro || '__root__';
  (byParent[p] = byParent[p] || []).push(l);
});

// ── Colores por tipo ───────────────────────────────────────────────────────
const TIPO_COLOR = {
  pueblo:     'var(--accent)',
  ciudad:     'var(--ink)',
  region:     'var(--ink-soft)',
  casa:       'var(--accent-soft)',
  habitacion: 'var(--ink-faint)',
  patio:      'var(--ink-faint)',
  calle:      'var(--ink-soft)',
  edificio:   'var(--ink-soft)',
  imaginario: 'var(--accent)',
};
const TIPO_LABEL = {
  pueblo: 'Pueblo', ciudad: 'Ciudad', region: 'Región',
  casa: 'Casa', habitacion: 'Habitación', patio: 'Patio',
  calle: 'Calle', edificio: 'Edificio', imaginario: 'Imaginario',
};

// ── Estado ─────────────────────────────────────────────────────────────────
let selected = 'MACONDO';
let expanded = new Set(['MACONDO', 'CASA_BUENDIA', 'SELVA', 'CIUDAD_FERNANDA']);
let query = '';
let tipoFilter = new Set();

// ── DOM ────────────────────────────────────────────────────────────────────
const wrap = document.getElementById('lug-wrap');

// Sidebar
const sidebar = el('aside', { className: 'lug-sidebar' });
const sideHead = el('div', { className: 'lug-sidebar-head' });
const searchInput = el('input', {
  className: 'lug-search', type: 'search', placeholder: 'Buscar lugar…'
});
searchInput.addEventListener('input', e => { query = e.target.value; render(); });

const tipoChips = el('div', { className: 'tipo-chips' });
const allTipos = [...new Set(RAW_LUGARES.map(l => l.tipo))].filter(t => t !== 'imaginario' && t !== 'patio').sort();
allTipos.forEach(t => {
  const btn = el('button', {
    className: 'chip',
    textContent: TIPO_LABEL[t] || t,
  });
  btn.addEventListener('click', () => {
    tipoFilter.has(t) ? tipoFilter.delete(t) : tipoFilter.add(t);
    render();
  });
  tipoChips.appendChild(btn);
});

sideHead.append(searchInput, tipoChips);
const treeDiv = el('div', { className: 'lug-tree' });
sidebar.append(sideHead, treeDiv);

// Detail
const detailDiv = el('div', { className: 'lug-detail' });
const emptyDiv = el('div', { className: 'lug-empty', textContent: 'Selecciona un lugar' });

wrap.append(sidebar, detailDiv);

// ── Helpers ────────────────────────────────────────────────────────────────
function el(tag, props = {}) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (props.style && typeof props.style === 'string') e.style.cssText = props.style;
  return e;
}

function makeDot(tipo, extra) {
  return el('span', {
    className: 'tree-dot',
    style: `background:${TIPO_COLOR[tipo] || 'var(--ink-faint)'}; ${extra || ''}`,
  });
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  renderSidebar();
  renderDetail();
}

function renderSidebar() {
  // Update tipo chip states
  tipoChips.querySelectorAll('.chip').forEach((btn, i) => {
    btn.classList.toggle('is-active', tipoFilter.has(allTipos[i]));
  });

  treeDiv.innerHTML = '';
  const isFiltering = query.trim() || tipoFilter.size > 0;
  if (isFiltering) {
    const q = query.toLowerCase().trim();
    const results = RAW_LUGARES.filter(l => {
      const matchQ = !q || l.nombre.toLowerCase().includes(q) || l.desc.toLowerCase().includes(q);
      const matchT = tipoFilter.size === 0 || tipoFilter.has(l.tipo);
      return matchQ && matchT;
    });
    if (!results.length) {
      treeDiv.appendChild(el('div', {
        style: 'padding:24px 16px; color:var(--ink-faint); font-style:italic; font-family:var(--font-italic)',
        textContent: 'Sin resultados',
      }));
    }
    results.forEach(l => {
      const node = el('div', {
        className: 'tree-node' + (selected === l.id ? ' is-active' : ''),
      });
      node.style.paddingLeft = '16px';
      node.append(makeDot(l.tipo));
      node.append(el('span', { className: 'tree-name', textContent: l.nombre }));
      node.addEventListener('click', () => { selected = l.id; render(); });
      treeDiv.appendChild(node);
    });
  } else {
    (byParent['__root__'] || []).forEach(l => renderTreeNode(l, 0, treeDiv));
  }
}

function renderTreeNode(lugar, depth, container) {
  const children = byParent[lugar.id] || [];
  const hasChildren = children.length > 0;
  const isExpanded = expanded.has(lugar.id);
  const isActive = selected === lugar.id;

  const node = el('div', {
    className: 'tree-node depth-' + depth + (isActive ? ' is-active' : ''),
  });
  node.style.paddingLeft = (14 + depth * 18) + 'px';

  if (hasChildren) {
    const tog = el('button', {
      className: 'tree-toggle',
      textContent: isExpanded ? '▼' : '▶',
    });
    tog.addEventListener('click', e => {
      e.stopPropagation();
      isExpanded ? expanded.delete(lugar.id) : expanded.add(lugar.id);
      render();
    });
    node.appendChild(tog);
  } else {
    node.appendChild(el('span', { className: 'tree-spacer' }));
  }
  node.append(makeDot(lugar.tipo));
  node.append(el('span', { className: 'tree-name', textContent: lugar.nombre }));
  node.addEventListener('click', () => { selected = lugar.id; render(); });
  container.appendChild(node);

  if (hasChildren && isExpanded) {
    children.forEach(c => renderTreeNode(c, depth + 1, container));
  }
}

function renderDetail() {
  detailDiv.innerHTML = '';
  const lugar = byId[selected];
  if (!lugar) { detailDiv.appendChild(emptyDiv); return; }

  const children = byParent[lugar.id] || [];
  const inner = el('div', { className: 'lug-detail-inner' });

  // Badges
  const badges = el('div', { className: 'de-badges' });
  const badge = el('span', {
    className: 'tipo-badge',
    textContent: TIPO_LABEL[lugar.tipo] || lugar.tipo,
    style: `color:${TIPO_COLOR[lugar.tipo] || 'var(--ink-soft)'}`,
  });
  badges.appendChild(badge);
  inner.appendChild(badges);

  // Title
  inner.appendChild(el('div', {
    className: 'lug-title',
    textContent: lugar.nombre,
  }));

  // Description
  if (lugar.desc) {
    inner.appendChild(el('p', {
      className: 'lug-desc',
      textContent: lugar.desc,
    }));
  }

  // Children
  if (children.length) {
    const lbl = el('div', {
      className: 'lug-section-label',
      textContent: `— ${children.length} ${children.length === 1 ? 'lugar dentro' : 'lugares dentro'} —`,
    });
    inner.appendChild(lbl);
    const chips = el('div', { className: 'child-chips' });
    children.forEach(c => {
      const chip = el('div', { className: 'child-chip' });
      chip.append(
        makeDot(c.tipo, 'width:7px;height:7px;border-radius:var(--shape-radius)'),
        el('span', { textContent: c.nombre })
      );
      chip.addEventListener('click', () => {
        selected = c.id;
        expanded.add(lugar.id);
        render();
      });
      chips.appendChild(chip);
    });
    inner.appendChild(chips);
  }

  // Events
  if (lugar.eventos.length) {
    inner.appendChild(el('div', {
      className: 'lug-section-label',
      textContent: `— ${lugar.eventos.length} ${lugar.eventos.length === 1 ? 'evento' : 'eventos'} —`,
    }));
    const evList = el('div');
    lugar.eventos.forEach(e => {
      const row = el('a', {
        className: 'ev-row',
        href: 'cronologia.html?evento=' + e.id,
      });
      row.append(
        el('span', {
          className: 'ev-cap',
          textContent: e.capitulo ? `cap. ${e.capitulo}` : '—',
        }),
        el('span', { className: 'ev-titulo', textContent: e.titulo })
      );
      evList.appendChild(row);
    });
    inner.appendChild(evList);
  }

  detailDiv.appendChild(inner);
}

// ── Init ───────────────────────────────────────────────────────────────────
// Handle ?lugar=ID from external links (e.g. from cronologia.html)
(function(){
  var params = new URLSearchParams(location.search);
  var lugarId = params.get('lugar');
  if (lugarId && byId[lugarId]) {
    selected = lugarId;
    // Expand all ancestors so the node is visible in the tree
    var cur = byId[lugarId];
    while (cur && cur.dentro) {
      expanded.add(cur.dentro);
      cur = byId[cur.dentro];
    }
  }
})();

render();

})();
</script>
</body>
</html>
