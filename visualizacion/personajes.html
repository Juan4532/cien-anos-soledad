<!doctype html>
<html lang="es" data-mode="dark">
<head>
<meta charset="utf-8" />
<title>Personajes · Cien años de soledad</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/system.css" />
<script src="scripts/mode.js"></script>
<script src="scripts/symbols.js"></script>
<style>
  .page-head{
    padding: 56px 56px 40px;
    display:grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items:end;
    max-width: 1440px; margin-left: auto; margin-right: auto;
  }
  .page-head .meta-row{
    display:flex; gap:24px; align-items:baseline; justify-content:flex-end;
    color: var(--ink-soft);
  }
  .page-head .meta-row .v{
    font-family: var(--font-display); font-size: 32px; color: var(--accent); font-style: italic;
  }
  .page-head .meta-row .stat{display:flex; flex-direction:column; align-items:flex-start; gap:4px}
  .page-head .meta-row .stat .l{font-size: 10px}

  .mode-switch{
    display:inline-flex; padding: 2px;
    border: 1px solid var(--rule); border-radius: var(--shape-radius);
    font-family: var(--font-label); font-size: 11px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
  }
  .mode-switch button{
    background: transparent; border: none; cursor: pointer;
    padding: 8px 18px; color: var(--ink-soft); border-radius: var(--shape-radius);
    transition: all .15s;
  }
  .mode-switch button.is-active{background: var(--accent); color: var(--bg)}

  .toolbar{
    padding: 16px max(56px, calc((100vw - 1440px) / 2 + 56px));
    border-top: var(--border-double); border-bottom: var(--border-double);
    display:flex; gap: 36px; align-items:center; flex-wrap:wrap;
  }
  .toolbar-group{display:flex; gap: 8px; align-items:center}
  .toolbar-group .label{margin-right: 6px}

  .ptg-main{
    padding: 32px max(56px, calc((100vw - 1440px) / 2 + 56px)) 80px;
  }
  .graph-outer{
    position:relative; max-width: 860px; margin: 0 auto;
  }

  /* GRAPH */
  .graph-wrap{
    position:relative; aspect-ratio: 1/1; width:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.15) 100%);
  }
  html[data-mode="light"] .graph-wrap{
    background: radial-gradient(ellipse 600px 400px at 30% 70%, rgba(110,74,31,0.05), transparent 60%);
  }
  .graph-wrap svg.bg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .graph-wrap svg.edges{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
  .char-node{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:5px;
    text-align:center; pointer-events:none;
    transition: opacity .2s;
  }
  .char-node.is-dimmed{opacity: 0.22}
  .char-node.is-faded{opacity: 0.15}
  .cn-sym, .cn-inits{
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--accent-soft);
    background: var(--portrait);
    background-image: repeating-linear-gradient(45deg, transparent 0 6px, var(--portrait-stripe) 6px 7px);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    pointer-events: auto; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    transition: border-color .15s, box-shadow .15s;
  }
  .cn-inits{
    font-family: var(--font-display); font-size: 13px; line-height: 1;
    color: var(--ink-faint); letter-spacing: 0.02em;
  }
  .char-node:hover .cn-sym,  .char-node.is-active .cn-sym,
  .char-node:hover .cn-inits,.char-node.is-active .cn-inits{
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(232,185,74,0.22);
  }
  .cn-name{
    font-family: var(--font-display); font-size: 11px; line-height:1.15;
    color: var(--ink-soft); padding: 1px 4px;
    max-width: 90px; white-space: normal; pointer-events:none;
    text-shadow: 0 1px 3px var(--bg), 0 0 6px var(--bg);
  }
  html[data-mode="light"] .cn-name{font-weight:500; text-shadow:none}
  .char-node.is-active .cn-name{color: var(--accent)}

  /* DETAIL PANEL — fixed right drawer */
  .detail{
    position:fixed; top:0; right:0; bottom:0;
    width:380px;
    overflow-y:auto;
    background:var(--bg); border-left:1px solid var(--rule);
    z-index:200;
    transform:translateX(100%);
    transition:transform .22s ease;
    padding: 0 20px 20px;
  }
  .detail.is-open{transform:translateX(0)}
  .de-close{
    position:sticky; top:0; display:block; width:100%;
    background:var(--bg); border:none; border-bottom:1px solid var(--rule);
    padding:10px 0; cursor:pointer;
    font-family:var(--font-label); font-size:11px;
    letter-spacing:var(--label-letter); text-transform:var(--label-transform);
    color:var(--ink-faint); text-align:right;
  }
  .de-close:hover{color:var(--accent)}
  .de-emblem{
    display:flex; flex-direction:column; align-items:center;
    padding: 32px 0 20px; gap: 12px;
  }
  .de-sym{color:var(--accent)}
  .de-inits{
    font-family: var(--font-display); font-size: 80px; line-height:1;
    color: var(--ink-faint); text-align:center;
    letter-spacing: -0.03em;
  }
  html[data-mode="light"] .de-inits{font-weight:500}
  .de-name{
    font-family: var(--font-display); font-size: 26px; font-style:italic;
    color: var(--ink); text-align:center; line-height:1.1;
  }
  html[data-mode="light"] .de-name{font-style:normal; font-weight:500}
  .de-alias{
    font-family: var(--font-italic); font-style:italic; font-size:14px;
    color: var(--ink-soft); text-align:center;
  }
  .de-meta{
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
    padding: 0 16px 20px; border-bottom: var(--border-double);
  }
  .de-meta .m{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint);
  }
  .de-meta .v{font-family: var(--font-display); font-size:14px; color: var(--accent)}
  .de-bio{
    padding: 16px 0; font-size: 14px; line-height:1.65;
    color: var(--ink-soft); border-bottom: var(--border-double);
  }
  .de-rels{padding: 16px 0}
  .de-rels h4{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); margin-bottom: 10px;
  }
  .de-rel{
    display:grid; grid-template-columns: 22px 1fr auto;
    gap:10px; align-items:start; padding: 6px 0;
    border-bottom: 1px dotted var(--ink-faint);
    cursor:pointer;
  }
  .de-rel:hover .dr-name{color: var(--accent)}
  .de-rel .dr-sym{color:var(--accent); display:flex}
  .de-rel .dr-name{font-family: var(--font-display); font-size:13px; color:var(--ink)}
  .de-rel .dr-kind{
    font-family: var(--font-label); font-size:9px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); text-align:right;
  }
  .de-link{
    display:block; margin-top:20px; text-align:center;
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent); text-decoration:none;
    padding: 8px; border: 1px solid var(--accent-soft);
    transition: background .15s;
  }
  .de-link:hover{background: var(--accent-bg)}
  .de-events{padding: 16px 0; border-top: var(--border-double)}
  .de-events h4{
    font-family: var(--font-label); font-size:10px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--ink-faint); margin-bottom: 10px;
  }
  .de-ev{
    display:grid; grid-template-columns: 32px 1fr;
    gap:8px; align-items:start; padding: 6px 0;
    border-bottom: 1px dotted var(--ink-faint);
    text-decoration: none; color: inherit;
  }
  .de-ev:hover .dev-title{color: var(--accent)}
  .dev-cap{
    font-family: var(--font-label); font-size:9px;
    letter-spacing: var(--label-letter); text-transform: var(--label-transform);
    color: var(--accent-soft); padding-top: 3px;
  }
  .dev-title{font-family: var(--font-display); font-size:13px; color:var(--ink); font-style:italic; line-height:1.2}
  html[data-mode="light"] .dev-title{font-style:normal; font-weight:500}

  /* CYTOSCAPE VIEW */
  #cy-wrap{
    width:100%; aspect-ratio:1/1; position:relative; overflow:hidden;
    background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.12) 100%);
  }
  html[data-mode="light"] #cy-wrap{
    background: radial-gradient(ellipse 600px 400px at 30% 70%, rgba(110,74,31,0.05), transparent 60%);
  }
  #cy{ width:100%; height:100%; display:block; }
  #cy-filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center}

  .cy-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
  #cy-tooltip{
    position:absolute; pointer-events:none;
    background:var(--bg); border:1px solid var(--rule);
    padding:4px 10px; font-family:var(--font-label); font-size:10px;
    color:var(--ink); letter-spacing:var(--label-letter); text-transform:var(--label-transform);
    opacity:0; transition:opacity .1s; z-index:50; white-space:nowrap;
  }

  @media (max-width: 768px) {
    .page-head {
      grid-template-columns: 1fr;
      padding: 24px 20px 20px;
      gap: 24px;
    }
    .page-head .meta-row {
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }
    .toolbar {
      padding: 12px 20px;
      gap: 12px;
    }
    .ptg-main { padding: 20px 20px 60px }
    .graph-outer { max-width: 100% }
    .detail {
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--rule);
    }
  }
</style>
</head>

    <div class="graph-wrap" id="graph-wrap" style="display:none">

        <g id="bg-rings" fill="none" stroke="currentColor" stroke-opacity="0.14" stroke-width="0.004"></g>
        <g id="bg-lines" fill="none" stroke="var(--accent)" stroke-width="0.006" stroke-opacity="0.5"></g>

<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>

<script>
const RAW_PERSONAJES = [{"id": "JOSE_ARCADIO_BUENDIA_FUNDADOR", "nombre": "José Arcadio Buendía", "apodos": ["el fundador", "el patriarca"], "generacion": 1, "capitulo": 1, "grupo": "buendia", "descripcion": "Patriarca y fundador de Macondo. Obstinado e imaginativo, apasionado por los inventos y la alquimia. Pierde la cordura y pasa sus últimos años atado al castaño del patio hasta morir."}, {"id": "MELQUIADES", "nombre": "Melquíades", "apodos": [], "generacion": null, "capitulo": 1, "grupo": null, "descripcion": "Gitano anciano y sabio, jefe de la banda que visita Macondo. Introduce inventos y tecnología. Muere y regresa de entre los muertos varias veces. Escribe unos pergaminos proféticos en sánscrito que no serán descifrados hasta 100 años después."}, {"id": "AURELIANO_BUENDIA_CORONEL", "nombre": "Aureliano Buendía", "apodos": ["el coronel Aureliano Buendía", "Aurelito"], "generacion": 2, "capitulo": 1, "grupo": "buendia", "descripcion": "Segundo hijo de José Arcadio Buendía y Úrsula, primer ser humano nacido en Macondo. Silencioso y retraído, con capacidades presientes desde niño. Se convierte en coronel liberal, pierde 32 levantamientos armados, engendra 17 hijos con 17 mujeres, sobrevive 14 intentos de asesinato. Firma la rendición y pasa sus últimos años haciendo pececitos de oro en el taller. Muere apoyado en el castaño del patio, olvidado por todos."}, {"id": "AMARANTA_BUENDIA", "nombre": "Amaranta", "apodos": [], "generacion": 2, "capitulo": 2, "grupo": "buendia", "descripcion": "Hija de José Arcadio Buendía y Úrsula. Ama a Pietro Crespi pero lo rechaza cruelmente llevando a su suicidio. También rechaza a Gerineldo Márquez. Se quema la mano con carbones y lleva una venda negra hasta su muerte como penitencia. Muere virgen, tras coser su propio sudario, sabiendo el día exacto de su muerte."}, {"id": "REBECA", "nombre": "Rebeca", "apodos": [], "generacion": 2, "capitulo": 3, "grupo": "buendia", "descripcion": "Huérfana adoptada por los Buendía, supuesta prima lejana de Úrsula. Llega cargando los huesos de sus padres en una cesta. Come tierra y cal compulsivamente en momentos de ansiedad. Enamorada de Pietro Crespi, acaba casándose con José Arcadio hijo. Tras la muerte de su esposo se recluye en su casa y vive aislada del mundo hasta morir."}, {"id": "VISITACION", "nombre": "Visitación", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "India guajira que llegó a Macondo con su hermano huyendo de una plaga de insomnio en su tribu. Trabaja como sirvienta para los Buendía. Reconoce los síntomas del insomnio en Rebeca y advierte del peligro. Había rechazado un trono en su tribu. Muere en la casa de los Buendía."}, {"id": "PIETRO_CRESPI", "nombre": "Pietro Crespi", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Italiano apuesto y refinado, llega a instalar la pianola de los Buendía y enseñar a bailar. Maestro de música y director de escuela de baile. Amado por Rebeca y Amaranta. Tras ser rechazado definitivamente por Amaranta después de años de espera, se suicida cortándose las muñecas en su almacén."}, {"id": "APOLINAR_MOSCOTE", "nombre": "Don Apolinar Moscote", "apodos": [], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Magistrado enviado por el gobierno para gobernar Macondo. José Arcadio Buendía lo expulsa pero regresa con soldados y acaba quedándose. Conservador convencido. Padre de Remedios y Amparo Moscote. Manipula las elecciones locales a favor de los conservadores, detonando la guerra civil."}, {"id": "REMEDIOS_MOSCOTE", "nombre": "Remedios Moscote", "apodos": [], "generacion": null, "capitulo": 4, "grupo": "allegado", "descripcion": "Hija menor de Don Apolinar Moscote. El coronel Aureliano Buendía Aureliano se enamora de ella cuando tiene 9 años y se casan tras su primera menstruación. Serena y tranquila, cuida a José Arcadio Buendía atado al árbol y acepta a Aureliano José como propio. Muere joven a causa de una infección tras un aborto espontáneo de gemelos. Su daguerrotipo queda colgado en la pared de la casa."}, {"id": "ARCADIO", "nombre": "Arcadio", "apodos": [], "generacion": 3, "capitulo": 3, "grupo": "buendia", "descripcion": "Hijo de José Arcadio hijo y Pilar Ternera, criado por los Buendía ignorando su verdadero origen. Gobernante civil y militar de Macondo nombrado por el coronel Aureliano Buendía, resulta un tirano despiadado. Se casa con Santa Sofía de La Piedad. Es fusilado al amanecer al final de la guerra, dejando una hija recién nacida sin nombre y a su esposa embarazada."}, {"id": "AURELIANO_JOSE", "nombre": "Aureliano José", "apodos": [], "generacion": 3, "capitulo": 4, "grupo": "buendia", "descripcion": "Hijo del coronel Aureliano Buendía Aureliano Buendía y Pilar Ternera. Criado por Remedios Moscote como propio y luego por Amaranta. Desarrolla una obsesión incestuosa por su tía Amaranta, quien finalmente lo rechaza. Deserta de las tropas federalistas para regresar a casa. Es asesinado por soldados en un teatro."}, {"id": "SANTA_SOFIA_DE_LA_PIEDAD", "nombre": "Santa Sofía de La Piedad", "apodos": [], "generacion": null, "capitulo": 6, "grupo": "allegado", "descripcion": "Joven virgen a quien Pilar Ternera paga para que vaya en su lugar a la cama de Arcadio. Se convierte en su esposa. Madre de Remedios la Bella, José Arcadio Segundo y Aureliano Segundo. Trabaja incansablemente en la casa Buendía durante décadas sin quejarse, tratada más como sirvienta que como matriarca. Al final abandona la casa agotada y no se vuelve a saber de ella."}, {"id": "GERINELDO_MARQUEZ", "nombre": "Gerineldo Márquez", "apodos": ["el coronel Gerineldo Márquez"], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Amigo de infancia y camarada del coronel Aureliano Buendía Aureliano, uno de los 21 hombres con que inicia la guerra. Leal y convencido de los ideales liberales. Ama a Amaranta, quien lo rechaza. Administra Macondo como líder civil en ausencia del coronel Aureliano Buendía. Condenado a muerte por el propio Coronel por traición; Úrsula amenaza con matar a su hijo si lo ejecuta. Muere durante el diluvio."}, {"id": "JOSE_RAQUEL_MONCADA", "nombre": "José Raquel Moncada", "apodos": ["el general Moncada"], "generacion": null, "capitulo": 5, "grupo": null, "descripcion": "General conservador que acaba siendo alcalde de Macondo tras la guerra, convirtiendo el pueblo en un lugar pacífico. Viejo amigo del coronel Aureliano Buendía Aureliano pese a estar en bandos contrarios. Ejecutado por orden del coronel Aureliano Buendía al final del conflicto. El coronel Aureliano Buendía asume su responsabilidad excusándose en 'la revolución', algo que Moncada rechaza."}, {"id": "REMEDIOS_LA_BELLA", "nombre": "Remedios la Bella", "apodos": ["Remedios"], "generacion": 4, "capitulo": 8, "grupo": "buendia", "descripcion": "Hija de Arcadio y Santa Sofía de La Piedad. De belleza sobrenatural que provoca locura y muerte en los hombres que la rodean. Deambula desnuda sin entender el efecto que causa. Simple y pura hasta lo divino. Asciende al cielo un día mientras dobla sábanas en el patio con Fernanda, desapareciendo entre las nubes."}, {"id": "JOSE_ARCADIO_SEGUNDO", "nombre": "José Arcadio Segundo", "apodos": [], "generacion": 4, "capitulo": 7, "grupo": "buendia", "descripcion": "Gemelo de Aureliano Segundo, hijo de Arcadio y Santa Sofía. Delgado como el coronel Aureliano Buendía. Presencia un fusilamiento de niño y detesta las prácticas militares. Lidera la huelga de los trabajadores bananeros. Único superviviente de la masacre de las 3000 personas. Pasa sus últimos años oculto en el cuarto de Melquíades estudiando los pergaminos. Muere al mismo tiempo que su gemelo."}, {"id": "AURELIANO_SEGUNDO", "nombre": "Aureliano Segundo", "apodos": [], "generacion": 4, "capitulo": 7, "grupo": "buendia", "descripcion": "Gemelo de José Arcadio Segundo, hijo de Arcadio y Santa Sofía. Robusto y jovial. Se casa con Fernanda del Carpio pero mantiene a Petra Cotes como amante toda su vida. Amasa una fortuna gracias a la fértil multiplicación del ganado vinculada a su pasión por Petra. Muere del mismo tumor en la garganta al mismo instante que su gemelo."}, {"id": "PETRA_COTES", "nombre": "Petra Cotes", "apodos": [], "generacion": null, "capitulo": 10, "grupo": "allegado", "descripcion": "Viuda mestiza, amante permanente de Aureliano Segundo. Su pasión por él provoca la misteriosa multiplicación del ganado. Acepta con lucidez el reparto de Aureliano entre ella y Fernanda. En la vejez, con los animales muertos por el diluvio, vende rifas y envía comida a los Buendía privándose ella misma. Guarda las botas de Aureliano como garantía de que volverá."}, {"id": "FERNANDA_DEL_CARPIO", "nombre": "Fernanda del Carpio", "apodos": [], "generacion": null, "capitulo": 10, "grupo": "allegado", "descripcion": "Elegida como la más bella entre 5000 mujeres para ser reina de carnaval. Criada en total aislamiento por una familia venida a menos, educada en un convento. Religiosa, rígida y ajena a la realidad. Esposa de Aureliano Segundo. Solo permite relaciones 42 días al año según su calendario religioso. Lleva la casa Buendía con mano de hierro y muere sola, encontrada por Aureliano Babilonia en su cama."}, {"id": "MEME", "nombre": "Meme", "apodos": ["Renata Remedios", "Renata"], "generacion": 5, "capitulo": 11, "grupo": "buendia", "descripcion": "Hija de Aureliano Segundo y Fernanda del Carpio. Social y alegre, al contrario que su madre. Clavicordista sin pasión. Se enamora del mecánico Mauricio Babilonia. Cuando Fernanda descubre la relación hace disparar a Mauricio y envía a Meme a un convento, donde pierde el habla para siempre. Muere de vieja sin haber vuelto a ser feliz, dejando un hijo, Aureliano Babilonia."}, {"id": "MAURICIO_BABILONIA", "nombre": "Mauricio Babilonia", "apodos": [], "generacion": null, "capitulo": 14, "grupo": "allegado", "descripcion": "Mecánico pobre de la compañía bananera. Amante de Meme. Siempre rodeado de mariposas amarillas que anuncian su presencia. Recibe un disparo de un guardia cuando intenta colarse por el techo del baño para ver a Meme, quedándole paralítico de por vida. Muere de viejo, solo, atormentado por los recuerdos y las mariposas."}, {"id": "JOSE_ARCADIO_QUINTO", "nombre": "José Arcadio", "apodos": [], "generacion": 5, "capitulo": 11, "grupo": "buendia", "descripcion": "Hijo de Aureliano Segundo y Fernanda del Carpio, enviado al seminario de Roma para convertirse en papa. Regresa sin haberse ordenado, habiendo malvivido fuera. Restaura parte de la casa Buendía. Mantiene una extraña relación con los niños del vecindario. Es ahogado por ellos en la piscina, que le roban el oro de Úrsula."}, {"id": "AMARANTA_URSULA", "nombre": "Amaranta Úrsula", "apodos": [], "generacion": 5, "capitulo": 14, "grupo": "buendia", "descripcion": "Hija menor de Aureliano Segundo y Fernanda. Vital, hermosa y resuelta. Estudia en Bruselas y regresa con su esposo Gastón, convencida de poder revivir Macondo. Se enamora de su sobrino Aureliano Babilonia sin saber que lo es. Muere desangrada tras dar a luz al último Buendía, el niño con cola de cerdo."}, {"id": "AURELIANO_BABILONIA", "nombre": "Aureliano Babilonia", "apodos": [], "generacion": 6, "capitulo": 14, "grupo": "buendia", "descripcion": "Hijo de Meme y Mauricio Babilonia, criado en secreto por Fernanda. Vive recluido en el taller de Melquíades estudiando los pergaminos y aprendiendo sánscrito. Se enamora de su tía Amaranta Úrsula sin saber el parentesco. Descifra los manuscritos en el momento en que el viento arrasa Macondo, leyendo su propio destino en el instante en que ocurre."}, {"id": "GASTON", "nombre": "Gastón", "apodos": [], "generacion": null, "capitulo": 17, "grupo": "allegado", "descripcion": "Belga apasionado por la aviación, esposo de Amaranta Úrsula. La conoció al aterrizar de emergencia en un campo de flores. Intenta adaptarse a Macondo mientras planea montar un servicio de correo aéreo. Cuando Amaranta Úrsula le confiesa su amor por Aureliano Babilonia, responde con ecuanimidad y se va a Bruselas, guardando sus propios intereses con calma."}, {"id": "PRUDENCIO_AGUILAR", "nombre": "Prudencio Aguilar", "apodos": [], "generacion": null, "capitulo": 1, "grupo": null, "descripcion": "Vecino de Riohacha. En una pelea de gallos pone en evidencia públicamente la supuesta impotencia de José Arcadio Buendía. Este lo mata con una lanza. Su fantasma persigue al matrimonio Buendía con una tristeza tan profunda que provoca compasión, no terror, forzándoles a abandonar su pueblo y fundar Macondo. José Arcadio Buendía sigue hablando con su espectro hasta el final de su vida."}, {"id": "FRANCISCO_EL_HOMBRE", "nombre": "Francisco el Hombre", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Trovador itinerante de casi 200 años que recorre las comunidades de la región narrando sus historias y noticias como un cuentacuentos ambulante. A través de él Aureliano se entera de la muerte de su madre adoptiva. Representa el medio de comunicación oral antes de que lleguen el correo, el telégrafo y el teléfono."}, {"id": "PADRE_NICANOR", "nombre": "Padre Nicanor", "apodos": ["el padre Nicanor"], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Sacerdote horrorizado de que Macondo viva sin religión. Decide quedarse para construir una iglesia. Demuestra el poder de Dios levitándose 12 centímetros tras beber una taza de chocolate, repitiendo la demostración hasta recaudar fondos suficientes. Intenta sin éxito convencer a José Arcadio Buendía atado al árbol de la existencia de Dios."}, {"id": "BRUNO_CRESPI", "nombre": "Bruno Crespi", "apodos": [], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Hermano menor de Pietro Crespi. Administra la tienda de música mientras Pietro dirige la escuela de baile. Se casa con Amparo Moscote. Más tarde abre el primer cine de Macondo, que despierta sentimientos encontrados en la gente hasta que el alcalde explica que las imágenes son solo ilusiones."}, {"id": "AMPARO_MOSCOTE", "nombre": "Amparo Moscote", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Hija de Don Apolinar Moscote y hermana de Remedios. Hace de enlace entre Pietro Crespi y Rebeca, entregando en secreto las cartas del italiano. Se casa con Bruno Crespi. Cose el vestido de novia de Rebeca cuando Amaranta destruye el primero."}, {"id": "AURELIANO_TRISTE", "nombre": "Aureliano Triste", "apodos": [], "generacion": 3, "capitulo": 11, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía con distintas mujeres durante la guerra. Establece una fábrica de hielo en Macondo, cumpliendo el sueño del patriarca. Trae el ferrocarril a la aldea en su segunda visita, abriendo la puerta a la llegada de la compañía bananera y la modernidad."}, {"id": "AURELIANO_CENTENO", "nombre": "Aureliano Centeno", "apodos": [], "generacion": 3, "capitulo": 11, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo para ayudar a Aureliano Triste en la producción de hielo. Descubre por casualidad cómo fabricar helados, iniciando un nuevo negocio."}, {"id": "AURELIANO_AMADOR", "nombre": "Aureliano Amador", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Único superviviente de la noche en que los 17 hermanos fueron cazados uno a uno por la marca de ceniza en la frente. Se refugia con los indios. Reaparece años después hecho jirones en la puerta de la casa Buendía, donde nadie lo reconoce, y es abatido por dos policías en el acto."}, {"id": "NIGROMANTA", "nombre": "Nigromanta", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Bisnieta del anciano negro antillano que guardaba memoria del coronel Aureliano Buendía. Prostituta del barrio de tolerancia, grande, de huesos sólidos y cabeza acorazada de pelos de alambre. Lleva desde que nació un cintillo de acero alrededor de la cintura. Aureliano Babilonia acude a ella para sofocar su pasión por Amaranta Úrsula, pero termina confiándole su amor reprimido; a partir de entonces ella le cobra los servicios con tanto rigor que lleva la cuenta con rayitas de uña detrás de la puerta."}, {"id": "AURELIANO_ULTIMO", "nombre": "Aureliano", "apodos": [], "generacion": 7, "capitulo": 20, "grupo": "buendia", "descripcion": "Hijo de Aureliano Babilonia y Amaranta Úrsula, producto del incesto que la estirpe temió durante siete generaciones. Nace con cola de cerdo, el signo profetizado desde los tiempos de Úrsula Iguarán. Su madre muere en el parto. Abandonado en el jardín, es devorado por las hormigas. Su muerte coincide con la destrucción de Macondo por el viento mientras Aureliano descifra los pergaminos."}, {"id": "JOSE_ARCADIO_HIJO", "nombre": "José Arcadio", "apodos": [], "generacion": 2, "capitulo": 1, "grupo": "buendia", "descripcion": "Hijo mayor de José Arcadio Buendía y Úrsula. Nacido en el camino hacia Macondo antes de su fundación. Físicamente enorme y tatuado. Tiene una relación con Pilar Ternera de la que nace Arcadio. Se marcha con los gitanos y regresa años después. Se casa con Rebeca. Muere asesinado de un disparo sin herida visible, con olor a pólvora."}, {"id": "PILAR_TERNERA", "nombre": "Pilar Ternera", "apodos": [], "generacion": null, "capitulo": 2, "grupo": "allegado", "descripcion": "Habitante original de Macondo, traída por sus padres para alejarla de un hombre que la violó con 14 años. Lectora de cartas, adivina y proxeneta. Se acuesta con José Arcadio (hijo) y con el coronel Aureliano Buendía Aureliano, engendrando hijos de ambos hermanos. Vive 145 años y muere en su mecedora en el burdel que regenta al final de la novela."}, {"id": "URSULA_IGUARAN", "nombre": "Úrsula Iguarán", "apodos": [], "generacion": 1, "capitulo": 1, "grupo": "buendia", "descripcion": "Matriarca de la familia Buendía. Prima y esposa de José Arcadio Buendía. Voz de la razón y sustento real de la familia. Emprendedora, incansable y longeva (vive más de 110 años). Pierde la vista en su vejez pero lo disimula memorizando distancias y rutinas."}, {"id": "CATAURE", "nombre": "Cataure", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Indio guajiro, hermano de Visitación. Llegó a Macondo huyendo de la peste del insomnio que asolaba su tribu. Desapareció en la noche en que reconoció la enfermedad en los ojos de Rebeca, sin despedirse ni dar explicaciones."}, {"id": "MAGNIFICO_VISBAL", "nombre": "Magnífico Visbal", "apodos": [], "generacion": null, "capitulo": 4, "grupo": null, "descripcion": "Amigo de la infancia de Aureliano Buendía e hijo de uno de los fundadores de Macondo. Acompaña al Coronel en sus salidas a la tienda de Catarino."}, {"id": "DOCTOR_ALIRIO_NOGUERA", "nombre": "Alirio Noguera", "apodos": ["el doctor Noguera", "el falso homeópata"], "generacion": null, "capitulo": 5, "grupo": null, "descripcion": "Médico homeópata fraudulento que llega a Macondo con un diploma falso de Leipzig y glóbulos de azúcar. En realidad es un agitador federalista que escapó a Curazao disfrazado de cura tras ser capturado en la primera aventura liberal. Recluta a la juventud de Macondo para un plan de asesinatos individuales contra funcionarios conservadores y sus familias. Aureliano lo rechaza llamándolo matarife. Fusilado en la plaza por el ejército conservador sin juicio previo."}, {"id": "GREGORIO_STEVENSON", "nombre": "Gregorio Stevenson", "apodos": ["el coronel Stevenson"], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Coronel liberal enviado por el coronel Aureliano Buendía Aureliano Buendía para negociar la rendición de Macondo. Llega disfrazado de anciana montada en un burro cargado de escobas. Usa un pescadito de oro como salvoconducto. Arcadio lo encarcela por no traer carta escrita. Logra convencer a Arcadio de darle armas y defiende el cuartel solo con veinte cartuchos disparando por distintas ventanas antes de morir en la reconquista conservadora."}, {"id": "ROQUE_CARNICERO", "nombre": "Roque Carnicero", "apodos": ["el capitán Carnicero"], "generacion": null, "capitulo": 6, "grupo": null, "descripcion": "Capitán del ejército conservador, especialista en ejecuciones sumarias. Dirige el pelotón que fusila a Arcadio. Su nombre propio es una coincidencia irónica con su oficio. Aparecerá más adelante en relación directa con el coronel Aureliano Buendía Aureliano Buendía."}, {"id": "CAPITAN_AQUILES_RICARDO", "nombre": "Aquiles Ricardo", "apodos": [], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Capitán comandante de la guarnición conservadora de Macondo durante el período de paz. Los liberales lo señalan como provocador. Mata a Aureliano José de un tiro en la espalda al intentar registrarlo en la puerta del teatro; muere él mismo cuatro horas antes, abatido por dos balas de origen desconocido."}, {"id": "EL_CACHORRO", "nombre": "Padre Coronel", "apodos": ["El Cachorro"], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Sacerdote veterano de la primera guerra federalista que reemplaza al padre Nicanor Reyna, consumido por las fiebres hepáticas. El pueblo lo apoda El Cachorro."}, {"id": "DON_MELCHOR_ESCALONA", "nombre": "Melchor Escalona", "apodos": ["don Melchor Escalona"], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Maestro viejo enviado desde la ciénaga para hacerse cargo de la escuela restaurada de Macondo. Conocido por hacer caminar de rodillas a los alumnos desaplicados y darles ají picante a los lenguaraces, con la aprobación de los padres."}, {"id": "CARMELITA_MONTIEL", "nombre": "Carmelita Montiel", "apodos": [], "generacion": null, "capitulo": 8, "grupo": null, "descripcion": "Joven virgen de veinte años que vive en casa de Pilar Ternera. Estaba destinada a ser la compañera de Aureliano José, pero la noche en que lo esperaba con la cama preparada con hojas de romero, él fue al teatro y lo mataron."}, {"id": "GENERAL_TEOFILO_VARGAS", "nombre": "Teófilo Vargas", "apodos": [], "generacion": null, "capitulo": 9, "grupo": null, "descripcion": "General rebelde, indio puro, montaraz, analfabeto. Dotado de una malicia taciturna y una vocación mesiánica que suscita fanatismo en sus hombres. En la segunda asamblea de comandantes rebeldes se adelanta al Coronel y se apodera del mando central. Muere despedazado a machetazos en una emboscada."}, {"id": "VIUDA_MONCADA", "nombre": "Viuda de Moncada", "apodos": [], "generacion": null, "capitulo": 9, "grupo": null, "descripcion": "Esposa del general Moncada, vive en Manaure. Cuando el coronel Aureliano Buendía va a entregarle los objetos personales de su marido, le niega el paso: «Usted mandará en su guerra, pero yo mando en mi casa.» El coronel Aureliano Buendía manda saquear y quemar la casa."}, {"id": "PADRE_ANTONIO_ISABEL", "nombre": "Padre Antonio Isabel", "apodos": [], "generacion": null, "capitulo": 10, "grupo": null, "descripcion": "Párroco de Macondo, sucesor de El Cachorro. Cría gallos de pelea en el patio de la curia y enseña catecismo y teología mientras los cuida. Tutor de José Arcadio Segundo para su primera comunión. Manifiesta desde joven los primeros síntomas del delirio senil: llega a creer que el Diablo ganó la rebelión contra Dios y ocupa el trono celestial."}, {"id": "DON_FERNANDO", "nombre": "Don Fernando", "apodos": [], "generacion": null, "capitulo": 11, "grupo": null, "descripcion": "Padre de Fernanda del Carpio. Aristocrata venido a menos de una ciudad de 32 campanarios. Viste siempre de negro con cuello laminado y leontina de oro; pasa los días encerrado en su despacho. Mandó educar a Fernanda como reina y la entregó a Aureliano Segundo cuando un militar desconocido acudió a su casa. Se comunica con su hija solo por carta. Muere y es enviado a Macondo en un ataúd de plomo lleno de perlas vivas, en una caja de Navidad."}, {"id": "ARGENIDA", "nombre": "Argénida", "apodos": [], "generacion": null, "capitulo": 7, "grupo": null, "descripcion": "Vieja sirvienta que acompaña a Rebeca en su encierro voluntario. Es la única persona con quien Rebeca tiene contacto con el mundo exterior; actúa como intermediaria cuando los hijos del coronel Aureliano Buendía restauran la fachada de la casa."}, {"id": "CAMILA_SAGASTUME", "nombre": "Camila Sagastume", "apodos": ["La Elefanta"], "generacion": null, "capitulo": 13, "grupo": null, "descripcion": "Conocida en todo el país como 'La Elefanta'. Mujer gigantesca y maciza, de rostro hermoso y manos finas, directora de una academia de canto. Aprendió a comer como disciplina moral, no deportiva: quien tiene la conciencia en orden puede comer sin tregua. Compite con Aureliano Segundo en un duelo gastronómico que dura hasta el martes; se detiene voluntariamente para no propiciar la muerte del adversario."}, {"id": "MISTER_HERBERT", "nombre": "Míster Herbert", "apodos": [], "generacion": null, "capitulo": 12, "grupo": null, "descripcion": "Hombre rechoncho y sonriente, empresario de globos cautivos. Llega un miércoles a Macondo, almuerza en casa de los Buendía y examina los bananos con un estilete, granatorio, calibrador, termómetro e higrómetro. Sus observaciones atraen ingenieros, agrónomos y al señor Jack Brown, desencadenando la llegada de la compañía bananera."}, {"id": "SENOR_JACK_BROWN", "nombre": "Señor Jack Brown", "apodos": ["Mr. Brown"], "generacion": null, "capitulo": 12, "grupo": null, "descripcion": "Jefe visible de la compañía bananera estadounidense. Llega en un vagón suplementario laminado de plata con poltronas de terciopelo y techo de vidrios azules, acompañado de abogados de negro y perros alemanes feroces. Instala a los funcionarios locales en el gallinero electrificado y reemplaza las autoridades de Macondo por forasteros autoritarios."}, {"id": "AURELIANO_SERRADOR", "nombre": "Aureliano Serrador", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo durante el auge bananero. Muere asesinado en la noche del exterminio: alguien le dispara desde entre la muchedumbre de la Calle de los Turcos y cae dentro de un caldero de manteca hirviendo."}, {"id": "AURELIANO_ARCAYA", "nombre": "Aureliano Arcaya", "apodos": [], "generacion": 3, "capitulo": 12, "grupo": "buendia", "descripcion": "Uno de los 17 hijos del coronel Aureliano Buendía Aureliano Buendía. Se queda en Macondo durante el auge bananero. Muere asesinado en la noche del exterminio: alguien llama a la puerta de su cuarto con el pretexto de avisarle del peligro y le espera con una descarga de máuser que le desbarata el cráneo."}, {"id": "CATARINO", "nombre": "Catarino", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Dueño de la tienda de Catarino."}, {"id": "RENATA_ARGOTE", "nombre": "Renata Argote", "apodos": [], "generacion": null, "capitulo": 11, "grupo": null, "descripcion": "Madre de Fernanda del Carpio, esposa de Don Fernando. De su nombre proviene el de su nieta Meme, cuyo nombre de pila es Renata Remedios."}, {"id": "NICANOR_ULLOA", "nombre": "Nicanor Ulloa", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Padre de Rebeca. Amigo de José Arcadio Buendía. Muerto antes del inicio de la novela; sus restos llegan a Macondo en el talego que carga su hija."}, {"id": "REBECA_MONTIEL", "nombre": "Rebeca Montiel", "apodos": [], "generacion": null, "capitulo": 3, "grupo": null, "descripcion": "Madre de Rebeca, esposa de Nicanor Ulloa. Muerta antes del inicio de la novela; sus restos llegan a Macondo junto a los de su marido en el talego que carga su hija."}, {"id": "PATRICIA_BROWN", "nombre": "Patricia Brown", "apodos": [], "generacion": null, "capitulo": 14, "grupo": null, "descripcion": "Hija del señor Jack Brown, jefe de la compañía bananera. Es una de las tres jóvenes norteamericanas que traban amistad con muchachas de Macondo. Meme aprende inglés, tenis y natación en su casa. Es la intermediaria involuntaria que facilita el primer encuentro de Meme con Mauricio Babilonia en el taller mecánico."}, {"id": "LORENZO_GAVILAN", "nombre": "Lorenzo Gavilán", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Coronel de la revolución mexicana exiliado en Macondo. Amigo de José Arcadio Segundo en los tiempos de la huelga bananera; dice haber sido testigo del heroísmo de Artemio Cruz. Muere en la masacre; José Arcadio Segundo lo identifica entre los cadáveres del tren."}, {"id": "GENERAL_CARLOS_CORTES_VARGAS", "nombre": "General Carlos Cortés Vargas", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Jefe militar que firmó el Decreto Número 4, que declaraba cuadrilla de malhechores a los huelguistas y autorizó al ejército a matarlos a bala."}, {"id": "PETRONILA_IGUARAN", "nombre": "Petronila Iguarán", "apodos": [], "generacion": null, "capitulo": 16, "grupo": null, "descripcion": "Bisabuela de Úrsula Iguarán. Muerta desde hacía más de un siglo cuando transcurre la novela. Úrsula, en su demencia senil, llora durante tres días inconsolables su muerte."}, {"id": "MAYOR_ENRIQUE_GARCIA_ISAZA", "nombre": "Mayor Enrique García Isaza", "apodos": [], "generacion": null, "capitulo": 15, "grupo": null, "descripcion": "Secretario del general Carlos Cortés Vargas. Cofirmante del Decreto Número 4 que declaró cuadrilla de malhechores a los huelguistas bananeros y autorizó al ejército a matarlos."}, {"id": "PADRE_AUGUSTO_ANGEL", "nombre": "Padre Augusto Ángel", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Párroco enviado a Macondo para sustituir al padre Antonio Isabel tras su internamiento en un asilo. Intransigente, audaz y temerario: toca personalmente las campanas varias veces al día y recorre las casas despertando a los dormilones para que vayan a misa. Acaba vencido por la desidia, el polvo ardiente y el sopor del calor."}, {"id": "TRANQUILINA_MARIA_MINIATA_BUENDIA", "nombre": "Tranquilina María Miniata Alacoque Buendía", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Abuela de Úrsula Iguarán. Solo aparece en las visiones delirantes de Úrsula en su vejez: se la ve abanicándose con una pluma de pavorreal en su mecedor de tullida."}, {"id": "AURELIANO_ARCADIO_BUENDIA_ABUELO", "nombre": "Aureliano Arcadio Buendía", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Bisabuelo de Úrsula Iguarán. Aparece en sus delirios seniles vestido con su falso dormán de las guardias virreinales."}, {"id": "AURELIANO_IGUARAN_PADRE", "nombre": "Aureliano Iguarán", "apodos": [], "generacion": null, "capitulo": 17, "grupo": null, "descripcion": "Padre de Úrsula Iguarán. Aparece en los delirios seniles de su hija. Conocido por haber inventado una oración para que se achicharraran y cayeran los gusanos de las vacas."}, {"id": "ANCIANO_ANTILLANO", "nombre": "El anciano antillano", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "El más antiguo de los negros antillanos que quedaron en Macondo. La cabeza algodonada le da aspecto de negativo fotográfico. Canta salmos lúgubres del atardecer en el pórtico de su casa. Único habitante del barrio de tolerancia que guarda memoria del coronel Aureliano Buendía. Bisabuelo de Nigromanta."}, {"id": "ALVARO", "nombre": "Álvaro", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos que Aureliano conoce en la librería del sabio catalán. Descubridor del burdel zoológico El Niño de Oro. Demostró una noche de parranda que la literatura es el mejor juguete que se ha inventado para burlarse de la gente."}, {"id": "GERMAN", "nombre": "Germán", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos de la librería del sabio catalán. Una noche intentó incendiar el burdel de la propietaria risueña para demostrar que no existía."}, {"id": "ALFONSO", "nombre": "Alfonso", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Uno de los cuatro amigos de la librería del sabio catalán. Autor de historias truculentas como la de los alcaravanes que sacaron los ojos a picotazos a cuatro clientes. Le torció el pescuezo al loro del burdel y lo echó en la olla del sancocho."}, {"id": "GABRIEL", "nombre": "Gabriel", "apodos": [], "generacion": null, "capitulo": 19, "grupo": null, "descripcion": "Bisnieto del coronel Gerineldo Márquez. El único de los cuatro amigos de la librería que no pone en duda la existencia del coronel Aureliano Buendía ni la masacre bananera. Une a Aureliano en una complicidad fundada en hechos reales que nadie más cree. Duerme donde lo sorprende la hora; Aureliano lo encomienda a Nigromanta. Gana un concurso literario y parte a París."}, {"id": "CURA_SIN_NOMBRE", "nombre": "El cura sin nombre", "apodos": [], "generacion": null, "capitulo": 20, "grupo": null, "descripcion": "Cura anciano que sustituyó al padre Augusto Ángel en la parroquia de Macondo. El texto precisa que nadie se tomó el trabajo de averiguar su nombre. Atormentado por la artritis y el insomnio de la duda, espera la piedad de Dios tendido en una hamaca mientras los lagartos y las ratas se disputan la herencia del templo vecino."}, {"id": "MERCEDES", "nombre": "Mercedes", "apodos": [], "generacion": null, "capitulo": 20, "grupo": null, "descripcion": "La boticaria silenciosa de Macondo, novia de Gabriel. Único puente entre Aureliano Babilonia y el mundo exterior tras la partida de los amigos: a través de ella llegan las noticias esporádicas de Gabriel en París. Cuando Aureliano vuelve a buscarla tras la muerte de Amaranta Úrsula, la botica ya no existe y nadie recuerda haberla conocido."}, {"id": "SABIO_CATALAN", "nombre": "El sabio catalán", "apodos": [], "generacion": null, "capitulo": 18, "grupo": null, "descripcion": "Librero catalán de Macondo, dueño de una tienda abigarrada y sombría de libros usados en el callejón donde antes se interpretaban los sueños. Cabellera plateada como penacho de cacatúa, ojos azules vivos y estrechos. Escribe sin cesar una prosa morada en hojas sueltas de cuaderno escolar. Le devuelve a Aureliano los cinco libros y el pescadito de oro advirtiéndole: 'El último que leyó esos libros debió ser Isaac el Ciego.'"}];

var GEN_RADIUS = {1:0.085, 2:0.20, 3:0.30, 4:0.37, 5:0.43, 6:0.46, 7:0.485};
var GEN_ROMAN = {1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII'};

function polar(angleDeg, r){
  var a = (angleDeg - 90) * Math.PI / 180;
  return {x: r*Math.cos(a), y: r*Math.sin(a)};
}

// Build index
var byId = {};
RAW_PERSONAJES.forEach(function(p){ byId[p.id] = p; });

// Build rels index
var relsByChar = {};
RAW_RELACIONES.forEach(function(r){
  if(!relsByChar[r.origen]) relsByChar[r.origen] = [];
  if(!relsByChar[r.destino]) relsByChar[r.destino] = [];
  relsByChar[r.origen].push({other: r.destino, tipo: r.tipo, subtipo: r.subtipo, dir:'out'});
  relsByChar[r.destino].push({other: r.origen, tipo: r.tipo, subtipo: r.subtipo, dir:'in'});
});

// Build events index
var eventsByChar = {};
RAW_EVENTOS.forEach(function(e){
  (e.participantes || []).forEach(function(pid){
    if(!eventsByChar[pid]) eventsByChar[pid] = [];
    eventsByChar[pid].push(e);
  });
});

// State
var activeId = null;
var activeGens = new Set();
var activeGrupos = new Set();

function passesFilter(p){
  if(activeGens.size > 0){
    var g = p.generacion || (RING_CFG[p.id] && RING_CFG[p.id].gen) || null;
    if(!activeGens.has(String(g))) return false;
  }
  if(activeGrupos.size > 0){
    var gr = p.grupo || 'sin_grupo';
    if(!activeGrupos.has(gr)) return false;
  }
  return true;
}

// Draw ring background
function drawRingBg(){
  var bg = document.getElementById('bg-rings');
  bg.innerHTML = '';
  Object.keys(GEN_RADIUS).forEach(function(gen){
    var r = GEN_RADIUS[gen];
    var el = document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('cx','0'); el.setAttribute('cy','0');
    el.setAttribute('r', r);
    if(parseInt(gen) === 7) el.setAttribute('stroke-dasharray','0.008 0.012');
    bg.appendChild(el);
  });
}

// Draw character nodes
function drawNodes(){
  var wrap = document.getElementById('char-nodes');
  wrap.innerHTML = '';

  RAW_PERSONAJES.forEach(function(p){
    var cfg = RING_CFG[p.id];
    if(!cfg) return; // not on ring

    var pos = polar(cfg.angle, GEN_RADIUS[cfg.gen]);
    var node = document.createElement('div');
    node.className = 'char-node' + (p.id === activeId ? ' is-active' : '');
    if(activeId && p.id !== activeId){
      var rels = relsByChar[activeId] || [];
      var isRel = rels.some(function(r){ return r.other === p.id; });
      if(!isRel) node.classList.add('is-faded');
    }
    // Filter dimming
    if(!passesFilter(p)) node.classList.add('is-dimmed');

    node.style.left = (50 + pos.x*100) + '%';
    node.style.top  = (50 + pos.y*100) + '%';
    node.dataset.id = p.id;

    if(cfg.symbol && window.createGlyph){
      var symDiv = document.createElement('div');
      symDiv.className = 'cn-sym';
      var g = window.createGlyph(cfg.symbol, 24);
      if(g) symDiv.appendChild(g);
      node.appendChild(symDiv);
    } else {
      var initsEl = document.createElement('div');
      initsEl.className = 'cn-inits';
      var words = p.nombre.split(' ').filter(function(w){ return w && w[0] === w[0].toUpperCase(); });
      initsEl.textContent = words.slice(0,2).map(function(w){ return w[0]; }).join('·');
      node.appendChild(initsEl);
    }

    var nameEl = document.createElement('div');
    nameEl.className = 'cn-name';
    nameEl.textContent = shortName(p.nombre);
    node.appendChild(nameEl);

    wrap.appendChild(node);
  });
}

// Single delegation listener on graph-wrap — survives drawNodes() re-renders
document.getElementById('graph-wrap').addEventListener('click', function(e){
  var node = e.target.closest('.char-node');
  if(node && node.dataset.id) selectChar(node.dataset.id);
});

function shortName(nombre){
  // Abbreviate to first name + last initial or familiar name
  var parts = nombre.split(' ');
  if(parts.length <= 2) return nombre;
  // Keep first word + last word if ≤3 words total
  return parts[0] + ' ' + parts[parts.length-1];
}

// Draw edges
function drawEdges(){
  var g = document.getElementById('edge-lines');
  g.innerHTML = '';
  if(!activeId) return;

  var activeCfg = RING_CFG[activeId];
  if(!activeCfg) return;

  var activePos = polar(activeCfg.angle, GEN_RADIUS[activeCfg.gen]);
  var rels = relsByChar[activeId] || [];

  rels.forEach(function(r){
    var tCfg = RING_CFG[r.other];
    if(!tCfg) return;
    var tPos = polar(tCfg.angle, GEN_RADIUS[tCfg.gen]);

    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', activePos.x); line.setAttribute('y1', activePos.y);
    line.setAttribute('x2', tPos.x);      line.setAttribute('y2', tPos.y);

    var isFamiliar = r.tipo === 'familiar';
    line.setAttribute('stroke', isFamiliar ? 'var(--accent)' : 'currentColor');
    line.setAttribute('stroke-width', isFamiliar ? '0.008' : '0.005');
    line.setAttribute('stroke-opacity', isFamiliar ? '0.8' : '0.5');
    if(!isFamiliar) line.setAttribute('stroke-dasharray','0.012 0.008');
    g.appendChild(line);
  });
}

// Render detail panel
function renderDetail(){
  var panel = document.getElementById('detail-panel');
  var card  = document.getElementById('detail-card');
  var p = byId[activeId];

  if(!p){
    panel.classList.remove('is-open');
    card.innerHTML = '';
    return;
  }
  panel.classList.add('is-open');

  var cfg = RING_CFG[p.id] || {};
  var rels = relsByChar[p.id] || [];
  var gen = p.generacion || cfg.gen || null;

  var html = '<button class="de-close" id="de-close-btn">✕ cerrar</button>';

  // Emblem
  html += '<div class="de-emblem">';
  if(cfg.symbol){
    html += '<div class="de-sym" id="de-sym-placeholder"></div>';
  } else {
    var inits = p.nombre.split(' ').filter(function(w){return w && w[0] === w[0].toUpperCase();}).slice(0,2).map(function(w){return w[0];}).join('·');
    html += '<div class="de-inits">' + inits + '</div>';
  }
  html += '<div class="de-name">' + p.nombre + '</div>';
  if(p.apodos && p.apodos.length){
    html += '<div class="de-alias">«' + p.apodos[0] + '»</div>';
  }
  html += '</div>';

  // Meta
  html += '<div class="de-meta">';
  if(gen) html += '<div class="stat"><div class="m">Generación</div><div class="v">' + GEN_ROMAN[gen] + '</div></div>';
  if(p.capitulo) html += '<div class="stat"><div class="m">Cap. aparición</div><div class="v">' + p.capitulo + '</div></div>';
  var gr = p.grupo || 'sin_grupo';
  var grLabel = {buendia:'Buendía', allegado:'Allegado', sin_grupo:'Otros'}[gr] || gr;
  html += '<div class="stat"><div class="m">Grupo</div><div class="v">' + grLabel + '</div></div>';
  html += '</div>';

  // Bio
  if(p.descripcion){
    html += '<div class="de-bio">' + p.descripcion + '</div>';
  }

  // Relations
  if(rels.length){
    html += '<div class="de-rels">';
    html += '<h4>Vínculos · ' + rels.length + '</h4>';
    rels.forEach(function(r){
      var t = byId[r.other];
      if(!t) return;
      var label = r.subtipo || r.tipo;
      html += '<div class="de-rel" data-other="' + t.id + '">';
      html += '<div class="dr-sym" id="dr-sym-' + t.id + '"></div>';
      html += '<div class="dr-name">' + t.nombre + '</div>';
      html += '<div class="dr-kind">' + label + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Events
  var evs = eventsByChar[p.id] || [];
  if(evs.length){
    html += '<div class="de-events">';
    html += '<h4>Eventos · ' + evs.length + '</h4>';
    evs.forEach(function(e){
      html += '<a class="de-ev" href="cronologia.html?evento=' + e.id + '">';
      html += '<div class="dev-cap">Cap.' + (e.capitulo || '?') + '</div>';
      html += '<div class="dev-title">' + e.titulo + '</div>';
      html += '</a>';
    });
    html += '</div>';
  }

  // Link to detail page
  html += '<a class="de-link" href="personaje.html?id=' + p.id + '">→ Ficha completa</a>';

  card.innerHTML = html;

  // Inject SVG symbols after setting innerHTML
  if(cfg.symbol && window.createGlyph){
    var symEl = document.getElementById('de-sym-placeholder');
    if(symEl){
      var g = window.createGlyph(cfg.symbol, 80);
      if(g) symEl.appendChild(g);
    }
  }
  rels.forEach(function(r){
    var t = byId[r.other];
    if(!t) return;
    var tCfg = RING_CFG[t.id] || {};
    if(tCfg.symbol && window.createGlyph){
      var el = document.getElementById('dr-sym-' + t.id);
      if(el){
        var g = window.createGlyph(tCfg.symbol, 18);
        if(g) el.appendChild(g);
        else el.innerHTML = '<svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="2.5" fill="currentColor"/></svg>';
      }
    } else {
      var el2 = document.getElementById('dr-sym-' + t.id);
      if(el2) el2.innerHTML = '<svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="2.5" fill="currentColor" opacity="0.4"/></svg>';
    }
  });

  // Close button
  document.getElementById('de-close-btn').addEventListener('click', function(){
    selectChar(activeId); // toggles off
  });

  // Relation rows
  card.querySelectorAll('.de-rel').forEach(function(el){
    el.addEventListener('click', function(){
      var otherId = el.dataset.other;
      if(otherId) selectChar(otherId);
    });
  });
}

function selectChar(id){
  activeId = (activeId === id) ? null : id;
  if(viewMode === 'anillos'){
    drawNodes();
    drawEdges();
  } else {
    highlightCy(activeId);
  }
  renderDetail();
}

// Filter handlers
document.querySelectorAll('[data-gen-filter]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var val = btn.dataset.genFilter;
    if(activeGens.has(val)){ activeGens.delete(val); btn.classList.remove('is-active'); }
    else { activeGens.add(val); btn.classList.add('is-active'); }
    drawNodes();
    applyCyFilters();
  });
});
document.querySelectorAll('[data-grupo-filter]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var val = btn.dataset.grupoFilter;
    if(activeGrupos.has(val)){ activeGrupos.delete(val); btn.classList.remove('is-active'); }
    else { activeGrupos.add(val); btn.classList.add('is-active'); }
    drawNodes();
    applyCyFilters();
  });
});

// View toggle
document.querySelectorAll('[data-view-btn]').forEach(function(btn){
  btn.addEventListener('click', function(){
    switchView(btn.dataset.viewBtn);
  });
});

// View switching
function switchView(mode){
  viewMode = mode;
  document.getElementById('cy-wrap').style.display = mode === 'red' ? '' : 'none';
  document.getElementById('graph-wrap').style.display = mode === 'anillos' ? '' : 'none';
  document.querySelectorAll('[data-view-btn]').forEach(function(b){
    b.classList.toggle('is-active', b.dataset.viewBtn === mode);
  });
  document.getElementById('cy-png').textContent = mode === 'red' ? '↓ png red' : '↓ png anillos';
  if(mode === 'red' && cy){ cy.resize(); cy.fit(undefined, 40); highlightCy(activeId); }
  if(mode === 'anillos'){ drawRingBg(); drawNodes(); drawEdges(); }
}

// Cytoscape helpers
function highlightCy(id){
  if(!cy) return;
  cy.elements().removeClass('hl faded');
  if(!id) return;
  var node = cy.getElementById(id);
  if(!node || !node.length) return;
  node.addClass('hl');
  node.connectedEdges().addClass('hl');
  node.neighborhood().addClass('hl');
  cy.elements().not('.hl').addClass('faded');
}

function applyCyFilters(){
  if(!cy) return;
  RAW_PERSONAJES.forEach(function(p){
    passesFilter(p) ? cy.getElementById(p.id).show() : cy.getElementById(p.id).hide();
  });
  cy.edges().forEach(function(e){
    var src = cy.getElementById(e.data('source'));
    var tgt = cy.getElementById(e.data('target'));
    var ok = (activeEdgeTypes.size === 0 || activeEdgeTypes.has(e.data('tipo'))) && src.visible() && tgt.visible();
    ok ? e.show() : e.hide();
  });
}

  document.getElementById('cy-png').addEventListener('click', function(){
    if(viewMode === 'red'){
      var bg = document.documentElement.getAttribute('data-mode') === 'light' ? '#f5f0e8' : '#0c0b09';
      var link = document.createElement('a');
      link.href = cy.png({ scale: 3, bg: bg, full: true });
      link.download = 'cien-anos-soledad-red.png';
      link.click();
    } else {
      downloadRingPNG();
    }
  });

  function downloadRingPNG(){
    var wrap = document.getElementById('graph-wrap');
    var W = wrap.clientWidth, H = wrap.clientHeight;
    var cx = W / 2, cy2 = H / 2;
    var isDark = document.documentElement.getAttribute('data-mode') !== 'light';
    var bgCol    = isDark ? '#0b0907' : '#e8dcc0';
    var inkCol   = isDark ? '#ebe2d0' : '#2c1d0e';
    var accentCol= isDark ? '#e8b94a' : '#9c2a1a';
    var ruleCol  = isDark ? 'rgba(235,226,208,0.20)' : 'rgba(44,29,14,0.28)';
    var inkFaint = isDark ? 'rgba(235,226,208,0.32)' : 'rgba(44,29,14,0.32)';

    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('xmlns', ns);
    svg.setAttribute('width',  W * 2);
    svg.setAttribute('height', H * 2);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    // Background
    var bg = document.createElementNS(ns, 'rect');
    bg.setAttribute('width', W); bg.setAttribute('height', H);
    bg.setAttribute('fill', bgCol);
    svg.appendChild(bg);

    // Vignette
    var defs = document.createElementNS(ns, 'defs');
    var grad = document.createElementNS(ns, 'radialGradient');
    grad.setAttribute('id', 'vig');
    grad.setAttribute('cx', '50%'); grad.setAttribute('cy', '50%');
    grad.setAttribute('r', '50%');
    var s1 = document.createElementNS(ns, 'stop');
    s1.setAttribute('offset', '50%'); s1.setAttribute('stop-color', 'transparent');
    var s2 = document.createElementNS(ns, 'stop');
    s2.setAttribute('offset', '100%');
    s2.setAttribute('stop-color', isDark ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.08)');
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);
    svg.appendChild(defs);
    var vig = document.createElementNS(ns, 'rect');
    vig.setAttribute('width', W); vig.setAttribute('height', H);
    vig.setAttribute('fill', 'url(#vig)');
    svg.appendChild(vig);

    // Ring circles
    Object.keys(GEN_RADIUS).forEach(function(gen){
      var r = GEN_RADIUS[gen] * W;
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy2); c.setAttribute('r', r);
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', ruleCol);
      c.setAttribute('stroke-width', '0.6');
      if(parseInt(gen) === 7) c.setAttribute('stroke-dasharray', '4 6');
      svg.appendChild(c);
    });

    // Edges (only if a character is selected)
    if(activeId){
      var aCfg = RING_CFG[activeId];
      if(aCfg){
        var aPos = polar(aCfg.angle, GEN_RADIUS[aCfg.gen]);
        var ax = cx + aPos.x * W, ay = cy2 + aPos.y * W;
        (relsByChar[activeId] || []).forEach(function(r){
          var tCfg = RING_CFG[r.other];
          if(!tCfg) return;
          var tPos = polar(tCfg.angle, GEN_RADIUS[tCfg.gen]);
          var line = document.createElementNS(ns, 'line');
          line.setAttribute('x1', ax); line.setAttribute('y1', ay);
          line.setAttribute('x2', cx + tPos.x * W); line.setAttribute('y2', cy2 + tPos.y * W);
          var isFam = r.tipo === 'familiar';
          line.setAttribute('stroke', isFam ? accentCol : inkCol);
          line.setAttribute('stroke-width', isFam ? '1.5' : '0.8');
          line.setAttribute('stroke-opacity', isFam ? '0.85' : '0.45');
          if(!isFam) line.setAttribute('stroke-dasharray', '6 5');
          svg.appendChild(line);
        });
      }
    }

    // Character nodes
    RAW_PERSONAJES.forEach(function(p){
      var cfg = RING_CFG[p.id];
      if(!cfg) return;
      var pos = polar(cfg.angle, GEN_RADIUS[cfg.gen]);
      var nx = cx + pos.x * W;
      var ny = cy2 + pos.y * W;
      var isActive = p.id === activeId;
      var dotColor = isActive ? accentCol : (activeId ? inkFaint : inkFaint);
      var nameColor = isActive ? accentCol : (activeId ? inkFaint : inkCol);

      var dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', nx); dot.setAttribute('cy', ny); dot.setAttribute('r', isActive ? 5 : 3.5);
      dot.setAttribute('fill', isActive ? accentCol : 'none');
      dot.setAttribute('stroke', dotColor);
      dot.setAttribute('stroke-width', '1.2');
      svg.appendChild(dot);

      var name = shortName(p.nombre);
      // Split into two lines if needed
      var parts = name.split(' ');
      var line1 = parts[0] || '';
      var line2 = parts.slice(1).join(' ');
      var fontSize = 9;
      var labelY = ny + 13;

      function makeText(text, y){
        var t = document.createElementNS(ns, 'text');
        t.setAttribute('x', nx); t.setAttribute('y', y);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('fill', nameColor);
        t.setAttribute('font-size', fontSize);
        t.setAttribute('font-family', 'Garamond, Georgia, "Times New Roman", serif');
        t.setAttribute('font-style', isDark ? 'italic' : 'normal');
        t.textContent = text;
        return t;
      }
      svg.appendChild(makeText(line1, labelY));
      if(line2) svg.appendChild(makeText(line2, labelY + 11));
    });

    // Convert SVG → canvas → PNG
    var serializer = new XMLSerializer();
    var svgBlob = new Blob([serializer.serializeToString(svg)], {type: 'image/svg+xml'});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      canvas.width = W * 2; canvas.height = H * 2;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      var link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'cien-anos-soledad-anillos.png';
      link.click();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); };
    img.src = url;
  }

  // Tooltip
  var tooltip = document.getElementById('cy-tooltip');
  cy.on('mouseover', 'node', function(evt){
    var pos = evt.renderedPosition;
    tooltip.textContent = evt.target.data('label');
    tooltip.style.left = (pos.x + 14) + 'px';
    tooltip.style.top  = (pos.y - 10) + 'px';
    tooltip.style.opacity = '1';
  });
  cy.on('mouseout pan zoom', 'node', function(){ tooltip.style.opacity = '0'; });

  // Edge type filter chips
  var filtersEl = document.getElementById('cy-filters');
  var lbl = document.createElement('span');
  lbl.className = 'label'; lbl.textContent = 'Vínculo';
  filtersEl.appendChild(lbl);
  Object.entries(EDGE_COL).forEach(function(entry){
    var tipo = entry[0], color = entry[1];
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.tipo = tipo;
    chip.innerHTML = '<span class="cy-dot" style="background:'+color+'"></span>' + (EDGE_LABELS[tipo] || tipo);
    chip.addEventListener('click', function(){
      if(activeEdgeTypes.has(tipo)){
        activeEdgeTypes.delete(tipo);
        chip.classList.remove('is-active');
      } else {
        activeEdgeTypes.add(tipo);
        chip.classList.add('is-active');
      }
      applyCyFilters();
    });
    filtersEl.appendChild(chip);
  });

  // Re-render mode-aware text colors on mode toggle
  document.querySelectorAll('[data-mode-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      setTimeout(function(){
        var dm = document.documentElement.dataset.mode === 'dark';
        var tc = dm ? '#c8bfb0' : '#3a2a1a';
        var tb = dm ? '#0c0b09' : '#f0e5d4';
        cy.nodes().style({ 'color': tc, 'text-background-color': tb });
      }, 50);
    });
  });
})();

// Open character panel from URL param ?personaje=ID
(function(){
  try {
    var pid = new URLSearchParams(location.search).get('personaje');
    if(pid && byId[pid]) selectChar(pid);
  } catch(e){}
})();

})();
</script>
